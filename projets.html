<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes projets - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center text-lg">🌍</div>
      <span class="font-bold text-sm">Espace Diaspora</span>
    </div>
    <div class="flex items-center gap-3">
      <button class="relative text-xl">🔔</button>
      <a href="profil.html" class="w-9 h-9 rounded-full bg-emerald-500/30 flex items-center justify-center text-xs font-bold">IT</a>
    </div>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <div class="flex items-center gap-3">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher un projet..." 
        class="flex-1 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500">
      <a href="projet-creer.html" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-xl text-sm font-bold whitespace-nowrap">+ Nouveau</a>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4">
      <button data-filter="all" class="filter-btn bg-emerald-600 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Tous</button>
      <button data-filter="active" class="filter-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Actifs</button>
      <button data-filter="draft" class="filter-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">En préparation</button>
      <button data-filter="completed" class="filter-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Terminés</button>
    </div>

    <div id="projects-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script>
    let allProjects = [];

    function getStatusBadge(status) {
      const badges = {
        'active': 'bg-emerald-500/20 text-emerald-300|En cours',
        'draft': 'bg-orange-500/20 text-orange-300|En préparation',
        'completed': 'bg-slate-500/20 text-slate-300|Terminé',
        'paused': 'bg-yellow-500/20 text-yellow-300|En pause',
        'cancelled': 'bg-red-500/20 text-red-300|Annulé'
      };
      const [colors, label] = (badges[status] || badges.draft).split('|');
      return `<span class="text-[10px] ${colors} px-2 py-0.5 rounded-full font-semibold">${label}</span>`;
    }

    function getProgress(status) {
      if (status === 'completed') return 100;
      if (status === 'active') return 40;
      if (status === 'draft') return 10;
      return 0;
    }

    function renderProjects(projects) {
      const list = document.getElementById('projects-list');
      if (projects.length === 0) {
        list.innerHTML = '<p class="text-slate-400 text-sm text-center py-8">Aucun projet. Creez votre premier projet !</p>';
        return;
      }
      list.innerHTML = projects.map(p => `
        <a href="projet-detail.html?id=${p.id}" class="block bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold">${p.title}</h3>
            ${getStatusBadge(p.status)}
          </div>
          <p class="text-xs text-slate-400 mb-3">${p.description || ''}</p>
          <div class="w-full bg-slate-700/50 rounded-full h-1.5 mb-2">
            <div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${getProgress(p.status)}%"></div>
          </div>
          <div class="flex justify-between text-[11px] text-slate-400">
            <span>💰 ${Number(p.total_budget).toLocaleString()} ${p.currency || 'XAF'}</span>
            <span>📍 ${p.city || ''}, ${p.country || ''}</span>
          </div>
        </a>
      `).join('');
    }

    async function loadProjects() {
      const userId = localStorage.getItem('user_id');
      if (!userId) {
        document.getElementById('projects-list').innerHTML = '<p class="text-slate-400 text-sm text-center py-8">Connectez-vous pour voir vos projets</p>';
        return;
      }

      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/projects?select=*&owner_id=eq.' + userId + '&order=created_at.desc',
          { headers: authHeaders() }
        );
        const data = await res.json();
        if (Array.isArray(data)) {
          allProjects = data;
        } else {
          allProjects = [];
        }
      } catch (e) {
        allProjects = [];
      }
      renderProjects(allProjects);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        const filter = btn.dataset.filter;
        const filtered = filter === 'all' ? allProjects : allProjects.filter(p => p.status === filter);
        renderProjects(filtered);
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allProjects.filter(p => p.title.toLowerCase().includes(q));
      renderProjects(filtered);
    });

    loadProjects();
  </script>
</body>
</html>
