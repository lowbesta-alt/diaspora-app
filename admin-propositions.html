<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propositions de jalons - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Propositions de jalons</h1>
      <p class="text-sm text-slate-400 mt-1">Validez les découpages proposés par les artisans</p>
    </div>

    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-amber-400" id="stat-pending">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">En attente</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-emerald-400" id="stat-validated">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Validés</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-red-400" id="stat-rejected">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Refusés</div>
      </div>
    </section>

    <div id="projects-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-validations.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">✅</span>Validations</a>
    <a href="admin-propositions.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">📋</span>Propositions</a>
    <a href="admin-templates.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📐</span>Modèles</a>
    <a href="admin-reports.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📸</span>Rapports</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    async function loadProposals() {
      const list = document.getElementById('projects-list');
      try {
        // Récupère tous les jalons avec proposal_status
        const data = await apiGet('milestones', 'proposal_status=not.is.null&order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];

        const pending = valid.filter(m => m.proposal_status === 'pending');
        const validated = valid.filter(m => m.proposal_status === 'validated');
        const rejected = valid.filter(m => m.proposal_status === 'rejected');

        document.getElementById('stat-pending').textContent = pending.length;
        document.getElementById('stat-validated').textContent = validated.length;
        document.getElementById('stat-rejected').textContent = rejected.length;

        if (valid.length === 0) {
          list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">📭</div><p class="text-slate-400 text-sm">Aucune proposition pour le moment</p><p class="text-slate-500 text-xs mt-2">Les propositions des artisans apparaitront ici.</p></div>';
          return;
        }

        // Groupe par projet
        const groups = {};
        for (const m of valid) {
          if (!groups[m.project_id]) groups[m.project_id] = [];
          groups[m.project_id].push(m);
        }

        const cards = [];
        for (const projectId in groups) {
          const milestones = groups[projectId];
          const projectPending = milestones.filter(m => m.proposal_status === 'pending');
          const isPending = projectPending.length > 0;

          // Récupère le nom du projet
          let projectTitle = 'Projet';
          try {
            const p = await apiGet('projects', 'id=eq.' + projectId);
            if (Array.isArray(p) && p[0]) projectTitle = p[0].title;
          } catch (e) {}

          // Récupère l'auteur de la proposition
          let proposerName = 'Artisan';
          const first = milestones[0];
          if (first.proposed_by) {
            try {
              const pr = await apiGet('profiles', 'id=eq.' + first.proposed_by);
              if (Array.isArray(pr) && pr[0]) proposerName = pr[0].full_name || pr[0].email;
            } catch (e) {}
          }

          // Calcule le total des %
          let totalAmount = 0;
          milestones.forEach(m => { totalAmount += Number(m.amount) || 0; });

          // Statut global du projet
          let globalStatus = 'pending';
          if (milestones.every(m => m.proposal_status === 'validated')) globalStatus = 'validated';
          else if (milestones.some(m => m.proposal_status === 'rejected')) globalStatus = 'rejected';

          let badge = '';
          if (globalStatus === 'pending') badge = '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">EN ATTENTE</span>';
          else if (globalStatus === 'validated') badge = '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">VALIDÉE</span>';
          else if (globalStatus === 'rejected') badge = '<span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full font-bold">REFUSÉE</span>';

          cards.push(`
            <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl overflow-hidden">
              <div class="p-4">
                <div class="flex justify-between items-start gap-3 mb-2">
                  <h3 class="font-extrabold text-sm flex-1">${escapeHtml(projectTitle)}</h3>
                  ${badge}
                </div>
                <p class="text-[11px] text-slate-400 mb-2">Par : ${escapeHtml(proposerName)}</p>
                <div class="flex justify-between items-center">
                  <span class="text-[11px] text-slate-400">📋 ${milestones.length} jalon(s) · ${totalAmount.toLocaleString('fr-FR')} XAF</span>
                  <a href="admin-proposition-detail.html?project_id=${projectId}" class="text-[11px] text-sky-400 font-bold">Ouvrir →</a>
                </div>
              </div>
            </div>
          `);
        }

        list.innerHTML = cards.join('');

      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur : ' + e.message + '</p>';
      }
    }

    loadProposals();
  </script>
</body>
</html>
