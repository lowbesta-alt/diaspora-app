<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Utilisateurs</h1>
      <p class="text-sm text-slate-400 mt-1">Gestion des comptes et des rôles</p>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Rechercher un utilisateur..." class="w-full px-4 py-3 rounded-xl bg-white/5 text-sm placeholder-slate-500 focus:outline-none transition" style="border: 1px solid rgba(16,185,129,0.3);">

    <section class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold" id="stat-total">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-emerald-400" id="stat-investor">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Clients</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-amber-400" id="stat-provider">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Artisans</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-sky-400" id="stat-admin">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Admins</div>
      </div>
    </section>

    <div id="users-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    let allUsers = [];

    const roleLabels = {
      'investor': { label: 'Client', color: 'text-emerald-300', bg: 'bg-emerald-500/20' },
      'provider': { label: 'Artisan', color: 'text-amber-300', bg: 'bg-amber-500/20' },
      'project_manager': { label: 'Chef chantier', color: 'text-amber-300', bg: 'bg-amber-500/20' },
      'admin': { label: 'Admin', color: 'text-sky-300', bg: 'bg-sky-500/20' }
    };

    function render(list) {
      const container = document.getElementById('users-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">👥</div><p class="text-slate-400 text-sm">Aucun utilisateur</p></div>';
        return;
      }
      container.innerHTML = list.map(u => {
        const role = roleLabels[u.default_role] || roleLabels.investor;
        const initials = (u.full_name || u.email || 'U').substring(0, 2).toUpperCase();
        const kycBadge = u.kyc_status === 'verified' ? '✅' : u.kyc_status === 'pending' ? '⏳' : '';
        return `
          <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-sky-500 to-sky-400 flex items-center justify-center font-extrabold text-sm flex-shrink-0">
                ${initials}
              </div>
              <div class="min-w-0">
                <h3 class="font-extrabold text-sm truncate">${escapeHtml(u.full_name || 'Sans nom')} ${kycBadge}</h3>
                <p class="text-xs text-slate-400 truncate">${escapeHtml(u.email)}</p>
                <span class="inline-block text-[10px] ${role.bg} ${role.color} px-2 py-0.5 rounded-full font-bold mt-1">${role.label}</span>
              </div>
            </div>
            <button onclick="deleteUser('${u.id}')" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 p-2.5 rounded-xl text-sm transition flex-shrink-0 ml-2" title="Supprimer l'utilisateur">
              🗑️
            </button>
          </div>
        `;
      }).join('');
    }

    function updateStats(list) {
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-investor').textContent = list.filter(u => u.default_role === 'investor').length;
      document.getElementById('stat-provider').textContent = list.filter(u => u.default_role === 'provider' || u.default_role === 'project_manager').length;
      document.getElementById('stat-admin').textContent = list.filter(u => u.default_role === 'admin').length;
    }

    async function load() {
      try {
        const data = await apiGet('profiles', 'order=created_at.desc');
        allUsers = Array.isArray(data) ? data : [];
      } catch (e) {
        allUsers = [];
      }
      render(allUsers);
      updateStats(allUsers);
    }

    // Fonction de suppression d'un utilisateur
    async function deleteUser(userId) {
      if (!confirm("Voulez-vous vraiment supprimer cet utilisateur test ?")) return;

      try {
        const token = localStorage.getItem('access_token');
        const res = await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + userId, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (res.ok || res.status === 204) {
          alert("Utilisateur supprimé avec succès !");
          load(); // Recharge la liste automatiquement
        } else {
          alert("Erreur lors de la suppression.");
        }
      } catch (err) {
        alert("Erreur réseau : " + err.message);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      render(allUsers.filter(u => (u.email || '').toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q)));
    });

    load();
  </script>
</body>
</html>
