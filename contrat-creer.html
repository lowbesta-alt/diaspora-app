<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un contrat - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="contrats.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Créer un contrat</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-start gap-3">
      <span class="text-lg">🛡️</span>
      <p class="text-xs text-amber-200">Vous créez un contrat au nom de l'administration. Les deux parties devront le signer.</p>
    </div>

    <!-- ÉTAPE 1 : PROJET -->
    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Titre du contrat *</label>
        <input type="text" id="title" placeholder="Ex : Contrat de prestation Villa Kribi" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Type de contrat</label>
        <select id="contractType" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
          <option value="Prestation">Prestation de services</option>
          <option value="Construction">Construction / BTP</option>
          <option value="Rénovation">Rénovation</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Avenant">Avenant</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Projet associé *</label>
        <select id="project" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
          <option value="">Chargement...</option>
        </select>
        <p class="text-[10px] text-slate-400 mt-1">👉 Choisissez d'abord un projet : les listes ci-dessous s'adapteront automatiquement.</p>
      </div>
    </section>

    <!-- ÉTAPE 2 : PARTIES (filtrées selon le projet) -->
    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Investisseur (client) *</label>
        <select id="investor" disabled class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 disabled:opacity-50">
          <option value="">Sélectionnez un projet d'abord</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Prestataire (artisan) *</label>
        <select id="provider" disabled class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 disabled:opacity-50">
          <option value="">Sélectionnez un projet d'abord</option>
        </select>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Montant total (XAF)</label>
        <input type="number" id="amount" placeholder="Ex : 40000000" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Contenu du contrat (optionnel)</label>
        <p class="text-[10px] text-slate-400 mb-2">Laissez vide pour utiliser le modèle standard.</p>
        <textarea id="content" rows="6" placeholder="Collez ici le texte du contrat si vous voulez un contenu personnalisé…" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
      </div>
    </section>

    <section class="flex gap-2">
      <a href="contrats.html" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl font-semibold text-sm text-center">Annuler</a>
      <button id="btn-create" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold text-sm">Créer le contrat</button>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');
    if (getCurrentUserRole() !== 'admin') {
      alert('Accès réservé à l\'administrateur');
      window.location.href = 'contrats.html';
    }

    // Cache de tous les projets + tous les profils (chargés une seule fois)
    let allProjects = [];
    let allProfiles = {};    // id -> profile
    let membersCache = {};   // projectId -> [member rows]

    /* ============================================
       CHARGEMENT INITIAL
       ============================================ */
    async function init() {
      // 1) Projets
      try {
        const data = await apiGet('projects', 'order=created_at.desc');
        allProjects = Array.isArray(data) ? data : [];
      } catch (e) { allProjects = []; }

      // 2) Tous les profils (pour résoudre les noms)
      try {
        const profs = await apiGet('profiles', 'limit=200');
        if (Array.isArray(profs)) for (const p of profs) allProfiles[p.id] = p;
      } catch (e) {}

      // 3) Remplit le select projet
      const selectP = document.getElementById('project');
      if (allProjects.length === 0) {
        selectP.innerHTML = '<option value="">Aucun projet disponible</option>';
        return;
      }
      selectP.innerHTML = '<option value="">Sélectionner un projet…</option>' +
        allProjects.map(p => '<option value="' + p.id + '">' + escapeHtml(p.title) + '</option>').join('');

      // 4) Écoute le changement de projet
      selectP.addEventListener('change', onProjectChange);
    }

    /* ============================================
       QUAND ON CHANGE DE PROJET → filtre les parties
       ============================================ */
    async function onProjectChange(e) {
      const projectId = e.target.value;
      const selectI = document.getElementById('investor');
      const selectP = document.getElementById('provider');

      if (!projectId) {
        selectI.disabled = true;
        selectP.disabled = true;
        selectI.innerHTML = '<option value="">Sélectionnez un projet d\'abord</option>';
        selectP.innerHTML = '<option value="">Sélectionnez un projet d\'abord</option>';
        return;
      }

      // Affiche un message de chargement
      selectI.disabled = true;
      selectP.disabled = true;
      selectI.innerHTML = '<option>Chargement…</option>';
      selectP.innerHTML = '<option>Chargement…</option>';

      // 1) Récupère les membres du projet
      let members = membersCache[projectId];
      if (!members) {
        try {
          const data = await apiGet('project_members', 'project_id=eq.' + projectId + '&is_active=eq.true');
          members = Array.isArray(data) ? data : [];
          membersCache[projectId] = members;
        } catch (err) {
          members = [];
        }
      }

      // 2) Récupère le projet pour connaître l'owner
      const proj = allProjects.find(p => p.id === projectId);
      const ownerId = proj ? proj.owner_id : null;

      // 3) Construit la liste des investisseurs
      //    = owner_id + tous les membres avec role 'investor'
      const investorIds = new Set();
      if (ownerId) investorIds.add(ownerId);
      for (const m of members) {
        if (m.role === 'investor' && m.user_id) investorIds.add(m.user_id);
      }

      // 4) Construit la liste des prestataires
      //    = membres avec role 'provider' ou 'project_manager'
      const providerIds = new Set();
      for (const m of members) {
        if ((m.role === 'provider' || m.role === 'project_manager') && m.user_id) {
          providerIds.add(m.user_id);
        }
      }

      // 5) Remplit les <select>
      const investorOptions = Array.from(investorIds).map(uid => {
        const p = allProfiles[uid];
        const name = p ? (p.full_name || p.email) : 'Utilisateur';
        return { id: uid, name: name };
      }).sort((a, b) => a.name.localeCompare(b.name));

      const providerOptions = Array.from(providerIds).map(uid => {
        const p = allProfiles[uid];
        const name = p ? (p.full_name || p.email) : 'Utilisateur';
        return { id: uid, name: name };
      }).sort((a, b) => a.name.localeCompare(b.name));

      // INVESTISSEUR
      if (investorOptions.length === 0) {
        selectI.innerHTML = '<option value="">Aucun investisseur lié à ce projet</option>';
        selectI.disabled = true;
      } else {
        selectI.innerHTML = '<option value="">Sélectionner…</option>' +
          investorOptions.map(o => '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>').join('');
        selectI.disabled = false;
        // Auto-sélection : si un seul, on le met par défaut
        if (investorOptions.length === 1) selectI.value = investorOptions[0].id;
      }

      // PRESTATAIRE
      if (providerOptions.length === 0) {
        selectP.innerHTML = '<option value="">Aucun artisan assigné à ce projet</option>';
        selectP.disabled = true;
      } else {
        selectP.innerHTML = '<option value="">Sélectionner…</option>' +
          providerOptions.map(o => '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>').join('');
        selectP.disabled = false;
        // Auto-sélection : si un seul, on le met par défaut
        if (providerOptions.length === 1) selectP.value = providerOptions[0].id;
      }
    }

    /* ============================================
       CRÉATION
       ============================================ */
    document.getElementById('btn-create').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const contractType = document.getElementById('contractType').value;
      const projectId = document.getElementById('project').value;
      const investorId = document.getElementById('investor').value;
      const providerId = document.getElementById('provider').value;
      const amount = document.getElementById('amount').value;
      const content = document.getElementById('content').value.trim();

      if (!title) { alert('Entrez un titre'); return; }
      if (!projectId) { alert('Sélectionnez un projet (obligatoire)'); return; }
      if (!investorId) { alert('Sélectionnez l\'investisseur'); return; }
      if (!providerId) { alert('Sélectionnez le prestataire'); return; }
      if (investorId === providerId) { alert('Investisseur et prestataire doivent être différents'); return; }

      const btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.textContent = 'Création...';

      const payload = {
        project_id: projectId,
        title: title,
        contract_type: contractType,
        party_investor_id: investorId,
        party_provider_id: providerId,
        status: 'pending_signature',
        created_at: new Date().toISOString()
      };

      if (amount) payload.total_amount = Number(amount);
      if (content) payload.content = content;

      try {
        try {
          await apiPost('contracts', payload);
        } catch (err) {
          console.warn('[create] full payload failed, retry minimal', err);
          await apiPost('contracts', {
            project_id: projectId,
            title: title,
            contract_type: contractType,
            party_investor_id: investorId,
            party_provider_id: providerId,
            status: 'pending_signature'
          });
        }

        showSuccess('Contrat créé !');
        setTimeout(() => { window.location.href = 'contrats.html'; }, 800);

      } catch (e) {
        console.error('[create]', e);
        showError(e.message || 'Erreur création');
        btn.disabled = false;
        btn.textContent = 'Créer le contrat';
      }
    });

    init();
  </script>
</body>
</html>
