<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-2xl mx-auto space-y-4 pt-6">

    <section class="relative overflow-hidden rounded-3xl border border-red-500/30">
      <div class="absolute inset-0 bg-gradient-to-br from-red-900/40 via-slate-900/60 to-orange-900/30"></div>
      <div class="relative p-6">
        <div class="flex items-start gap-4 mb-5">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-red-600 to-orange-500 flex items-center justify-center flex-shrink-0 shadow-lg shadow-red-500/40">
            <span class="text-2xl">📹</span>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <h2 class="text-base font-extrabold tracking-tight">Visite en direct</h2>
              <span class="flex items-center gap-1 text-[10px] bg-red-500/20 border border-red-500/40 text-red-300 px-2 py-0.5 rounded-full font-bold">
                <span class="w-1.5 h-1.5 bg-red-400 rounded-full animate-pulse"></span>
                LIVE
              </span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
              Filmez le chantier en direct et partagez le lien aux investisseurs.
            </p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-start-live" class="bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-red-500/30 transition">
            <span>📹</span> Démarrer
          </button>
          <button id="btn-join-live" class="bg-white/10 hover:bg-white/15 backdrop-blur border border-white/15 py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition">
            <span>👀</span> Rejoindre
          </button>
        </div>
      </div>
    </section>

    <!-- Section Support / Admin -->
    <a id="support-link" href="#" class="block bg-gradient-to-br from-sky-600/20 to-blue-900/20 border border-sky-500/40 rounded-2xl p-4 hover:bg-sky-500/10 transition">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-sky-500/30">
          <span class="text-2xl">🎧</span>
        </div>
        <div class="flex-1">
          <h3 class="font-bold text-sm">Contacter l'administrateur</h3>
          <p class="text-[11px] text-slate-300 mt-0.5" id="support-subtitle">Support et assistance</p>
        </div>
        <span class="text-sky-400 text-xl">›</span>
      </div>
    </a>

    <div class="relative">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher une conversation..." class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white/5 border border-white/10 text-sm placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:bg-white/[0.07] transition">
    </div>

    <h2 class="text-sm font-extrabold text-slate-300 uppercase tracking-wider pt-2">💬 Conversations par chantier</h2>

    <div id="conversations-list" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');
    setupUserHeader();

    const userId = getCurrentUserId();
    const role = getCurrentUserRole();

    // Lien Support → trouver l'admin
    (async function initSupport() {
      const adminId = await getAdminUserId();
      if (!adminId) {
        document.getElementById('support-link').style.display = 'none';
        return;
      }
      document.getElementById('support-link').href = 'message-direct.html?to=' + adminId;
      if (role === 'admin') {
        document.getElementById('support-subtitle').textContent = 'Vous êtes administrateur';
        document.getElementById('support-link').href = '#';
        document.getElementById('support-link').style.opacity = '0.6';
        document.getElementById('support-link').style.pointerEvents = 'none';
      }
    })();

    function getLiveRoomName() { return 'diaspora-chantier-' + Date.now(); }

    document.getElementById('btn-start-live').addEventListener('click', () => {
      const roomName = getLiveRoomName();
      const liveUrl = 'https://meet.jit.si/' + roomName;
      const message = "🎥 VISITE EN DIRECT DU CHANTIER\n\nBonjour,\nJe vais démarrer une visite vidéo en direct du chantier.\n\nCliquez sur ce lien pour rejoindre :\n" + liveUrl + "\n\nÀ tout de suite !";
      if (navigator.clipboard) navigator.clipboard.writeText(liveUrl).catch(() => {});
      localStorage.setItem('live_url', liveUrl);
      const choice = prompt("Lien de visite créé !\n\nTapez :\n1 = Envoyer par WhatsApp\n2 = Ouvrir la caméra\n3 = Copier le lien");
      if (choice === '1') window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank');
      else if (choice === '2') window.open(liveUrl, '_blank');
      else if (choice === '3') showSuccess('Lien copié !');
    });

    document.getElementById('btn-join-live').addEventListener('click', () => {
      let liveUrl = localStorage.getItem('live_url');
      if (!liveUrl) {
        const entered = prompt("Collez ici le lien reçu par WhatsApp ou Email :");
        if (!entered) return;
        liveUrl = entered;
      }
      window.open(liveUrl, '_blank');
    });

    async function loadConversations() {
      const list = document.getElementById('conversations-list');
      try {
        let projects = [];

        if (role === 'admin') {
          const all = await apiGet('projects', 'order=created_at.desc');
          projects = (Array.isArray(all) ? all : []).map(p => ({ projectId: p.id, projectTitle: p.title, city: p.city, role: 'admin' }));
        } else {
          const members = await apiGet('project_members', 'user_id=eq.' + userId + '&is_active=eq.true');
          if (!Array.isArray(members) || members.length === 0) {
            list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><div class="text-3xl mb-2 opacity-40">💬</div><p class="text-slate-400 text-xs">Aucune conversation par chantier</p></div>';
            return;
          }
          for (const m of members) {
            try {
              const proj = await apiGet('projects', 'id=eq.' + m.project_id);
              if (Array.isArray(proj) && proj[0]) {
                projects.push({ projectId: m.project_id, projectTitle: proj[0].title, city: proj[0].city || '', role: m.role });
              }
            } catch (e) {}
          }
        }

        if (projects.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucune conversation</p>';
          return;
        }

        list.innerHTML = projects.map(c => `
          <a href="message-detail.html?id=${c.projectId}" class="group flex items-center gap-3 bg-white/5 hover:bg-white/[0.08] border border-white/10 rounded-2xl p-3.5 transition">
            <div class="relative flex-shrink-0">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-600 to-sky-500 flex items-center justify-center font-extrabold text-sm shadow-lg shadow-sky-500/30">
                ${escapeHtml(c.projectTitle.substring(0, 2).toUpperCase())}
              </div>
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-sm truncate">${escapeHtml(c.projectTitle)}</h3>
              <p class="text-[10px] text-sky-400 font-semibold uppercase tracking-wider mt-0.5">${escapeHtml(c.role)}</p>
              <p class="text-xs text-slate-400 truncate mt-0.5">${c.city ? '📍 ' + escapeHtml(c.city) + ' — ' : ''}Touchez pour ouvrir</p>
            </div>
            <span class="text-slate-500 group-hover:text-sky-400 transition">›</span>
          </a>
        `).join('');

      } catch (e) {
        list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><p class="text-red-400 text-sm">Erreur de chargement</p></div>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('#conversations-list > a').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });

    loadConversations();
  </script>
</body>
</html>
