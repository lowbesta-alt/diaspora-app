<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-2xl mx-auto space-y-4 pt-6">

    <!-- DEBUG : marqueur de version -->
    <div id="version-marker" class="text-center text-[10px] text-emerald-400/60 font-mono">build v2</div>

    <!-- VISITE EN DIRECT -->
    <section class="relative overflow-hidden rounded-3xl border border-red-500/30">
      <div class="absolute inset-0 bg-gradient-to-br from-red-900/40 via-slate-900/60 to-orange-900/30"></div>
      <div class="relative p-6">
        <div class="flex items-start gap-4 mb-5">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-red-600 to-orange-500 flex items-center justify-center flex-shrink-0 shadow-lg shadow-red-500/40">
            <span class="text-2xl">📹</span>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <h2 class="text-base font-extrabold tracking-tight">Visite en direct</h2>
              <span class="flex items-center gap-1 text-[10px] bg-red-500/20 border border-red-500/40 text-red-300 px-2 py-0.5 rounded-full font-bold">
                <span class="w-1.5 h-1.5 bg-red-400 rounded-full animate-pulse"></span>
                LIVE
              </span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
              Filmez le chantier en direct et partagez le lien aux investisseurs.
            </p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-start-live" class="bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-red-500/30 transition">
            <span>📹</span> Démarrer
          </button>
          <button id="btn-join-live" class="bg-white/10 hover:bg-white/15 backdrop-blur border border-white/15 py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition">
            <span>👀</span> Rejoindre
          </button>
        </div>
      </div>
    </section>

    <!-- CARTE SUPPORT : toujours visible (sauf admin) -->
    <a id="support-link" href="#" style="display:none;"
       class="block bg-gradient-to-br from-sky-600/25 to-blue-900/25 border border-sky-500/50 rounded-2xl p-4 hover:bg-sky-500/15 transition">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-sky-500/30">
          <span class="text-2xl">🎧</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-bold text-sm">Support &amp; Administration</h3>
            <span class="text-[9px] bg-sky-500/20 border border-sky-400/40 text-sky-200 px-1.5 py-0.5 rounded-full font-bold tracking-wider">🔒 PRIVÉ</span>
          </div>
          <p class="text-[11px] text-slate-300 mt-0.5" id="support-subtitle">Chargement…</p>
        </div>
        <span class="text-sky-400 text-xl">›</span>
      </div>
    </a>

    <!-- CARTE DEBUG : affiche le rôle détecté -->
    <div id="debug-info" class="text-[10px] text-slate-500 font-mono text-center"></div>

    <!-- BOÎTE DE RÉCEPTION ADMIN -->
    <section id="admin-inbox-section" style="display:none;">
      <h2 class="text-sm font-extrabold text-slate-300 uppercase tracking-wider pt-2 pb-2">📥 Messages reçus</h2>
      <div id="admin-inbox-list" class="space-y-2">
        <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
      </div>
    </section>

    <!-- RECHERCHE -->
    <div class="relative">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher une conversation..." class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white/5 border border-white/10 text-sm placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:bg-white/[0.07] transition">
    </div>

    <!-- CONVERSATIONS PAR CHANTIER -->
    <h2 class="text-sm font-extrabold text-slate-300 uppercase tracking-wider pt-2">💬 Conversations par chantier</h2>
    <div id="conversations-list" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');
    setupUserHeader();

    const userId = getCurrentUserId();
    const role = getCurrentUserRole();

    // Affiche le rôle détecté en bas (pour debug)
    document.getElementById('debug-info').textContent = 'rôle détecté : ' + role + ' | user : ' + userId;

    /* ============ CARTE SUPPORT ============ */
    (async function initSupport() {
      const card = document.getElementById('support-link');
      const subtitle = document.getElementById('support-subtitle');

      // Pour l'admin : carte cachée + inbox visible
      if (role === 'admin') {
        card.style.display = 'none';
        loadAdminInbox();
        return;
      }

      // Pour les autres : carte visible par défaut
      card.style.display = 'block';

      try {
        const admins = await apiGet('profiles', 'default_role=eq.admin&limit=1');
        console.log('[support] réponse admins =', admins);

        let adminId = null;
        if (Array.isArray(admins) && admins.length > 0 && admins[0] && admins[0].id) {
          adminId = admins[0].id;
        } else if (admins && admins.id) {
          adminId = admins.id;
        }

        if (adminId) {
          card.href = 'message-direct.html?to=' + adminId + '&v=2';
          subtitle.textContent = 'Canal privé avec l\'admin — vous seul(e)';
        } else {
          subtitle.textContent = 'Admin introuvable — cliquez quand même';
          card.href = 'messages.html';
          console.warn('[support] aucun admin trouvé :', admins);
        }
      } catch (e) {
        console.error('[support] erreur', e);
        subtitle.textContent = 'Erreur de chargement — ' + (e && e.message ? e.message : e);
        card.href = 'messages.html';
      }
    })();

    /* ============ BOÎTE DE RÉCEPTION ADMIN ============ */
    async function loadAdminInbox() {
      const section = document.getElementById('admin-inbox-section');
      const list = document.getElementById('admin-inbox-list');
      section.style.display = 'block';

      try {
        const msgs = await apiGet('direct_messages',
          'recipient_id=eq.' + userId + '&order=created_at.desc&limit=500');

        if (!Array.isArray(msgs) || msgs.length === 0) {
          list.innerHTML = '<div class="text-center py-6 bg-white/5 border border-white/10 rounded-2xl"><div class="text-3xl mb-2 opacity-40">📭</div><p class="text-slate-400 text-xs">Aucun message reçu pour le moment</p></div>';
          return;
        }

        const bySender = new Map();
        for (const m of msgs) {
          if (!bySender.has(m.sender_id)) bySender.set(m.sender_id, { lastMsg: m, unread: 0 });
          if (!m.read_at) bySender.get(m.sender_id).unread++;
        }

        const senderIds = Array.from(bySender.keys());
        let profilesMap = new Map();
        if (senderIds.length > 0) {
          const profiles = await apiGet('profiles', 'id=in.(' + senderIds.join(',') + ')');
          if (Array.isArray(profiles)) for (const p of profiles) profilesMap.set(p.id, p);
        }

        const entries = Array.from(bySender.entries()).sort((a, b) =>
          new Date(b[1].lastMsg.created_at) - new Date(a[1].lastMsg.created_at));

        list.innerHTML = entries.map(([senderId, info]) => {
          const p = profilesMap.get(senderId);
          const name = (p && (p.full_name || p.email)) || 'Utilisateur';
          const init = name.substring(0, 2).toUpperCase();
          const roleLbl = ({ admin:'Administrateur', investor:'Client', provider:'Artisan', project_manager:'Chef de projet' })[p && p.default_role] || 'Utilisateur';
          const preview = (info.lastMsg.content || '').substring(0, 50);
          const badge = info.unread > 0 ? '<span class="ml-2 text-[10px] bg-red-500 text-white font-bold px-2 py-0.5 rounded-full">' + info.unread + '</span>' : '';
          return `
            <a href="message-direct.html?to=${senderId}&v=2" class="group flex items-center gap-3 bg-white/5 hover:bg-white/[0.08] border border-white/10 rounded-2xl p-3.5 transition">
              <div class="relative flex-shrink-0">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-600 to-emerald-500 flex items-center justify-center font-extrabold text-sm shadow-lg shadow-emerald-500/30">${escapeHtml(init)}</div>
                <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center"><h3 class="font-bold text-sm truncate">${escapeHtml(name)}</h3>${badge}</div>
                <p class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider mt-0.5">${escapeHtml(roleLbl)}</p>
                <p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(preview)}</p>
              </div>
              <span class="text-slate-500 group-hover:text-sky-400 transition">›</span>
            </a>`;
        }).join('');

      } catch (e) {
        console.error('[admin-inbox]', e);
        list.innerHTML = '<div class="text-center py-6 bg-white/5 border border-white/10 rounded-2xl"><p class="text-red-400 text-sm">Erreur : ' + escapeHtml(String(e && e.message || e)) + '</p></div>';
      }
    }

    /* ============ VISITE EN DIRECT ============ */
    function getLiveRoomName() { return 'diaspora-chantier-' + Date.now(); }

    document.getElementById('btn-start-live').addEventListener('click', () => {
      const roomName = getLiveRoomName();
      const liveUrl = 'https://meet.jit.si/' + roomName;
      const message = "VISITE EN DIRECT DU CHANTIER\n\nBonjour,\nJe vais demarrer une visite video en direct du chantier.\n\nCliquez sur ce lien pour rejoindre :\n" + liveUrl + "\n\nA tout de suite !";
      if (navigator.clipboard) navigator.clipboard.writeText(liveUrl).catch(() => {});
      localStorage.setItem('live_url', liveUrl);
      const choice = prompt("Lien de visite cree !\n\nTapez :\n1 = Envoyer par WhatsApp\n2 = Ouvrir la camera\n3 = Copier le lien");
      if (choice === '1') window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank');
      else if (choice === '2') window.open(liveUrl, '_blank');
      else if (choice === '3') showSuccess('Lien copie !');
    });

    document.getElementById('btn-join-live').addEventListener('click', () => {
      let liveUrl = localStorage.getItem('live_url');
      if (!liveUrl) {
        const entered = prompt("Collez ici le lien recu par WhatsApp ou Email :");
        if (!entered) return;
        liveUrl = entered;
      }
      window.open(liveUrl, '_blank');
    });

    /* ============ CONVERSATIONS PAR CHANTIER ============ */
    async function loadConversations() {
      const list = document.getElementById('conversations-list');
      try {
        let projects = [];
        if (role === 'admin') {
          const all = await apiGet('projects', 'order=created_at.desc');
          projects = (Array.isArray(all) ? all : []).map(p => ({ projectId: p.id, projectTitle: p.title, city: p.city, role: 'admin' }));
        } else {
          const members = await apiGet('project_members', 'user_id=eq.' + userId + '&is_active=eq.true');
          if (!Array.isArray(members) || members.length === 0) {
            list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><div class="text-3xl mb-2 opacity-40">💬</div><p class="text-slate-400 text-xs">Aucune conversation par chantier</p></div>';
            return;
          }
          for (const m of members) {
            try {
              const proj = await apiGet('projects', 'id=eq.' + m.project_id);
              if (Array.isArray(proj) && proj[0]) {
                projects.push({ projectId: m.project_id, projectTitle: proj[0].title, city: proj[0].city || '', role: m.role });
              }
            } catch (e) {}
          }
        }
        if (projects.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucune conversation</p>';
          return;
        }
        list.innerHTML = projects.map(c => `
          <a href="message-detail.html?id=${c.projectId}" class="group flex items-center gap-3 bg-white/5 hover:bg-white/[0.08] border border-white/10 rounded-2xl p-3.5 transition">
            <div class="relative flex-shrink-0">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-600 to-sky-500 flex items-center justify-center font-extrabold text-sm shadow-lg shadow-sky-500/30">${escapeHtml(c.projectTitle.substring(0, 2).toUpperCase())}</div>
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-sm truncate">${escapeHtml(c.projectTitle)}</h3>
              <p class="text-[10px] text-sky-400 font-semibold uppercase tracking-wider mt-0.5">${escapeHtml(c.role)}</p>
              <p class="text-xs text-slate-400 truncate mt-0.5">${c.city ? '📍 ' + escapeHtml(c.city) + ' — ' : ''}Touchez pour ouvrir</p>
            </div>
            <span class="text-slate-500 group-hover:text-sky-400 transition">›</span>
          </a>`).join('');
      } catch (e) {
        list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><p class="text-red-400 text-sm">Erreur de chargement</p></div>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('#conversations-list > a, #admin-inbox-list > a').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });

    loadConversations();
  </script>
</body>
</html>
