<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portefeuille global - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="dashboard-admin.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Portefeuille global</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-3xl mx-auto space-y-4">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Flux financiers</h1>
      <p class="text-sm text-slate-400 mt-1">Tous les dépôts, séquestres et déblocages des clients</p>
    </div>

    <!-- STATS GLOBALES -->
    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-emerald-400" id="stat-deposits">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mt-1">Total déposé</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-orange-400" id="stat-escrow">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mt-1">Séquestré</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-sky-400" id="stat-released">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mt-1">Débloqué</div>
      </div>
    </section>

    <!-- FILTRES -->
    <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
      <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold transition whitespace-nowrap">Toutes</button>
      <button data-filter="deposit" class="filter-btn px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 border border-white/10 transition whitespace-nowrap">Dépôts</button>
      <button data-filter="escrow_hold" class="filter-btn px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 border border-white/10 transition whitespace-nowrap">Séquestres</button>
      <button data-filter="milestone_release" class="filter-btn px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 border border-white/10 transition whitespace-nowrap">Déblocages</button>
    </div>

    <!-- LISTE -->
    <div id="transactions-list" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-portefeuille.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    let allTx = [];
    let currentFilter = 'all';
    let profileCache = {};

    function txMeta(type) {
      const map = {
        'deposit': { ic: '➕', bg: 'bg-emerald-500/20', label: 'Dépôt', color: 'text-emerald-400', sign: '+' },
        'escrow_hold': { ic: '🔒', bg: 'bg-orange-500/20', label: 'Séquestre', color: 'text-orange-400', sign: '−' },
        'milestone_release': { ic: '✅', bg: 'bg-sky-500/20', label: 'Déblocage', color: 'text-sky-400', sign: '−' },
        'refund': { ic: '↩️', bg: 'bg-red-500/20', label: 'Remboursement', color: 'text-red-400', sign: '+' }
      };
      return map[type] || map.deposit;
    }

    async function loadProfile(userId) {
      if (profileCache[userId]) return profileCache[userId];
      try {
        const data = await apiGet('profiles', 'id=eq.' + userId);
        if (Array.isArray(data) && data[0]) {
          profileCache[userId] = data[0];
          return data[0];
        }
      } catch (e) {}
      return null;
    }

    async function loadTransactions() {
      const list = document.getElementById('transactions-list');
      try {
        const data = await apiGet('transactions', 'order=created_at.desc&limit=100');
        allTx = Array.isArray(data) ? data : [];

        // Calcul des stats
        let deposits = 0, escrow = 0, released = 0;
        allTx.forEach(t => {
          const amt = Number(t.amount) || 0;
          if (t.transaction_type === 'deposit') deposits += amt;
          if (t.transaction_type === 'escrow_hold') escrow += amt;
          if (t.transaction_type === 'milestone_release') released += amt;
        });

        document.getElementById('stat-deposits').textContent = deposits.toLocaleString('fr-FR');
        document.getElementById('stat-escrow').textContent = escrow.toLocaleString('fr-FR');
        document.getElementById('stat-released').textContent = released.toLocaleString('fr-FR');

        // Charge les profils des initiateurs
        const userIds = [...new Set(allTx.map(t => t.initiated_by).filter(Boolean))];
        for (const uid of userIds) {
          await loadProfile(uid);
        }

        render();

      } catch (e) {
        list.innerHTML = '<div class="text-center py-8 bg-red-500/10 border border-red-500/30 rounded-2xl"><p class="text-red-300 text-sm">Erreur de chargement</p><p class="text-red-200 text-xs mt-1">' + e.message + '</p></div>';
      }
    }

    function render() {
      const list = document.getElementById('transactions-list');
      let filtered = allTx;
      if (currentFilter !== 'all') {
        filtered = allTx.filter(t => t.transaction_type === currentFilter);
      }

      if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">💰</div><p class="text-slate-400 text-sm">Aucune transaction</p></div>';
        return;
      }

      list.innerHTML = filtered.map(t => {
        const meta = txMeta(t.transaction_type);
        const profile = profileCache[t.initiated_by];
        const clientName = profile ? (profile.full_name || profile.email || 'Client') : 'Client inconnu';
        const clientEmail = profile ? profile.email : '';

        return `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-3 space-y-2">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl ${meta.bg} flex items-center justify-center flex-shrink-0 text-lg">${meta.ic}</div>
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start gap-2">
                  <span class="text-[10px] ${meta.bg} ${meta.color} px-2 py-0.5 rounded-full font-bold uppercase">${meta.label}</span>
                  <span class="text-sm font-extrabold ${meta.color}">${meta.sign} ${Number(t.amount).toLocaleString('fr-FR')} ${t.currency || 'XAF'}</span>
                </div>
                <p class="text-xs text-slate-300 mt-1 truncate">${escapeHtml(t.description || '')}</p>
              </div>
            </div>
            <div class="flex justify-between items-center text-[10px] text-slate-500 border-t border-white/5 pt-2">
              <span>👤 ${escapeHtml(clientName)}</span>
              <span>${escapeHtml(clientEmail)}</span>
            </div>
            <div class="text-[10px] text-slate-500">
              📅 ${formatDate(t.created_at)}
            </div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-emerald-600', 'text-white');
          b.classList.add('bg-white/5', 'text-slate-300', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600', 'text-white');
        btn.classList.remove('bg-white/5', 'text-slate-300', 'border', 'border-white/10');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    loadTransactions();
  </script>
</body>
</html>
