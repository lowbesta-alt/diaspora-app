<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un projet - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="projets.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Créer un projet</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Informations générales</h2>
      <div>
        <label class="text-[10px] text-slate-400">Titre *</label>
        <input type="text" id="title" placeholder="Ex : Construction Villa N'Djamena" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Description *</label>
        <textarea id="description" rows="3" placeholder="Décrivez votre projet..." class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Type de projet</label>
        <select id="projectType" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
          <option value="construction">Construction</option>
          <option value="commerce">Commerce</option>
          <option value="agriculture">Agriculture</option>
          <option value="immobilier">Immobilier</option>
          <option value="autre">Autre</option>
        </select>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Informations foncières</h2>
      <div>
        <label class="text-[10px] text-slate-400">Titre foncier</label>
        <input type="text" id="landTitle" placeholder="Ex : TF-1234/N'Djamena" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Superficie (m²)</label>
          <input type="number" id="area" placeholder="Ex : 500" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Précision Localisation / Quartier</label>
          <input type="text" id="locationDetail" placeholder="Ex : Chagoua, 7e arr." class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Budget et délais</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Devise</label>
          <select id="currency" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
            <option value="XAF">XAF</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="XOF">XOF</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Budget total *</label>
          <input type="number" id="budget" placeholder="0" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Date de début</label>
          <input type="date" id="startDate" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Fin estimée</label>
          <input type="date" id="endDate" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Localisation</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Pays</label>
          <select id="country" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
            <option value="TD">Tchad</option>
            <option value="CM">Cameroun</option>
            <option value="SN">Sénégal</option>
            <option value="CI">Côte d'Ivoire</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Ville</label>
          <input type="text" id="city" placeholder="Ex : N'Djamena" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Adresse complète</label>
        <input type="text" id="address" placeholder="Quartier, rue..." class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>
    </section>

    <section class="flex gap-2">
      <a href="projets.html" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl font-semibold text-sm text-center">Annuler</a>
      <button id="btn-create" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold text-sm">Créer le projet</button>
    </section>

  </main>

  <script src="config.js"></script>
  <script>
    document.getElementById('startDate').valueAsDate = new Date();

    // ============================================================
    // JALONS STANDARDS avec % de référence
    // Ces 5 jalons sont créés automatiquement à chaque nouveau projet
    // ============================================================
    const DEFAULT_MILESTONES = [
      {
        title: 'Études, Implantation et Terrassement',
        description: 'Validation des plans d\'exécution, piquetage du terrain, nettoyage et premiers mouvements de terre.',
        standard_percent: 10,
        order_index: 1
      },
      {
        title: 'Fondation et Élévation des Murs',
        description: 'Coulage de la fondation, soubassement et élévation des murs principaux du gros œuvre.',
        standard_percent: 25,
        order_index: 2
      },
      {
        title: 'Dalle / Charpente et Toiture',
        description: 'Coulage de la dalle haute (le cas échéant) ou pose de la charpente et installation complète de la couverture de toiture.',
        standard_percent: 25,
        order_index: 3
      },
      {
        title: 'Second Œuvre et Cloisons',
        description: 'Pose des menuiseries (portes et fenêtres), cloisons intérieures, et passage des gaines techniques (électricité et plomberie).',
        standard_percent: 20,
        order_index: 4
      },
      {
        title: 'Finitions, Peinture et Remise des Clés',
        description: 'Enduits, carrelage, peintures intérieures et extérieures, installation des équipements sanitaires et réception définitive du chantier.',
        standard_percent: 20,
        order_index: 5
      }
    ];

    document.getElementById('btn-create').addEventListener('click', async () => {
      const userId = localStorage.getItem('user_id');
      if (!userId) {
        alert('Vous devez etre connecte pour creer un projet');
        window.location.href = 'index.html';
        return;
      }

      const rawTitle        = document.getElementById('title').value.trim();
      const rawDescription  = document.getElementById('description').value.trim();
      const projectType     = document.getElementById('projectType').value;
      const landTitle       = document.getElementById('landTitle').value.trim();
      const area            = document.getElementById('area').value.trim();
      const locationDetail  = document.getElementById('locationDetail').value.trim();
      const currency        = document.getElementById('currency').value;
      const budget          = Number(document.getElementById('budget').value);
      const startDate       = document.getElementById('startDate').value;
      const endDate         = document.getElementById('endDate').value;
      const country         = document.getElementById('country').value;
      const city            = document.getElementById('city').value.trim();
      const address         = document.getElementById('address').value.trim();

      if (!rawTitle) { alert('Entrez un titre'); return; }
      if (!rawDescription) { alert('Entrez une description'); return; }
      if (!budget || budget <= 0) { alert('Entrez un budget valide'); return; }

      // Description enrichie
      let finalDescription = rawDescription;
      let extraInfo = [];
      if (landTitle) extraInfo.push(`Titre foncier : ${landTitle}`);
      if (area) extraInfo.push(`Superficie : ${area} m²`);
      if (locationDetail) extraInfo.push(`Zone / Localisation : ${locationDetail}`);

      if (extraInfo.length > 0) {
        finalDescription += "\n\n--- Informations Foncier ---\n" + extraInfo.join(" | ");
      }

      const btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.textContent = 'Création en cours...';

      try {
        // 1) Création du projet
        const res = await fetch(SUPABASE_URL + '/rest/v1/projects', {
          method: 'POST',
          headers: authHeaders({ 'Prefer': 'return=representation' }),
          body: JSON.stringify({
            owner_id: userId,
            title: rawTitle,
            description: finalDescription,
            project_type: projectType,
            country: country,
            city: city,
            address: address,
            currency: currency,
            total_budget: budget,
            status: 'draft',
            start_date: startDate || null,
            estimated_end_date: endDate || null
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert('Erreur : ' + (err.message || 'inconnue'));
          btn.disabled = false;
          btn.textContent = 'Créer le projet';
          return;
        }

        const created = await res.json();
        const projectId = Array.isArray(created) ? created[0]?.id : created?.id;

        // ============================================================
        // 2) Insertion des 5 jalons standards avec TOUS les champs
        // ============================================================
        if (projectId) {
          const milestonesPayload = DEFAULT_MILESTONES.map((m) => {
            const amount = Math.round(budget * m.standard_percent / 100);
            return {
              project_id: projectId,
              title: m.title,
              description: m.description,
              order_index: m.order_index,
              standard_percent: m.standard_percent,
              budget_percent: m.standard_percent,
              amount: amount,
              currency: currency,
              status: 'pending',
              proposal_status: 'pending',
              required_evidence: null
            };
          });

          const resM = await fetch(SUPABASE_URL + '/rest/v1/milestones', {
            method: 'POST',
            headers: authHeaders({ 'Prefer': 'return=minimal' }),
            body: JSON.stringify(milestonesPayload)
          });

          if (!resM.ok) {
            const errM = await resM.json().catch(() => ({}));
            alert('Projet créé, mais les jalons n\'ont pas pu être ajoutés : ' + (errM.message || 'inconnue'));
            window.location.href = 'projets.html';
            return;
          }
        }

        alert('✅ Projet créé avec succès !\n\nLes 5 jalons standards ont été générés automatiquement.');
        window.location.href = 'projets.html';

      } catch (e) {
        alert('Erreur réseau : ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Créer le projet';
      }
    });
  </script>
</body>
</html>
