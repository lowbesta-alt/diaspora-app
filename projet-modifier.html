<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier le projet - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a id="btn-back" href="projet-detail.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Modifier le projet</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Informations générales</h2>
      <div>
        <label class="text-[10px] text-slate-400">Titre *</label>
        <input type="text" id="title" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Description *</label>
        <textarea id="description" rows="3" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Type de projet</label>
        <select id="projectType" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
          <option value="construction">Construction</option>
          <option value="commerce">Commerce</option>
          <option value="agriculture">Agriculture</option>
          <option value="immobilier">Immobilier</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Statut</label>
        <select id="status" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
          <option value="draft">Brouillon</option>
          <option value="active">Actif</option>
          <option value="paused">En pause</option>
          <option value="completed">Terminé</option>
          <option value="cancelled">Annulé</option>
          <option value="disputed">En litige</option>
        </select>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Budget et délais</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Devise</label>
          <select id="currency" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
            <option value="XAF">XAF</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="XOF">XOF</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Budget total</label>
          <input type="number" id="budget" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Date de début</label>
          <input type="date" id="startDate" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Fin estimée</label>
          <input type="date" id="endDate" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">Localisation</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400">Pays</label>
          <select id="country" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
            <option value="TD">Tchad</option>
            <option value="CM">Cameroun</option>
            <option value="SN">Sénégal</option>
            <option value="CI">Côte d'Ivoire</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Ville</label>
          <input type="text" id="city" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div>
        <label class="text-[10px] text-slate-400">Adresse complète</label>
        <input type="text" id="address" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500">
      </div>
    </section>

    <section class="flex gap-2">
      <a id="btn-cancel" href="projet-detail.html" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl font-semibold text-sm text-center">Annuler</a>
      <button id="btn-save" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold text-sm">Enregistrer</button>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    if (!projectId) {
      alert('Aucun projet selectionne');
      window.location.href = 'projets.html';
    }

    document.getElementById('btn-back').href = 'projet-detail.html?id=' + projectId;
    document.getElementById('btn-cancel').href = 'projet-detail.html?id=' + projectId;

    async function loadProject() {
      try {
        const data = await apiGet('projects', 'id=eq.' + projectId);
        if (!Array.isArray(data) || !data[0]) {
          showError('Projet introuvable');
          return;
        }
        const p = data[0];

        if (p.owner_id !== getCurrentUserId()) {
          alert('Seul le proprietaire peut modifier ce projet');
          window.location.href = 'projet-detail.html?id=' + projectId;
          return;
        }

        document.getElementById('title').value = p.title || '';
        document.getElementById('description').value = p.description || '';
        document.getElementById('projectType').value = p.project_type || 'construction';
        document.getElementById('status').value = p.status || 'draft';
        document.getElementById('currency').value = p.currency || 'XAF';
        document.getElementById('budget').value = p.total_budget || 0;
        document.getElementById('startDate').value = p.start_date || '';
        document.getElementById('endDate').value = p.estimated_end_date || '';
        document.getElementById('country').value = p.country || 'TD';
        document.getElementById('city').value = p.city || '';
        document.getElementById('address').value = p.address || '';
      } catch (e) {
        showError(e.message);
      }
    }

    document.getElementById('btn-save').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const budget = Number(document.getElementById('budget').value);

      if (!title) { alert('Entrez un titre'); return; }
      if (!description) { alert('Entrez une description'); return; }
      if (!budget || budget <= 0) { alert('Entrez un budget valide'); return; }

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      try {
        await apiPatch('projects', projectId, {
          title: title,
          description: description,
          project_type: document.getElementById('projectType').value,
          status: document.getElementById('status').value,
          currency: document.getElementById('currency').value,
          total_budget: budget,
          start_date: document.getElementById('startDate').value || null,
          estimated_end_date: document.getElementById('endDate').value || null,
          country: document.getElementById('country').value,
          city: document.getElementById('city').value.trim(),
          address: document.getElementById('address').value.trim()
        });

        showSuccess('Modifications enregistrées !');
        window.location.href = 'projet-detail.html?id=' + projectId;
      } catch (e) {
        showError(e.message);
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
      }
    });

    loadProject();
  </script>
</body>
</html>
