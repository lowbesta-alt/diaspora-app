<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl my-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 font-bold text-xl mb-3">🌍</div>
      <h1 class="text-2xl font-bold text-slate-900">Créer un compte</h1>
      <p class="text-sm text-slate-600 mt-1">Rejoignez la diaspora qui investit au pays</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
        <input type="text" id="fullName" required placeholder="Jean Dupont" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-800 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Adresse email</label>
        <input type="email" id="email" required placeholder="nom@exemple.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-800 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-800 bg-slate-50">
        <p class="text-[10px] text-slate-500 mt-1">Minimum 6 caractères</p>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">
        Créer mon compte
      </button>
    </form>

    <p class="text-center text-sm text-slate-600 mt-6 pt-6 border-t">
      Déjà un compte ?
      <a href="index.html" class="text-emerald-700 font-semibold hover:underline">Se connecter</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !email || !password) { alert('Remplis tous les champs'); return; }
      if (password.length < 6) { alert('Mot de passe : minimum 6 caractères'); return; }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Création...';

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            password: password,
            data: { full_name: fullName }
          })
        });
        const data = await res.json();

        if (data.user || data.id) {
          showSuccess('Compte créé ! Connectez-vous maintenant.');
          window.location.href = 'index.html';
        } else {
          showError(data.error_description || data.msg || data.error || 'Erreur inconnue');
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
        }
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
