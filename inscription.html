<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="text-white">

  <div class="min-h-screen flex items-center justify-center p-4 py-10">

    <div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-amber-500/25 rounded-3xl p-8 shadow-2xl">

      <!-- Logo premium -->
      <div class="flex flex-col items-center mb-8">
        <img src="logo.svg" alt="Espace Diaspora" class="w-16 h-16 mb-4" style="filter: drop-shadow(0 8px 24px rgba(245,158,11,0.5));">
        <h1 class="text-2xl font-extrabold text-white">Créer un compte</h1>
        <p class="text-sm text-slate-300 mt-1 text-center">Rejoignez la diaspora qui investit au pays</p>
      </div>

      <!-- Message sécurité -->
      <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/25 rounded-xl px-3 py-2 mb-6">
        <span class="text-amber-400 text-sm">🔒</span>
        <p class="text-[11px] text-amber-200 font-medium">Vos données sont chiffrées et sécurisées</p>
      </div>

      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Nom complet</label>
          <input type="text" id="fullName" required placeholder="Jean Dupont"
            class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 focus:border-amber-500 outline-none text-white text-sm placeholder-slate-500 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Adresse email</label>
          <input type="email" id="email" required placeholder="nom@exemple.com"
            class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 focus:border-amber-500 outline-none text-white text-sm placeholder-slate-500 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Mot de passe</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••" minlength="6"
              class="w-full px-4 py-3.5 pr-12 rounded-xl bg-white/5 border border-white/10 focus:border-amber-500 outline-none text-white text-sm placeholder-slate-500 transition">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-amber-400 transition">👁️</button>
          </div>
          <p class="text-[10px] text-slate-500 mt-1.5 font-medium">Minimum 6 caractères</p>
        </div>

        <button type="submit" id="btnSubmit"
          class="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-[#0a1838] font-extrabold py-4 rounded-xl mt-3 text-sm tracking-wide shadow-lg shadow-amber-500/40 transition">
          Créer mon compte
        </button>
      </form>

      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="px-3 text-[10px] text-slate-500 uppercase tracking-widest font-semibold">ou</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <p class="text-center text-sm text-slate-300">
        Déjà un compte ?
        <a href="index.html" class="text-amber-400 font-bold hover:text-amber-300 transition">Se connecter</a>
      </p>

      <p class="text-center text-[10px] text-slate-500 mt-6 leading-relaxed">
        En continuant, vous acceptez nos<br>
        <a href="#" class="text-amber-400 hover:underline">Conditions générales d'utilisation</a>
      </p>

    </div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.textContent = input.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !email || !password) { alert('Remplis tous les champs'); return; }
      if (password.length < 6) { alert('Mot de passe : minimum 6 caractères'); return; }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Création...';

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            password: password,
            data: { full_name: fullName }
          })
        });
        const data = await res.json();

        if (data.user || data.id) {
          showSuccess('Compte créé ! Connectez-vous maintenant.');
          window.location.href = 'index.html';
        } else {
          showError(data.error_description || data.msg || data.error || 'Erreur inconnue');
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
        }
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
