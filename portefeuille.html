<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portefeuille - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center text-lg">🌍</div>
      <span class="font-bold text-sm">Espace Diaspora</span>
    </div>
    <a href="notifications.html" class="text-xl">🔔</a>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <h1 class="text-2xl font-bold">Mon portefeuille</h1>
    <p class="text-sm text-slate-400">Suivez vos fonds en temps réel</p>

    <section class="bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl p-6 shadow-xl">
      <p class="text-xs text-emerald-100 mb-1">Solde disponible</p>
      <p class="text-4xl font-bold mb-1" id="solde">-</p>
      <p class="text-sm text-emerald-100 mb-4">XAF</p>
      <a href="transaction.html" class="inline-block bg-white text-emerald-700 px-4 py-2 rounded-xl text-sm font-bold">+ Ajouter des fonds</a>
    </section>

    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
        <div class="text-xl">🔒</div>
        <div class="text-lg font-bold mt-2" id="stat-escrow">-</div>
        <div class="text-[10px] text-slate-400">Fonds bloqués (séquestre)</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
        <div class="text-xl">💰</div>
        <div class="text-lg font-bold mt-2" id="stat-invested">-</div>
        <div class="text-[10px] text-slate-400">Total investi</div>
      </div>
    </section>

    <section>
      <h2 class="text-lg font-bold mb-3">Historique des transactions</h2>
      <div id="transactions-list" class="space-y-2">
        <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    function txIcon(type) {
      const map = {
        'deposit': { ic: '➕', bg: 'bg-emerald-500/20' },
        'escrow_hold': { ic: '🔒', bg: 'bg-orange-500/20' },
        'milestone_release': { ic: '✅', bg: 'bg-blue-500/20' },
        'refund': { ic: '↩️', bg: 'bg-red-500/20' }
      };
      return map[type] || map.deposit;
    }

    function txSign(type) {
      return type === 'deposit' ? '+' : '-';
    }

    function txColor(type) {
      return type === 'deposit' ? 'text-emerald-400' : 'text-orange-400';
    }

    async function loadTransactions() {
      const userId = getCurrentUserId();
      const list = document.getElementById('transactions-list');

      try {
        const txs = await apiGet('transactions', 'initiated_by=eq.' + userId + '&order=created_at.desc&limit=50');
        const valid = Array.isArray(txs) ? txs : [];

        if (valid.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucune transaction pour le moment</p>';
          document.getElementById('solde').textContent = '0';
          document.getElementById('stat-escrow').textContent = '0';
          document.getElementById('stat-invested').textContent = '0';
          return;
        }

        let deposits = 0, escrow = 0, released = 0;
        valid.forEach(t => {
          const amt = Number(t.amount) || 0;
          if (t.transaction_type === 'deposit') deposits += amt;
          if (t.transaction_type === 'escrow_hold') escrow += amt;
          if (t.transaction_type === 'milestone_release') released += amt;
        });

        const solde = deposits - escrow;
        document.getElementById('solde').textContent = solde.toLocaleString('fr-FR');
        document.getElementById('stat-escrow').textContent = escrow.toLocaleString('fr-FR');
        document.getElementById('stat-invested').textContent = (escrow + released).toLocaleString('fr-FR');

        list.innerHTML = valid.map(t => {
          const { ic, bg } = txIcon(t.transaction_type);
          return `
            <div class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-xl p-3">
              <div class="w-9 h-9 rounded-full ${bg} flex items-center justify-center">${ic}</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold truncate">${escapeHtml(t.description || getStatusLabel(t.transaction_type))}</p>
                <p class="text-[10px] text-slate-400">${formatDate(t.created_at)}</p>
              </div>
              <div class="text-sm font-bold ${txColor(t.transaction_type)}">${txSign(t.transaction_type)} ${formatAmount(t.amount)}</div>
            </div>
          `;
        }).join('');

      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur de chargement</p>';
      }
    }

    loadTransactions();
  </script>
</body>
</html>
