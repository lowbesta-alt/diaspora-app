<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="text-white">

  <div class="min-h-screen flex items-center justify-center p-4 py-10">

    <div class="w-full max-w-md bg-white/5 backdrop-blur-xl rounded-3xl p-8 shadow-2xl"
         style="border: 1px solid rgba(16,185,129,0.35); box-shadow: 0 20px 60px -20px rgba(16,185,129,0.25), 0 0 0 1px rgba(16,185,129,0.05) inset;">

      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <img src="logo.svg" alt="Espace Diaspora" class="w-16 h-16 mb-4" style="filter: drop-shadow(0 8px 24px rgba(16,185,129,0.5));">
        <h1 class="text-2xl font-extrabold text-white">Espace Diaspora</h1>
        <p class="text-[11px] font-bold mt-2 tracking-[0.15em] uppercase" style="color: #34d399;">Investir au pays, en confiance</p>
      </div>

      <!-- Encadré sécurité émeraude -->
      <div class="flex items-center gap-2 rounded-xl px-3 py-2.5 mb-6"
           style="background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.3);">
        <span class="text-emerald-400 text-sm">🔒</span>
        <p class="text-[11px] font-medium" style="color: #6ee7b7;">Connexion sécurisée — chiffrement bout en bout</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Adresse email</label>
          <input type="email" id="email" required placeholder="nom@exemple.com"
            class="w-full px-4 py-3.5 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
            style="border: 1px solid rgba(16,185,129,0.3);"
            onfocus="this.style.borderColor='#10b981'; this.style.boxShadow='0 0 0 4px rgba(16,185,129,0.15)';"
            onblur="this.style.borderColor='rgba(16,185,129,0.3)'; this.style.boxShadow='none';">
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold text-slate-200 tracking-wider uppercase">Mot de passe</label>
            <a href="#" class="text-[11px] font-bold" style="color: #34d399;">Oublié ?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full px-4 py-3.5 pr-12 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
              style="border: 1px solid rgba(16,185,129,0.3);"
              onfocus="this.style.borderColor='#10b981'; this.style.boxShadow='0 0 0 4px rgba(16,185,129,0.15)';"
              onblur="this.style.borderColor='rgba(16,185,129,0.3)'; this.style.boxShadow='none';">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-emerald-400 transition">👁️</button>
          </div>
        </div>

        <button type="submit"
          class="w-full font-extrabold py-4 rounded-xl mt-3 text-sm tracking-wide transition"
          style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); color: #0a1838; box-shadow: 0 10px 24px -8px rgba(245,158,11,0.55);">
          Accéder à mon espace
        </button>
      </form>

      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="px-3 text-[10px] text-slate-500 uppercase tracking-widest font-semibold">ou</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <a href="inscription.html" class="block w-full text-center bg-white/5 hover:bg-emerald-500/10 text-white font-bold py-4 rounded-xl text-sm transition"
         style="border: 1px solid rgba(16,185,129,0.3);">
        Créer un compte diaspora
      </a>

      <p class="text-center text-[10px] text-slate-500 mt-6 leading-relaxed">
        En continuant, vous acceptez nos<br>
        <a href="#" class="font-medium hover:underline" style="color: #34d399;">Conditions générales d'utilisation</a>
      </p>

    </div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.textContent = input.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { alert('Remplis email et mot de passe'); return; }

      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user_id', data.user.id);
          localStorage.setItem('user_email', data.user.email);
          window.location.href = 'dashboard-investisseur.html';
        } else {
          showError(data.error_description || data.msg || 'Identifiants invalides');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        showError('Erreur réseau : ' + err.message);
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
