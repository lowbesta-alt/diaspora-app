<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="text-white">

  <div class="min-h-screen flex items-center justify-center p-4 py-10">
    <div class="w-full max-w-md">

      <div class="text-center mb-6">
        <img src="logo.svg" alt="Espace Diaspora" class="w-20 h-20 mx-auto mb-4" style="filter: drop-shadow(0 8px 24px rgba(16,185,129,0.5));">
        <h1 class="text-2xl font-extrabold text-white">Espace Diaspora</h1>
        <p class="text-[11px] font-bold mt-2 tracking-[0.15em] uppercase" style="color: #34d399;">Investir au pays, en confiance</p>
      </div>

      <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-6 shadow-2xl" style="border: 1px solid rgba(16,185,129,0.35);">
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Adresse email</label>
            <input type="email" id="email" required placeholder="nom@exemple.com"
              class="w-full px-4 py-3.5 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
              style="border: 1px solid rgba(16,185,129,0.3);">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Mot de passe</label>
            <div class="relative">
              <input type="password" id="password" required placeholder="••••••••"
                class="w-full px-4 py-3.5 pr-12 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
                style="border: 1px solid rgba(16,185,129,0.3);">
              <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-emerald-400 transition">👁️</button>
            </div>
          </div>

          <button type="submit" id="btnSubmit"
            class="w-full font-extrabold py-4 rounded-xl mt-3 text-sm tracking-wide transition"
            style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); color: #0a1838; box-shadow: 0 10px 24px -8px rgba(245,158,11,0.55);">
            Accéder à mon espace
          </button>
        </form>

        <div class="flex items-center my-5">
          <div class="flex-1 h-px bg-white/10"></div>
          <span class="px-3 text-[10px] text-slate-500 uppercase tracking-widest font-semibold">ou</span>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>

        <a href="inscription.html" class="block w-full text-center bg-white/5 hover:bg-emerald-500/10 text-white font-bold py-3.5 rounded-xl text-sm transition"
           style="border: 1px solid rgba(16,185,129,0.3);">
          Créer un compte diaspora
        </a>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
    <script>
    // ============================================================
    // LISTE DES ADMINS (à completer si plusieurs admins)
    // ============================================================
    const ADMIN_EMAILS = [
      'lowbesta@gmail.com',
      'mnkong123@gmail.com'
    ];
    // ============================================================

    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.textContent = input.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email || !password) { alert('Remplis email et mot de passe'); return; }

      const btn = document.getElementById('btnSubmit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Connexion...';

            try {
        // 1. Authentification Supabase
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.access_token) {
          alert('Erreur : email ou mot de passe incorrect');
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        // 2. Stocke les infos de base
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user_id', data.user.id);
        localStorage.setItem('user_email', data.user.email);

        // 3. Vérification Admin en priorité
        if (ADMIN_EMAILS.includes(email)) {
          localStorage.setItem('user_role', 'admin');
          window.location.href = 'dashboard-admin.html';
          return;
        }

        // 4. Interroger la table des profils (ou partnerships) pour connaître le vrai rôle dans la base
        let userRole = 'investor'; // Par défaut

        try {
          const profileRes = await fetch(SUPABASE_URL + '/rest/v1/partnership_requests?email=eq.' + encodeURIComponent(email) + '&select=status', {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + data.access_token
            }
          });
          const profileData = await profileRes.json();
          
          // Si l'e-mail existe dans les demandes approuvées de partenaires/artisans
          if (Array.isArray(profileData) && profileData.length > 0) {
            userRole = 'provider';
          }
        } catch (err) {
          console.log("Vérification rôle alternative...");
        }

        // 5. Redirection finale selon le rôle détecté
        if (userRole === 'provider') {
          localStorage.setItem('user_role', 'provider');
          window.location.href = 'dashboard-artisan.html';
        } else {
          localStorage.setItem('user_role', 'investor');
          window.location.href = 'dashboard-investisseur.html';
        }

      } catch (err) {
        alert('Erreur reseau : ' + err.message);
        btn.disabled = false;
        btn.innerHTML = originalText;
            }
    });
    </script>
</body>
</html>
