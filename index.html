<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="text-white">

  <div class="min-h-screen flex items-center justify-center p-4 py-10">
    <div class="w-full max-w-md">

      <!-- LOGO + NOM -->
      <div class="text-center mb-6">
        <img src="logo.svg" alt="Espace Diaspora" class="w-20 h-20 mx-auto mb-4" style="filter: drop-shadow(0 8px 24px rgba(16,185,129,0.5));">
        <h1 class="text-2xl font-extrabold text-white">Espace Diaspora</h1>
        <p class="text-[11px] font-bold mt-2 tracking-[0.15em] uppercase" style="color: #34d399;">Investir au pays, en confiance</p>
      </div>

      <!-- LES 3 ESPACES -->
      <div class="mb-6">
        <p class="text-[10px] text-slate-500 text-center uppercase tracking-widest font-bold mb-3">3 espaces vous attendent</p>
        <div class="grid grid-cols-3 gap-2">
          <div class="rounded-2xl p-3 text-center" style="background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.3);">
            <div class="text-2xl mb-1">🏠</div>
            <div class="text-[10px] font-bold text-emerald-300">CLIENT</div>
            <div class="text-[8px] text-slate-500 mt-0.5">Diaspora</div>
          </div>
          <div class="rounded-2xl p-3 text-center" style="background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3);">
            <div class="text-2xl mb-1">🏗️</div>
            <div class="text-[10px] font-bold text-amber-300">ARTISAN</div>
            <div class="text-[8px] text-slate-500 mt-0.5">Partenaire BTP</div>
          </div>
          <div class="rounded-2xl p-3 text-center" style="background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.3);">
            <div class="text-2xl mb-1">🎯</div>
            <div class="text-[10px] font-bold text-sky-300">ADMIN</div>
            <div class="text-[8px] text-slate-500 mt-0.5">Gestion</div>
          </div>
        </div>
        <p class="text-[10px] text-slate-500 text-center mt-3">Le système vous redirige automatiquement vers votre espace</p>
      </div>

      <!-- FORMULAIRE -->
      <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-6 shadow-2xl" style="border: 1px solid rgba(16,185,129,0.35);">

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Adresse email</label>
            <input type="email" id="email" required placeholder="nom@exemple.com"
              class="w-full px-4 py-3.5 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
              style="border: 1px solid rgba(16,185,129,0.3);">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-200 mb-2 tracking-wider uppercase">Mot de passe</label>
            <div class="relative">
              <input type="password" id="password" required placeholder="••••••••"
                class="w-full px-4 py-3.5 pr-12 rounded-xl bg-white/5 outline-none text-white text-sm placeholder-slate-500 transition"
                style="border: 1px solid rgba(16,185,129,0.3);">
              <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-emerald-400 transition">👁️</button>
            </div>
          </div>

          <button type="submit" id="btnSubmit"
            class="w-full font-extrabold py-4 rounded-xl mt-3 text-sm tracking-wide transition"
            style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); color: #0a1838; box-shadow: 0 10px 24px -8px rgba(245,158,11,0.55);">
            Accéder à mon espace
          </button>
        </form>

        <div class="flex items-center my-5">
          <div class="flex-1 h-px bg-white/10"></div>
          <span class="px-3 text-[10px] text-slate-500 uppercase tracking-widest font-semibold">ou</span>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>

        <a href="inscription.html" class="block w-full text-center bg-white/5 hover:bg-emerald-500/10 text-white font-bold py-3.5 rounded-xl text-sm transition"
           style="border: 1px solid rgba(16,185,129,0.3);">
          Créer un compte diaspora
        </a>

      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.textContent = input.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { alert('Remplis email et mot de passe'); return; }

      const btn = document.getElementById('btnSubmit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.access_token) {
          showError(data.error_description || data.msg || 'Identifiants invalides');
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user_id', data.user.id);
        localStorage.setItem('user_email', data.user.email);

        btn.textContent = 'Chargement du profil...';
        let role = 'investor';
        try {
          const profileRes = await fetch(
            SUPABASE_URL + '/rest/v1/profiles?id=eq.' + data.user.id + '&select=default_role,full_name',
            {
              headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + data.access_token,
                'Content-Type': 'application/json'
              }
            }
          );
          const profiles = await profileRes.json();
          if (Array.isArray(profiles) && profiles[0] && profiles[0].default_role) {
            role = profiles[0].default_role;
          }
          if (Array.isArray(profiles) && profiles[0] && profiles[0].full_name) {
            localStorage.setItem('user_name', profiles[0].full_name);
          }
        } catch (err) {}

        localStorage.setItem('user_role', role);

        // Redirection selon le rôle
        if (role === 'admin') {
          window.location.href = 'dashboard-admin.html';
        } else if (role === 'provider' || role === 'project_manager') {
          window.location.href = 'dashboard-artisan.html';
        } else {
          window.location.href = 'dashboard-investisseur.html';
        }

      } catch (err) {
        showError('Erreur réseau : ' + err.message);
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
