<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification d'identité - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-xl bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-2xl my-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 font-bold text-xl mb-3">🌍</div>
      <h1 class="text-2xl font-bold text-slate-900">Vérification d'identité</h1>
      <p class="text-sm text-slate-600 mt-1">Vos documents sont chiffrés et confidentiels</p>
    </div>

    <form id="kycForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Type de document</label>
        <select id="documentType" required class="w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-800 bg-slate-50">
          <option value="" disabled selected>Sélectionnez un document</option>
          <option value="Passeport">Passeport</option>
          <option value="Carte d'identité">Carte d'identité</option>
          <option value="Permis de conduire">Permis de conduire</option>
          <option value="Titre de séjour">Titre de séjour</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pièce - Recto</label>
        <input type="file" id="frontDoc" accept="image/*,.pdf" required class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pièce - Verso</label>
        <input type="file" id="backDoc" accept="image/*,.pdf" required class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Selfie avec la pièce</label>
        <input type="file" id="selfieDoc" accept="image/*" required class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">
        Envoyer pour vérification
      </button>
    </form>

    <div id="statusBox" class="mt-6 hidden p-4 rounded-xl border text-center font-medium text-sm"></div>

    <p class="text-center text-sm text-slate-600 mt-6 pt-6 border-t">
      <a href="dashboard-investisseur.html" class="text-emerald-700 font-semibold hover:underline">Passer cette étape pour l'instant</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');
    setupUserHeader();

    const kycForm = document.getElementById('kycForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    async function loadKycStatus() {
      const userId = getCurrentUserId();
      try {
        const profiles = await apiGet('profiles', 'id=eq.' + userId);
        if (Array.isArray(profiles) && profiles[0]) {
          const status = profiles[0].kyc_status;
          if (status === 'pending') {
            statusBox.className = 'mt-6 p-4 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-center font-medium text-sm';
            statusBox.textContent = 'En attente de vérification';
            statusBox.classList.remove('hidden');
            kycForm.style.display = 'none';
          } else if (status === 'verified') {
            statusBox.className = 'mt-6 p-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-800 text-center font-medium text-sm';
            statusBox.textContent = '✅ Compte vérifié';
            statusBox.classList.remove('hidden');
            kycForm.style.display = 'none';
          }
        }
      } catch (e) {}
    }

    kycForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const docType = document.getElementById('documentType').value;
      const front = document.getElementById('frontDoc').files[0];
      const back = document.getElementById('backDoc').files[0];
      const selfie = document.getElementById('selfieDoc').files[0];

      if (!docType || !front || !back || !selfie) {
        alert('Sélectionnez tous les documents');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Envoi en cours...';

      try {
        const userId = getCurrentUserId();
        const ts = Date.now();
        const basePath = userId + '/';

        const files = [
          { file: front, name: ts + '_front_' + front.name },
          { file: back, name: ts + '_back_' + back.name },
          { file: selfie, name: ts + '_selfie_' + selfie.name }
        ];

        for (const item of files) {
          await uploadFile('kyc-documents', basePath + item.name, item.file);
        }

        await apiPost('kyc_verifications', {
          user_id: userId,
          document_type: docType,
          document_front_url: basePath + files[0].name,
          document_back_url: basePath + files[1].name,
          selfie_url: basePath + files[2].name,
          status: 'pending'
        });

        await apiPatch('profiles', userId, { kyc_status: 'pending' });

        statusBox.className = 'mt-6 p-4 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-center font-medium text-sm';
        statusBox.textContent = '✅ Documents envoyés ! En attente de vérification.';
        statusBox.classList.remove('hidden');
        submitBtn.textContent = 'Envoyé';
        kycForm.style.display = 'none';

      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Envoyer pour vérification';
      }
    });

    loadKycStatus();
  </script>
</body>
</html>
