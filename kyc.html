<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification d'identité - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-xl bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-white/20 my-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 font-bold text-xl mb-3 shadow-inner">🌍</div>
      <h1 class="text-2xl font-bold text-slate-900">Vérification d'identité</h1>
      <p class="text-sm text-slate-600 mt-1">Pour votre sécurité et celle des investisseurs, nous devons vérifier votre identité</p>
    </div>

    <div class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 flex items-start space-x-3">
      <span class="text-lg">📋</span>
      <p>Vos documents sont chiffrés et confidentiels. Seul notre équipe de vérification y aura accès.</p>
    </div>

    <form id="kycForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Type de document</label>
        <select id="documentType" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-800 bg-slate-50/50">
          <option value="" disabled selected>Sélectionnez un document</option>
          <option value="Passeport">Passeport</option>
          <option value="Carte d'identité">Carte d'identité</option>
          <option value="Permis de conduire">Permis de conduire</option>
          <option value="Titre de séjour">Titre de séjour</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pièce d'identité - Recto</label>
        <input type="file" id="frontDoc" accept="image/*,.pdf" required
          class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2 bg-slate-50/50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pièce d'identité - Verso</label>
        <input type="file" id="backDoc" accept="image/*,.pdf" required
          class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2 bg-slate-50/50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Selfie tenant votre pièce d'identité</label>
        <input type="file" id="selfieDoc" accept="image/*" required
          class="w-full text-sm text-slate-500 border border-slate-300 rounded-xl p-2 bg-slate-50/50">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-lg">
        Envoyer pour vérification
      </button>
    </form>

    <div id="statusBox" class="mt-6 hidden p-4 rounded-xl border text-center font-medium text-sm"></div>

    <p class="text-center text-sm text-slate-600 mt-6 pt-6 border-t border-slate-100">
      <a href="dashboard-investisseur.html" class="text-emerald-700 font-semibold hover:underline">Passer cette étape pour l'instant</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('kycForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const docType = document.getElementById('documentType').value;
      const front = document.getElementById('frontDoc').files[0];
      const back = document.getElementById('backDoc').files[0];
      const selfie = document.getElementById('selfieDoc').files[0];
      const statusBox = document.getElementById('statusBox');

      if (!docType || !front || !back || !selfie) {
        alert('Sélectionnez tous les documents');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Envoi en cours...';

      try {
        const userId = TEST_USER_ID;
        const basePath = 'kyc-documents/' + userId + '/';
        const timestamp = Date.now();

        const files = [
          { file: front, name: timestamp + '_front_' + front.name },
          { file: back, name: timestamp + '_back_' + back.name },
          { file: selfie, name: timestamp + '_selfie_' + selfie.name }
        ];

        for (const item of files) {
          const res = await fetch(SUPABASE_URL + '/storage/v1/object/' + basePath + item.name, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': item.file.type
            },
            body: item.file
          });
          if (!res.ok) throw new Error('Upload échoué : ' + item.name);
        }

        const kycRes = await fetch(SUPABASE_URL + '/rest/v1/kyc_verifications', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            user_id: userId,
            document_type: docType,
            document_front_url: basePath + files[0].name,
            document_back_url: basePath + files[1].name,
            selfie_url: basePath + files[2].name,
            status: 'pending'
          })
        });
        if (!kycRes.ok) throw new Error('Enregistrement KYC échoué');

        await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + userId, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ kyc_status: 'pending' })
        });

        statusBox.className = 'mt-6 p-4 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-center font-medium text-sm';
        statusBox.textContent = '✅ Documents envoyés ! En attente de vérification.';
        statusBox.classList.remove('hidden');
        btn.textContent = 'Envoyé';

      } catch (err) {
        alert('Erreur : ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Envoyer pour vérification';
      }
    });
  </script>
</body>
</html>
