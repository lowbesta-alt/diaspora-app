<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center text-lg">🌍</div>
      <span class="font-bold text-sm">Espace Diaspora</span>
    </div>
    <a href="securite.html" class="text-xl">⚙️</a>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl p-6 text-center">
      <div class="w-20 h-20 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-3xl font-bold mx-auto mb-3" id="avatar-initials">IT</div>
      <h1 id="profile-name" class="text-xl font-bold mt-3">Chargement...</h1>
      <p id="profile-email" class="text-xs text-emerald-100">-</p>
      <div id="profile-badge" class="mt-3 inline-block bg-emerald-400/30 text-xs px-3 py-1 rounded-full">Compte actif</div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold">Informations personnelles</h2>
        <button id="btn-edit" class="text-xs text-emerald-400 font-semibold">✏️ Modifier</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="text-[10px] text-slate-400">Nom complet</label>
          <input type="text" id="fullName" readonly class="w-full bg-transparent border-b border-white/10 py-1 focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Adresse email</label>
          <input type="email" id="email" readonly class="w-full bg-transparent border-b border-white/10 py-1 text-slate-400">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Téléphone</label>
          <input type="tel" id="phone" readonly class="w-full bg-transparent border-b border-white/10 py-1 focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400">Pays de résidence</label>
          <input type="text" id="country" readonly class="w-full bg-transparent border-b border-white/10 py-1 focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <button id="btn-save" class="hidden w-full mt-4 bg-emerald-600 py-2 rounded-xl text-sm font-semibold">Enregistrer</button>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4">
      <h2 class="text-sm font-bold mb-3">Statistiques</h2>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div><div class="text-lg font-bold" id="stat-projects">-</div><div class="text-[10px] text-slate-400">Projets</div></div>
        <div><div class="text-lg font-bold" id="stat-milestones">-</div><div class="text-[10px] text-slate-400">Jalons</div></div>
        <div><div class="text-lg font-bold" id="stat-docs">-</div><div class="text-[10px] text-slate-400">Documents</div></div>
      </div>
    </section>

    <section class="space-y-2">
      <button id="btn-logout" class="w-full bg-white/5 border border-white/10 py-3 rounded-xl text-sm">Se déconnecter</button>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    let currentProfile = null;

    async function loadProfile() {
      const userId = getCurrentUserId();
      try {
        const data = await apiGet('profiles', 'id=eq.' + userId);
        if (!Array.isArray(data) || !data[0]) {
          document.getElementById('profile-name').textContent = 'Profil introuvable';
          return;
        }
        const p = data[0];
        currentProfile = p;

        document.getElementById('profile-name').textContent = p.full_name || 'Sans nom';
        document.getElementById('profile-email').textContent = p.email || '';
        document.getElementById('fullName').value = p.full_name || '';
        document.getElementById('email').value = p.email || '';
        document.getElementById('phone').value = p.phone || '';
        document.getElementById('country').value = p.country || '';

        const initials = (p.full_name || p.email || 'IT').substring(0, 2).toUpperCase();
        document.getElementById('avatar-initials').textContent = initials;

        if (p.kyc_status === 'verified') {
          document.getElementById('profile-badge').textContent = '✅ Compte vérifié';
        } else if (p.kyc_status === 'pending') {
          document.getElementById('profile-badge').textContent = '⏳ Vérification en cours';
        } else {
          document.getElementById('profile-badge').textContent = 'Compte actif';
        }
      } catch (e) {
        document.getElementById('profile-name').textContent = 'Erreur de chargement';
      }
    }

    async function loadStats() {
      const userId = getCurrentUserId();
      try {
        const projects = await apiGet('projects', 'owner_id=eq.' + userId);
        document.getElementById('stat-projects').textContent = Array.isArray(projects) ? projects.length : 0;

        const docs = await apiGet('documents', 'uploaded_by=eq.' + userId);
        document.getElementById('stat-docs').textContent = Array.isArray(docs) ? docs.length : 0;
      } catch (e) {}
    }

    document.getElementById('btn-edit').addEventListener('click', () => {
      document.getElementById('fullName').readOnly = false;
      document.getElementById('phone').readOnly = false;
      document.getElementById('country').readOnly = false;
      document.getElementById('btn-save').classList.remove('hidden');
      document.getElementById('btn-edit').classList.add('hidden');
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
      const userId = getCurrentUserId();
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const country = document.getElementById('country').value.trim();

      try {
        await apiPatch('profiles', userId, {
          full_name: fullName,
          phone: phone,
          country: country
        });
        showSuccess('Profil mis à jour !');
        location.reload();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      if (confirm('Se déconnecter ?')) logout();
    });

    loadProfile();
    loadStats();
    setupUserHeader();
  </script>
</body>
</html>
