<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white flex items-center justify-center p-6">

  <div class="max-w-sm mx-auto text-center">

    <div class="text-7xl mb-6">📡</div>

    <h1 class="text-2xl font-extrabold tracking-tight mb-3">Pas de connexion</h1>

    <p class="text-sm text-slate-400 leading-relaxed mb-8">
      Il semble que vous soyez hors ligne. Vérifiez votre connexion internet puis réessayez.
    </p>

    <button onclick="location.reload()" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-extrabold py-4 rounded-2xl text-sm shadow-lg shadow-emerald-500/30 transition">
      🔄 Réessayer
    </button>

    <p class="text-[10px] text-slate-500 mt-6">Espace Diaspora — Construisez au pays</p>

  </div>

</body>
</html>
