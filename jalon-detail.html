<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail du jalon - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a id="btn-back" href="projets.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Détail du jalon</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-5">
      <div class="flex items-center gap-2 mb-3">
        <span id="jalon-number" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-semibold">Jalon</span>
        <span id="jalon-status" class="text-[10px] bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded-full font-semibold">...</span>
      </div>
      <h1 id="jalon-title" class="text-2xl font-bold mb-2">Chargement...</h1>
      <div id="jalon-amount" class="text-2xl font-bold text-emerald-400 mb-1">-</div>
      <p id="jalon-date" class="text-xs text-slate-400"></p>
      <p id="jalon-description" class="text-xs text-slate-300 mt-3"></p>
    </section>

    <section id="actions-investor" class="space-y-2 hidden">
      <button id="btn-approve" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold text-sm">
        ✅ Valider le jalon
      </button>
      <button id="btn-reject" class="w-full bg-red-600/80 hover:bg-red-700 py-3 rounded-xl font-semibold text-sm">
        ❌ Refuser avec motif
      </button>
    </section>

    <section id="actions-pm" class="hidden">
      <button id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-semibold text-sm">
        📸 Soumettre de nouvelles preuves
      </button>
    </section>

    <section class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
      <h2 class="text-sm font-bold mb-2">📝 Description</h2>
      <p id="description-content" class="text-xs text-slate-300">Aucune description</p>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const milestoneId = urlParams.get('id');
    if (!milestoneId) {
      alert('Aucun jalon selectionne');
      window.location.href = 'projets.html';
    }

    let currentMilestone = null;
    let projectOwnerId = null;

    async function loadMilestone() {
      try {
        const data = await apiGet('milestones', 'id=eq.' + milestoneId);
        if (!Array.isArray(data) || !data[0]) {
          document.getElementById('jalon-title').textContent = 'Jalon introuvable';
          return;
        }
        const m = data[0];
        currentMilestone = m;

        document.getElementById('jalon-title').textContent = m.title;
        document.getElementById('jalon-amount').textContent = formatAmount(m.amount, m.currency);
        document.getElementById('jalon-number').textContent = 'Jalon n°' + (m.order_index || '?');
        document.getElementById('jalon-status').textContent = getStatusLabel(m.status);
        document.getElementById('jalon-status').className = 'text-[10px] ' + getStatusBadgeClass(m.status) + ' px-2 py-0.5 rounded-full font-semibold';
        if (m.due_date) document.getElementById('jalon-date').textContent = 'Échéance : ' + formatDate(m.due_date);
        if (m.description) document.getElementById('description-content').textContent = m.description;

        document.getElementById('btn-back').href = 'jalons.html?id=' + m.project_id;

        try {
          const projData = await apiGet('projects', 'id=eq.' + m.project_id);
          if (Array.isArray(projData) && projData[0]) {
            projectOwnerId = projData[0].owner_id;
          }
        } catch (e) {}

        const userId = getCurrentUserId();
        const isOwner = projectOwnerId === userId;
        const canValidate = isOwner && (m.status === 'submitted' || m.status === 'pending');
        const canSubmit = !isOwner && (m.status === 'pending' || m.status === 'in_progress' || m.status === 'rejected');

        if (canValidate) {
          document.getElementById('actions-investor').classList.remove('hidden');
        }
        if (canSubmit) {
          document.getElementById('actions-pm').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('jalon-title').textContent = 'Erreur de chargement';
      }
    }

    document.getElementById('btn-approve').addEventListener('click', async () => {
      if (!confirm('Valider ce jalon ?')) return;
      try {
        await apiPatch('milestones', milestoneId, {
          status: 'approved',
          validated_at: new Date().toISOString(),
          validated_by: getCurrentUserId()
        });
        showSuccess('Jalon validé !');
        location.reload();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('btn-reject').addEventListener('click', async () => {
      const reason = prompt('Motif du refus :');
      if (!reason) return;
      try {
        await apiPatch('milestones', milestoneId, {
          status: 'rejected',
          rejection_reason: reason,
          validated_at: new Date().toISOString(),
          validated_by: getCurrentUserId()
        });
        showSuccess('Jalon refusé');
        location.reload();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      alert('Pour soumettre des preuves, allez dans Documents et uploadez vos photos.');
      window.location.href = 'document-ajouter.html';
    });

    loadMilestone();
  </script>
</body>
</html>
