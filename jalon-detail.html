<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail du jalon - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a id="btn-back" href="projets.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Détail du jalon</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-5">
      <div class="flex items-center gap-2 mb-3">
        <span id="jalon-number" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-semibold">Jalon</span>
        <span id="jalon-status" class="text-[10px] bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded-full font-semibold">...</span>
      </div>
      <h1 id="jalon-title" class="text-2xl font-bold mb-2">Chargement...</h1>
      <div id="jalon-amount" class="text-2xl font-bold text-emerald-400 mb-1">-</div>
      <p id="jalon-date" class="text-xs text-slate-400"></p>
    </section>

    <section id="actions-investor" class="space-y-2 hidden">
      <button id="btn-approve" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 py-3 rounded-xl font-bold text-sm shadow-lg shadow-emerald-500/30">
        ✅ Valider le jalon
      </button>
      <button id="btn-reject" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-500/30">
        ❌ Refuser avec motif
      </button>
    </section>

    <section id="actions-release" class="hidden">
      <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-4 mb-3">
        <p class="text-xs text-emerald-200 leading-relaxed">
          ✅ Jalon validé. Vous pouvez maintenant <strong>débloquer les fonds</strong> pour libérer le paiement.
        </p>
      </div>
      <button id="btn-release" class="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-[#0a1838] py-4 rounded-xl font-extrabold text-sm shadow-lg shadow-amber-500/40">
        💰 Débloquer les fonds
      </button>
    </section>

    <section id="actions-pm" class="hidden">
      <button id="btn-submit" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 py-3 rounded-xl font-bold text-sm">
        📸 Soumettre de nouvelles preuves
      </button>
    </section>

    <section class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
      <h2 class="text-sm font-bold mb-2">📝 Description</h2>
      <p id="description-content" class="text-xs text-slate-300">Aucune description</p>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const milestoneId = urlParams.get('id');
    if (!milestoneId) {
      alert('Aucun jalon selectionne');
      window.location.href = 'projets.html';
    }

    let currentMilestone = null;
    let projectOwnerId = null;
    let currentProject = null;

    async function notifyUser(userId, type, title, message, link, projectId, milestoneIdArg) {
      if (!userId) return;
      try {
        await apiPost('notifications', {
          user_id: userId,
          type: type,
          title: title,
          message: message,
          link: link,
          project_id: projectId || null,
          milestone_id: milestoneIdArg || null
        });
      } catch (e) {
        console.warn('Notification non envoyee :', e.message);
      }
    }

    async function loadMilestone() {
      try {
        const data = await apiGet('milestones', 'id=eq.' + milestoneId);
        if (!Array.isArray(data) || !data[0]) {
          document.getElementById('jalon-title').textContent = 'Jalon introuvable';
          return;
        }
        const m = data[0];
        currentMilestone = m;

        document.getElementById('jalon-title').textContent = m.title;
        document.getElementById('jalon-amount').textContent = formatAmount(m.amount, m.currency);
        document.getElementById('jalon-number').textContent = 'Jalon n°' + (m.order_index || '?');
        document.getElementById('jalon-status').textContent = getStatusLabel(m.status);
        document.getElementById('jalon-status').className = 'text-[10px] ' + getStatusBadgeClass(m.status) + ' px-2 py-0.5 rounded-full font-semibold';
        if (m.due_date) document.getElementById('jalon-date').textContent = 'Echeance : ' + formatDate(m.due_date);
        if (m.description) document.getElementById('description-content').textContent = m.description;

        document.getElementById('btn-back').href = 'jalons.html?id=' + m.project_id;

        try {
          const projData = await apiGet('projects', 'id=eq.' + m.project_id);
          if (Array.isArray(projData) && projData[0]) {
            currentProject = projData[0];
            projectOwnerId = projData[0].owner_id;
          }
        } catch (e) {}

        const userId = getCurrentUserId();
        const isOwner = projectOwnerId === userId;
        const canValidate = isOwner && (m.status === 'submitted' || m.status === 'pending');
        const canRelease = isOwner && m.status === 'approved';
        const canSubmit = !isOwner && (m.status === 'pending' || m.status === 'in_progress' || m.status === 'rejected');

        if (canValidate) {
          document.getElementById('actions-investor').classList.remove('hidden');
        }
        if (canRelease) {
          document.getElementById('actions-release').classList.remove('hidden');
          const btnRelease = document.getElementById('btn-release');
          btnRelease.textContent = 'Debloquer les fonds (' + Number(m.amount).toLocaleString('fr-FR') + ' ' + (m.currency || 'XAF') + ')';
        }
        if (canSubmit) {
          document.getElementById('actions-pm').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('jalon-title').textContent = 'Erreur de chargement';
      }
    }

    document.getElementById('btn-approve').addEventListener('click', async () => {
      if (!confirm('Valider ce jalon ?')) return;
      try {
        await apiPatch('milestones', milestoneId, {
          status: 'approved',
          validated_at: new Date().toISOString(),
          validated_by: getCurrentUserId()
        });
        showSuccess('Jalon valide !');
        location.reload();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('btn-reject').addEventListener('click', async () => {
      const reason = prompt('Motif du refus :');
      if (!reason) return;
      try {
        await apiPatch('milestones', milestoneId, {
          status: 'rejected',
          rejection_reason: reason,
          validated_at: new Date().toISOString(),
          validated_by: getCurrentUserId()
        });
        showSuccess('Jalon refuse');
        location.reload();
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('btn-release').addEventListener('click', async () => {
      if (!currentMilestone) return;

      const amount = Number(currentMilestone.amount);
      const currency = currentMilestone.currency || 'XAF';

      if (!confirm('Debloquer ' + amount.toLocaleString('fr-FR') + ' ' + currency + ' ?')) return;

      const btn = document.getElementById('btn-release');
      btn.disabled = true;
      btn.textContent = 'Deblocage en cours...';

      try {
        await apiPost('transactions', {
          project_id: currentMilestone.project_id,
          milestone_id: currentMilestone.id,
          initiated_by: getCurrentUserId(),
          transaction_type: 'milestone_release',
          status: 'released',
          amount: amount,
          currency: currency,
          description: 'Deblocage : ' + currentMilestone.title
        });

        await apiPatch('milestones', milestoneId, {
          status: 'released',
          released_at: new Date().toISOString()
        });

        try {
          if (currentProject) {
            const spent = Number(currentProject.spent_budget) || 0;
            await apiPatch('projects', currentMilestone.project_id, {
              spent_budget: spent + amount
            });
          }
        } catch (e) {}

        try {
          const artisanId = currentProject ? currentProject.assigned_artisan_id : null;
          if (artisanId) {
            await notifyUser(
              artisanId,
              'payment_received',
              'Paiement recu : ' + amount.toLocaleString('fr-FR') + ' ' + currency,
              'Le client a debloque les fonds pour le jalon "' + currentMilestone.title + '" du projet "' + (currentProject.title || '') + '".',
              'jalon-detail.html?id=' + currentMilestone.id,
              currentMilestone.project_id,
              currentMilestone.id
            );
          }
        } catch (e) {
          console.warn('Notif artisan echouee:', e);
        }

        try {
          const admins = await apiGet('profiles', 'default_role=eq.admin');
          if (Array.isArray(admins)) {
            for (const admin of admins) {
              await notifyUser(
                admin.id,
                'payment_released',
                'Deblocage : ' + amount.toLocaleString('fr-FR') + ' ' + currency,
                'Le client a debloque les fonds sur le jalon "' + currentMilestone.title + '" du projet "' + (currentProject.title || '') + '".',
                'admin-chantiers.html',
                currentMilestone.project_id,
                currentMilestone.id
              );
            }
          }
        } catch (e) {
          console.warn('Notif admin echouee:', e);
        }

        try {
          await apiPost('audit_log', {
            actor_id: getCurrentUserId(),
            action: 'milestone_released',
            table_name: 'milestones',
            record_id: milestoneId,
            new_data: {
              amount: amount,
              currency: currency,
              title: currentMilestone.title
            }
          });
        } catch (e) {}

        showSuccess('Fonds debloques ! ' + amount.toLocaleString('fr-FR') + ' ' + currency);
        location.reload();
      } catch (e) {
        showError(e.message);
        btn.disabled = false;
        btn.textContent = 'Debloquer les fonds';
      }
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      alert('Pour soumettre des preuves, allez dans Documents.');
      window.location.href = 'document-ajouter.html';
    });

    loadMilestone();
  </script>
</body>
</html>
