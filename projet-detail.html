      <section class="bg-gradient-to-br from-emerald-600/20 to-emerald-900/20 border border-emerald-500/30 rounded-2xl p-5">

        <button id="btn-engage" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30">
          Discuter avec l'équipe
        </button>

      <section class="flex gap-1 overflow-x-auto pb-1 -mx-4 px-4">

        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap" data-tab="timeline">Timeline</button>

      <section id="tab-jalons" class="tab-content space-y-3">

      <section id="tab-timeline" class="tab-content hidden space-y-3">
        <div id="timeline-list" class="space-y-3">
          <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
        </div>
      </section>

      <section id="tab-equipe" class="tab-content hidden space-y-3">

  </main>

  <a id="btn-add-milestone" href="#" class="hidden fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-br from-emerald-600 to-emerald-500 rounded-full flex items-center justify-center text-2xl shadow-2xl shadow-emerald-500/40 z-40 hover:scale-110 transition">+</a>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    if (!projectId) {
      alert('Aucun projet selectionne');
      window.location.href = 'projets.html';
    }

    const userRole = getCurrentUserRole();
    const userId = getCurrentUserId();
    const isAdmin = userRole === 'admin';
    const isClient = userRole === 'investor';
    const isArtisan = userRole === 'provider' || userRole === 'project_manager';
    let currentProject = null;

    document.getElementById('btn-edit').href = 'projet-modifier.html?id=' + projectId;
    document.getElementById('btn-add-milestone').href = 'jalon-creer.html?id=' + projectId;
    document.getElementById('btn-docs').href = 'documents.html?id=' + projectId;
    document.getElementById('btn-docs-link').href = 'documents.html?id=' + projectId;

    if (isAdmin) {
      document.getElementById('btn-add-milestone').classList.remove('hidden');
    }

    let allTimelineReports = [];

    /* ============================================
       🔒 FILTRE VISIBILITÉ DOCUMENTS
       L'artisan ne voit JAMAIS les documents confidentiels (client_admin)
       ============================================ */
    function canSeeDoc(doc) {
      if (!doc) return false;
      // Admin voit tout
      if (isAdmin) return true;
      // Client (propriétaire) voit tout
      if (isClient) return true;
      // Artisan : uniquement les documents publics
      if (isArtisan) {
        return !doc.visibility || doc.visibility === 'all';
      }
      return false;
    }

    async function getSignedUrl(path) {
      if (!path) return null;
      if (path.startsWith('http')) return path;
      try {
        const res = await fetch(SUPABASE_URL + '/storage/v1/object/sign/project-documents/' + path, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + (getToken() || SUPABASE_KEY),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ expiresIn: 3600 })
        });
        if (!res.ok) return null;
        const data = await res.json();
        if (data.signedURL) return SUPABASE_URL + '/storage/v1' + data.signedURL;
        return null;
      } catch (e) {
        return null;
      }
    }

    function statusCircle(status, idx) {
      const colors = {
        'released': 'bg-blue-500', 'approved': 'bg-emerald-500',
        'submitted': 'bg-orange-500', 'pending': 'bg-slate-600',
        'rejected': 'bg-red-500', 'in_progress': 'bg-yellow-500'
      };
      return '<div class="w-8 h-8 rounded-full ' + (colors[status] || colors.pending) + ' flex items-center justify-center text-xs font-bold flex-shrink-0">' + idx + '</div>';
    }

    function getStatusColors(status) {
      const map = {
        'active': 'bg-emerald-500/90',
        'draft': 'bg-orange-500/90',
        'completed': 'bg-slate-500/90',
        'paused': 'bg-yellow-500/90',
        'cancelled': 'bg-red-500/90',
        'disputed': 'bg-red-700/90',
        'pending_verification': 'bg-sky-500/90',
        'land_survey_needed': 'bg-amber-500/90',
        'plan_needed': 'bg-purple-500/90',
        'land_survey_and_plan_needed': 'bg-amber-600/90',
        'ready_to_start': 'bg-emerald-500/90'
      };
      return map[status] || 'bg-slate-500/90';
    }

    function statusText(status) {
      const map = {
        'active': 'En cours',
        'draft': 'En préparation',
        'completed': 'Terminé',
        'paused': 'En pause',
        'cancelled': 'Annulé',
        'disputed': 'En litige',
        'pending_verification': '⏳ En vérification',
        'land_survey_needed': '🔍 Enquête foncière',
        'plan_needed': '🎨 Plan à proposer',
        'land_survey_and_plan_needed': '🔍🎨 Enquête + Plan',
        'ready_to_start': '✅ Prêt à démarrer'
      };
      return map[status] || status;
    }

    // ============================================
    // BANDEAU DE STATUT GLOBAL
    // ============================================
    function renderStatusBanner(p) {
      const banner = document.getElementById('status-banner');
      const status = p.status;

      let config = null;

      if (status === 'pending_verification') {
        config = {
          bg: 'rgba(14,165,233,0.12)',
          border: 'rgba(14,165,233,0.45)',
          icon: '⏳',
          title: 'Projet en cours de vérification',
          text: 'Notre équipe examine vos documents. Vous serez notifié dès qu\'ils seront validés.',
          titleColor: '#7dd3fc'
        };
      } else if (status === 'land_survey_needed') {
        config = {
          bg: 'rgba(245,158,11,0.12)',
          border: 'rgba(245,158,11,0.45)',
          icon: '🔍',
          title: 'Enquête foncière en cours',
          text: 'Notre équipe va se déplacer sur le terrain pour vérifier la propriété de votre terrain.',
          titleColor: '#fcd34d'
        };
      } else if (status === 'plan_needed') {
        config = {
          bg: 'rgba(168,85,247,0.12)',
          border: 'rgba(168,85,247,0.45)',
          icon: '🎨',
          title: 'Plan de construction en attente',
          text: 'Notre équipe va vous envoyer un devis pour la réalisation du plan architectural.',
          titleColor: '#d8b4fe'
        };
      } else if (status === 'land_survey_and_plan_needed') {
        config = {
          bg: 'rgba(245,158,11,0.12)',
          border: 'rgba(245,158,11,0.45)',
          icon: '🔍🎨',
          title: 'Enquête foncière + Plan en cours',
          text: 'Notre équipe va réaliser l\'enquête foncière sur le terrain et vous envoyer un devis pour le plan.',
          titleColor: '#fcd34d'
        };
      } else if (status === 'ready_to_start') {
        config = {
          bg: 'rgba(16,185,129,0.12)',
          border: 'rgba(16,185,129,0.45)',
          icon: '✅',
          title: 'Projet prêt à démarrer',
          text: 'Tous les documents sont validés. Notre équipe va désigner un artisan qualifié.',
          titleColor: '#6ee7b7'
        };
      } else if (status === 'active') {
        config = {
          bg: 'rgba(16,185,129,0.12)',
          border: 'rgba(16,185,129,0.45)',
          icon: '🚀',
          title: 'Chantier en cours',
          text: 'Votre chantier est lancé. Suivez l\'avancement dans l\'onglet "Jalons".',
          titleColor: '#6ee7b7'
        };
      }

      if (!config) {
        banner.classList.add('hidden');
        return;
      }

      banner.classList.remove('hidden');
      banner.innerHTML = `
        <div class="rounded-2xl p-4 flex items-start gap-3" style="background:${config.bg}; border:1px solid ${config.border};">
          <span class="text-2xl flex-shrink-0">${config.icon}</span>
          <div class="flex-1">
            <p class="text-sm font-bold" style="color:${config.titleColor};">${config.title}</p>
            <p class="text-[11px] text-slate-300 mt-1 leading-relaxed">${config.text}</p>
          </div>
        </div>
      `;
    }

    // ============================================
    // DOCUMENTS DU PROJET (statut par document)
    // 🔒 L'artisan ne voit QUE le plan, pas le titre foncier
    // ============================================
    function renderDocsStatus(p) {
      const section = document.getElementById('docs-status-section');
      const list = document.getElementById('docs-status-list');

      const prepStatuses = ['pending_verification', 'land_survey_needed', 'plan_needed', 'land_survey_and_plan_needed', 'ready_to_start', 'draft'];
      if (!prepStatuses.includes(p.status)) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      list.innerHTML = '';

      // --- TITRE FONCIER (🔒 caché pour artisan) ---
      if (isAdmin || isClient) {
        let landIcon = '⏳';
        let landText = '';
        let landColor = '#cbd5e1';

        if (p.land_survey_status === 'provided') {
          landIcon = '✅';
          landText = 'Titre foncier reçu — vérification en cours';
          landColor = '#6ee7b7';
        } else if (p.land_survey_status === 'needed') {
          landIcon = '🔍';
          landText = 'Enquête foncière à réaliser par notre équipe';
          landColor = '#fcd34d';
        } else if (p.land_survey_status === 'validated') {
          landIcon = '✅';
          landText = 'Enquête foncière validée';
          landColor = '#6ee7b7';
        } else if (p.land_survey_status === 'not_needed') {
          landIcon = '✅';
          landText = 'Titre foncier fourni';
          landColor = '#6ee7b7';
        }

        list.innerHTML += `
          <div class="flex items-center gap-3 bg-slate-800/40 rounded-xl p-3">
            <span class="text-xl flex-shrink-0">${landIcon}</span>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-bold" style="color:${landColor};">📋 Titre foncier</p>
              <p class="text-[10px] text-slate-400 mt-0.5">${landText}</p>
            </div>
          </div>
        `;
      }

      // --- PLAN (visible par tous) ---
      let planIcon = '⏳';
      let planText = '';
      let planColor = '#cbd5e1';

      if (p.plan_status === 'provided') {
        planIcon = '✅';
        planText = 'Plan reçu — vérification en cours';
        planColor = '#6ee7b7';
      } else if (p.plan_status === 'needed') {
        planIcon = '🎨';
        planText = 'En attente du devis pour le plan';
        planColor = '#d8b4fe';
      } else if (p.plan_status === 'validated') {
        planIcon = '✅';
        planText = 'Plan validé';
        planColor = '#6ee7b7';
      } else if (p.plan_status === 'not_needed') {
        planIcon = '✅';
        planText = 'Plan fourni';
        planColor = '#6ee7b7';
      }

      list.innerHTML += `
        <div class="flex items-center gap-3 bg-slate-800/40 rounded-xl p-3">
          <span class="text-xl flex-shrink-0">${planIcon}</span>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold" style="color:${planColor};">🗺️ Plan de construction</p>
            <p class="text-[10px] text-slate-400 mt-0.5">${planText}</p>
          </div>
        </div>
      `;
    }

    // ============================================
    // DEVIS À ACCEPTER (client)
    // ============================================
    async function loadQuotes() {
      const section = document.getElementById('quotes-section');
      if (!currentProject) return;

      // Ne s'affiche que pour le client (propriétaire)
      if (!isAdmin && currentProject.owner_id !== userId) {
        section.classList.add('hidden');
        return;
      }
      if (isAdmin) {
        section.classList.add('hidden');
        return;
      }

      try {
        const data = await apiGet('project_quotes', 'project_id=eq.' + projectId + '&order=created_at.desc');
        const quotes = Array.isArray(data) ? data : [];

        if (quotes.length === 0) {
          section.classList.add('hidden');
          return;
        }

        section.classList.remove('hidden');
        section.innerHTML = quotes.map(q => {
          const isPending = q.status === 'pending';
          const isAccepted = q.status === 'accepted';
          const isRejected = q.status === 'rejected';

          let badge = '';
          if (isPending) badge = '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">⏳ À VALIDER</span>';
          else if (isAccepted) badge = '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">✅ ACCEPTÉ</span>';
          else if (isRejected) badge = '<span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full font-bold">❌ REFUSÉ</span>';

          let actions = '';
          if (isPending) {
            actions = `
              <div class="grid grid-cols-2 gap-2 mt-3">
                <button class="quote-reject-btn bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 py-2.5 rounded-xl font-bold text-xs" data-id="${q.id}" style="color:#fca5a5;">❌ Refuser</button>
                <button class="quote-accept-btn bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-bold text-xs" data-id="${q.id}">✅ Accepter</button>
              </div>
            `;
          }

          return `
            <div class="bg-gradient-to-br from-purple-600/20 to-purple-900/20 border border-purple-500/40 rounded-2xl p-4">
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="text-xl">💰</span>
                  <div>
                    <h3 class="text-sm font-bold text-purple-200">${escapeHtml(q.title || 'Devis')}</h3>
                    <p class="text-[10px] text-slate-400">${formatDate(q.created_at)}</p>
                  </div>
                </div>
                ${badge}
              </div>

              <p class="text-xs text-slate-300 leading-relaxed mb-3">${escapeHtml(q.description || '')}</p>

              <div class="bg-slate-900/60 rounded-xl p-3 text-center mb-3">
                <div class="text-2xl font-extrabold text-purple-300">${Number(q.amount).toLocaleString('fr-FR')}</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">${q.currency || 'XAF'}</div>
              </div>

              ${actions}
            </div>
          `;
        }).join('');

        section.querySelectorAll('.quote-accept-btn').forEach(btn => {
          btn.addEventListener('click', () => respondToQuote(btn.dataset.id, 'accepted'));
        });
        section.querySelectorAll('.quote-reject-btn').forEach(btn => {
          btn.addEventListener('click', () => respondToQuote(btn.dataset.id, 'rejected'));
        });

      } catch (e) {
        console.warn('[quotes]', e);
        section.classList.add('hidden');
      }
    }

    async function respondToQuote(quoteId, response) {
      const isAccept = response === 'accepted';
      const confirmMsg = isAccept
        ? 'Accepter ce devis ? L\'équipe sera notifiée et commencera le travail.'
        : 'Refuser ce devis ? Vous pourrez toujours négocier avec l\'équipe.';

      if (!confirm(confirmMsg)) return;

      try {
        await apiPatch('project_quotes', quoteId, {
          status: response,
          responded_at: new Date().toISOString()
        });

        try {
          const admins = await apiGet('profiles', 'default_role=eq.admin');
          if (Array.isArray(admins)) {
            for (const a of admins) {
              await apiPost('notifications', {
                user_id: a.id,
                type: isAccept ? 'quote_accepted' : 'quote_rejected',
                title: isAccept ? '✅ Devis accepté par le client' : '❌ Devis refusé par le client',
                message: 'Le client a ' + (isAccept ? 'accepté' : 'refusé') + ' le devis pour le projet "' + (currentProject ? currentProject.title : '') + '".',
                link: 'admin-validation-docs.html'
              });
            }
          }
        } catch (e) {}

        showSuccess(isAccept ? 'Devis accepté' : 'Devis refusé');
        await loadQuotes();
      } catch (e) {
        showError(e.message);
      }
    }

    // ============================================
    // CHARGEMENT DU PROJET
    // ============================================
    async function loadProject() {
      try {
        const data = await apiGet('projects', 'id=eq.' + projectId);
        if (!Array.isArray(data) || !data[0]) {
          document.getElementById('project-title').textContent = 'Projet introuvable';
          return;
        }
        const p = data[0];
        currentProject = p;

        document.getElementById('project-title').textContent = p.title;
        document.getElementById('project-location').textContent = '📍 ' + (p.city || '') + (p.country ? ', ' + p.country : '');
        document.getElementById('project-status').textContent = statusText(p.status);
        document.getElementById('project-status').className = 'self-start text-[10px] ' + getStatusColors(p.status) + ' backdrop-blur text-white px-3 py-1 rounded-full font-bold tracking-wide mb-3';

        const budget = Number(p.total_budget) || 0;
        const spent = Number(p.spent_budget) || 0;
        const currency = p.currency || 'XAF';
        document.getElementById('stat-budget').textContent = budget.toLocaleString('fr-FR');
        document.getElementById('stat-spent').textContent = spent.toLocaleString('fr-FR');
        document.getElementById('stat-remaining').textContent = (budget - spent).toLocaleString('fr-FR');
        document.getElementById('stat-currency').textContent = currency;
        document.getElementById('stat-currency-2').textContent = currency;
        document.getElementById('stat-currency-3').textContent = currency;

        const heroImg = document.querySelector('.ed-hero-image');
        if (heroImg && typeof edCoverFor === 'function') {
          heroImg.style.backgroundImage = 'url(' + edCoverFor(p.id) + ')';
          heroImg.style.backgroundSize = 'cover';
          heroImg.style.backgroundPosition = 'center';
        }

        renderStatusBanner(p);
        renderDocsStatus(p);
        await loadQuotes();
      } catch (e) {
        document.getElementById('project-title').textContent = 'Erreur';
      }
    }

    // ============================================================
    // JALONS
    // ============================================================
    async function loadMilestones() {
      const list = document.getElementById('milestones-list');
      const role = getCurrentUserRole();
      const isClient = (role === 'investor');

      try {
        let params = 'project_id=eq.' + projectId + '&order=order_index';
        if (isClient) {
          params += '&proposal_status=eq.validated';
        }

        const data = await apiGet('milestones', params);
        const valid = Array.isArray(data) ? data : [];

        if (valid.length === 0) {
          if (isClient) {
            list.innerHTML = `
              <div class="text-center py-10 bg-white/5 border border-white/10 rounded-2xl">
                <div class="text-5xl mb-4 opacity-40">⏳</div>
                <h3 class="text-base font-bold mb-2">En attente des jalons de l'artisan</h3>
                <p class="text-xs text-slate-400 leading-relaxed max-w-xs mx-auto">
                  L'artisan travaille actuellement sur le découpage de votre chantier. Les jalons apparaîtront ici dès leur validation par notre équipe.
                </p>
              </div>
            `;
          } else {
            list.innerHTML = `
              <div class="text-center py-10 bg-white/5 border border-white/10 rounded-2xl">
                <div class="text-5xl mb-4 opacity-40">📋</div>
                <h3 class="text-base font-bold mb-2">Aucun jalon</h3>
                <p class="text-xs text-slate-400 leading-relaxed max-w-xs mx-auto">
                  L'artisan n'a pas encore proposé de découpage pour ce chantier.
                </p>
              </div>
            `;
          }
          document.getElementById('progress-text').textContent = '0%';
          document.getElementById('progress-bar').style.width = '0%';
          return;
        }

        let infoBanner = '';
        if (isClient) {
          try {
            const pendingData = await apiGet('milestones', 'project_id=eq.' + projectId + '&proposal_status=eq.pending');
            const pendingCount = Array.isArray(pendingData) ? pendingData.length : 0;
            if (pendingCount > 0) {
              infoBanner = `
                <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-start gap-2 mb-2">
                  <span class="text-amber-400 text-sm flex-shrink-0">⏳</span>
                  <p class="text-[11px] text-amber-200 leading-relaxed">
                    <strong>${pendingCount} jalon(s)</strong> en cours de validation par notre équipe. Ils apparaîtront ici dès validation.
                  </p>
                </div>
              `;
            }
          } catch (e) {}
        }

        list.innerHTML = infoBanner + valid.map((m, i) => `
          <a href="jalon-detail.html?id=${m.id}" class="flex gap-3 bg-white/5 border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
            ${statusCircle(m.status, m.order_index || i + 1)}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start mb-1.5 gap-2">
                <h3 class="font-bold text-sm leading-tight">${escapeHtml(m.title)}</h3>
                ${renderStatusBadge(m.status)}
              </div>
              ${m.description ? `<p class="text-[11px] text-slate-300 leading-relaxed mb-2">${escapeHtml(m.description)}</p>` : ''}
              <p class="text-[11px] text-slate-400 font-semibold">💰 ${formatAmount(m.amount, m.currency)}</p>
            </div>
          </a>
        `).join('');

        const validated = valid.filter(m => m.status === 'approved' || m.status === 'released').length;
        const progress = valid.length > 0 ? Math.round((validated / valid.length) * 100) : 0;
        document.getElementById('progress-text').textContent = progress + '%';
        document.getElementById('progress-bar').style.width = progress + '%';
      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur</p>';
      }
    }

    async function loadTimeline() {
      const list = document.getElementById('timeline-list');
      try {
        const data = await apiGet('reports', 'project_id=eq.' + projectId + '&status=eq.published&order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];
        allTimelineReports = valid.filter(r => !r.deleted_by_client);

        if (allTimelineReports.length === 0) {
          list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">📭</div><p class="text-slate-400 text-sm">Aucun rapport pour le moment</p><p class="text-slate-500 text-xs mt-2">Les rapports validés apparaitront ici.</p></div>';
          return;
        }

        renderTimeline(allTimelineReports);
      } catch (e) {
        list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Impossible de charger</p>';
      }
    }

    async function renderTimeline(reports) {
      const list = document.getElementById('timeline-list');
      const cards = [];

      for (const r of reports) {
        let photos = [];
        let invoices = [];
        try {
          const docs = await apiGet('documents', 'report_id=eq.' + r.id + '&order=created_at.asc');
          if (Array.isArray(docs)) {
            // 🔒 FILTRE : on ne garde que les docs visibles selon le rôle
            const visibleDocs = docs.filter(canSeeDoc);
            photos = visibleDocs.filter(d => d.document_type === 'photo');
            invoices = visibleDocs.filter(d => d.document_type === 'invoice');
          }
        } catch (e) {}

        const photoUrls = [];
        for (const p of photos) {
          const url = await getSignedUrl(p.storage_path);
          if (url) photoUrls.push({ url: url, title: p.title });
        }

        const invoiceUrls = [];
        for (const inv of invoices) {
          const url = await getSignedUrl(inv.storage_path);
          if (url) invoiceUrls.push({ url: url, title: inv.title });
        }

        cards.push(`
          <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl overflow-hidden">
            <div class="p-4">
              <div class="flex justify-between items-start mb-2 gap-2">
                <h3 class="font-bold text-sm flex-1">${escapeHtml(r.title)}</h3>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold flex-shrink-0">${r.progress_percent || 0}%</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[10px] text-slate-500">${formatDate(r.created_at)}</span>
                <button class="toggle-tl text-[10px] text-sky-400 font-bold" data-id="${r.id}">Afficher ▼</button>
              </div>
            </div>

            <div id="tl-${r.id}" class="hidden border-t border-white/10 p-4 space-y-3 bg-slate-900/30">
              <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap">${escapeHtml(r.content)}</p>

              ${r.blockers ? '<p class="text-[11px] text-red-300">⚠️ Blocage : ' + escapeHtml(r.blockers) + '</p>' : ''}

              ${photoUrls.length > 0 ? `
                <div>
                  <p class="text-[10px] text-amber-300 uppercase tracking-wider font-bold mb-2">📸 Photos (${photoUrls.length})</p>
                  <div class="grid grid-cols-2 gap-2">
                    ${photoUrls.map(p => `
                      <div class="relative rounded-xl overflow-hidden border border-white/10 bg-slate-800">
                        <img src="${p.url}" alt="${escapeHtml(p.title)}" class="w-full h-32 object-cover">
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${invoiceUrls.length > 0 ? `
                <div>
                  <p class="text-[10px] text-emerald-300 uppercase tracking-wider font-bold mb-2">📄 Factures (${invoiceUrls.length})</p>
                  <div class="space-y-1">
                    ${invoiceUrls.map(inv => `
                      <a href="${inv.url}" target="_blank" class="flex items-center gap-2 bg-slate-800/50 rounded-lg p-2 hover:bg-slate-800 transition">
                        <span class="text-sm">📄</span>
                        <span class="text-[11px] flex-1 truncate">${escapeHtml(inv.title)}</span>
                        <span class="text-emerald-400 text-xs">↗</span>
                      </a>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="pt-2 border-t border-white/10">
                <button class="hide-btn w-full bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300 font-bold py-2.5 rounded-xl text-[11px] transition" data-id="${r.id}">
                  🗑️ Masquer ce rapport
                </button>
              </div>
            </div>
          </div>
        `);
      }

      list.innerHTML = cards.join('');

      document.querySelectorAll('.toggle-tl').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const box = document.getElementById('tl-' + id);
          const isHidden = box.classList.contains('hidden');
          box.classList.toggle('hidden');
          btn.textContent = isHidden ? 'Masquer ▲' : 'Afficher ▼';
        });
      });

      document.querySelectorAll('.hide-btn').forEach(btn => {
        btn.addEventListener('click', () => hideReport(btn.dataset.id));
      });
    }

    async function hideReport(reportId) {
      if (!confirm('Masquer ce rapport de votre vue ?\n\nLe rapport restera dans la plateforme mais ne sera plus visible pour vous.')) return;
      try {
        await apiPatch('reports', reportId, { deleted_by_client: true });
        showSuccess('Rapport masqué');
        loadTimeline();
      } catch (e) {
        showError(e.message);
      }
    }

    async function loadTeam() {
      const list = document.getElementById('team-list');
      try {
        const data = await apiGet('project_members', 'project_id=eq.' + projectId + '&is_active=eq.true');
        const valid = Array.isArray(data) ? data : [];
        if (valid.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucun membre</p>';
          return;
        }
        list.innerHTML = valid.map(m => `
          <div class="flex gap-3 items-center bg-white/5 border border-white/10 rounded-2xl p-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500/30 flex items-center justify-center text-xs font-bold">${(m.role || 'M').substring(0, 2).toUpperCase()}</div>
            <div class="flex-1">
              <p class="text-sm font-semibold">${escapeHtml(m.role)}</p>
              <p class="text-[10px] text-slate-400">Membre</p>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    loadProject();
    loadMilestones();
    loadTimeline();
    loadTeam();
  </script>
</body>
</html>
