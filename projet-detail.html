<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail du projet - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <a href="projets.html" class="fixed top-4 left-4 z-50 w-10 h-10 rounded-xl bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center text-white text-xl hover:bg-black/70 transition">←</a>

  <main class="max-w-2xl mx-auto">

    <section class="ed-hero-banner relative h-72 overflow-hidden">
      <div class="ed-hero-image absolute inset-0 bg-slate-800"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#061229] via-[#061229]/60 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-br from-emerald-900/30 to-transparent"></div>

      <div class="relative h-full flex flex-col justify-end p-5 z-10">
        <span id="project-status" class="self-start text-[10px] bg-emerald-500/90 backdrop-blur text-white px-3 py-1 rounded-full font-bold tracking-wide mb-3">...</span>
        <h1 id="project-title" class="text-2xl font-extrabold tracking-tight leading-tight mb-1">Chargement...</h1>
        <p id="project-location" class="text-xs text-slate-300 font-medium">📍</p>
      </div>

      <a href="#" id="btn-edit" class="absolute top-4 right-4 z-20 w-10 h-10 rounded-xl bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-black/70 transition">⋯</a>
    </section>

    <div class="p-4 space-y-4 -mt-2">

      <section class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
        <div class="grid grid-cols-3 gap-2 text-center">
          <div>
            <div class="text-[10px] text-slate-400 mb-1 uppercase tracking-wider font-semibold">Budget</div>
            <div id="stat-budget" class="text-base font-bold">-</div>
            <div class="text-[10px] text-slate-400" id="stat-currency">XAF</div>
          </div>
          <div class="border-l border-white/10">
            <div class="text-[10px] text-slate-400 mb-1 uppercase tracking-wider font-semibold">Dépensé</div>
            <div id="stat-spent" class="text-base font-bold text-amber-400">0</div>
            <div class="text-[10px] text-slate-400" id="stat-currency-2">XAF</div>
          </div>
          <div class="border-l border-white/10">
            <div class="text-[10px] text-slate-400 mb-1 uppercase tracking-wider font-semibold">Restant</div>
            <div id="stat-remaining" class="text-base font-bold text-emerald-400">-</div>
            <div class="text-[10px] text-slate-400" id="stat-currency-3">XAF</div>
          </div>
        </div>
        <div class="mt-4">
          <div class="flex justify-between text-[11px] text-slate-400 mb-1.5">
            <span class="font-semibold uppercase tracking-wider">Avancement</span>
            <span id="progress-text" class="font-bold text-white">0%</span>
          </div>
          <div class="w-full bg-slate-700/50 rounded-full h-2 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-emerald-400 h-2 rounded-full transition-all" style="width: 0%"></div>
          </div>
        </div>
      </section>

      <section class="bg-gradient-to-br from-emerald-600/20 to-emerald-900/20 border border-emerald-500/30 rounded-2xl p-5">
        <div class="flex items-start gap-3 mb-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-2xl flex-shrink-0">🤝</div>
          <div class="flex-1">
            <h2 class="text-base font-bold text-white">S'engager sur ce projet</h2>
            <p class="text-xs text-slate-300 mt-1 leading-relaxed">
              Échangez avec l'équipe de pilotage pour participer ou investir.
            </p>
          </div>
        </div>
        <button id="btn-engage" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30">
          Discuter avec l'équipe
        </button>
      </section>

      <section class="flex gap-1 overflow-x-auto pb-1 -mx-4 px-4">
        <button class="tab-btn bg-emerald-600 px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap" data-tab="jalons">Jalons</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap" data-tab="timeline">Timeline</button>
        <a href="documents.html" id="btn-docs" class="bg-white/5 border border-white/10 px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap">Documents</a>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap" data-tab="equipe">Équipe</button>
      </section>

      <section id="tab-jalons" class="tab-content space-y-3">
        <div id="milestones-list" class="space-y-3">
          <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
        </div>
      </section>

      <section id="tab-timeline" class="tab-content hidden space-y-3">
        <div id="timeline-list" class="space-y-3">
          <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
        </div>
      </section>

      <section id="tab-equipe" class="tab-content hidden space-y-3">
        <div id="team-list" class="space-y-3">
          <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
        </div>
      </section>

    </div>

  </main>

  <a id="btn-add-milestone" href="#" class="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-br from-emerald-600 to-emerald-500 rounded-full flex items-center justify-center text-2xl shadow-2xl shadow-emerald-500/40 z-40 hover:scale-110 transition">+</a>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    if (!projectId) {
      alert('Aucun projet selectionne');
      window.location.href = 'projets.html';
    }

    document.getElementById('btn-edit').href = 'projet-modifier.html?id=' + projectId;
    document.getElementById('btn-add-milestone').href = 'jalon-creer.html?id=' + projectId;
    document.getElementById('btn-docs').href = 'documents.html?id=' + projectId;

    function statusCircle(status, idx) {
      const colors = {
        'released': 'bg-blue-500', 'approved': 'bg-emerald-500',
        'submitted': 'bg-orange-500', 'pending': 'bg-slate-600',
        'rejected': 'bg-red-500', 'in_progress': 'bg-yellow-500'
      };
      return '<div class="w-8 h-8 rounded-full ' + (colors[status] || colors.pending) + ' flex items-center justify-center text-xs font-bold">' + idx + '</div>';
    }

    function getStatusColors(status) {
      const map = {
        'active': 'bg-emerald-500/90', 'draft': 'bg-orange-500/90',
        'completed': 'bg-slate-500/90', 'paused': 'bg-yellow-500/90',
        'cancelled': 'bg-red-500/90', 'disputed': 'bg-red-700/90'
      };
      return map[status] || 'bg-slate-500/90';
    }

    async function loadProject() {
      try {
        const data = await apiGet('projects', 'id=eq.' + projectId);
        if (!Array.isArray(data) || !data[0]) {
          document.getElementById('project-title').textContent = 'Projet introuvable';
          return;
        }
        const p = data[0];
        document.getElementById('project-title').textContent = p.title;
        document.getElementById('project-location').textContent = '📍 ' + (p.city || '') + (p.country ? ', ' + p.country : '');
        document.getElementById('project-status').textContent = getStatusLabel(p.status);
        document.getElementById('project-status').className = 'self-start text-[10px] ' + getStatusColors(p.status) + ' backdrop-blur text-white px-3 py-1 rounded-full font-bold tracking-wide mb-3';

        const budget = Number(p.total_budget) || 0;
        const spent = Number(p.spent_budget) || 0;
        const currency = p.currency || 'XAF';
        document.getElementById('stat-budget').textContent = budget.toLocaleString('fr-FR');
        document.getElementById('stat-spent').textContent = spent.toLocaleString('fr-FR');
        document.getElementById('stat-remaining').textContent = (budget - spent).toLocaleString('fr-FR');
        document.getElementById('stat-currency').textContent = currency;
        document.getElementById('stat-currency-2').textContent = currency;
        document.getElementById('stat-currency-3').textContent = currency;

        const heroImg = document.querySelector('.ed-hero-image');
        if (heroImg && typeof edCoverFor === 'function') {
          heroImg.style.backgroundImage = 'url(' + edCoverFor(p.id) + ')';
          heroImg.style.backgroundSize = 'cover';
          heroImg.style.backgroundPosition = 'center';
        }
      } catch (e) {
        document.getElementById('project-title').textContent = 'Erreur';
      }
    }

    async function loadMilestones() {
      const list = document.getElementById('milestones-list');
      try {
        const data = await apiGet('reports', 'project_id=eq.' + projectId + '&status=eq.published&order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];
        if (valid.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucun jalon. Cliquez sur + pour en creer un.</p>';
          return;
        }
        list.innerHTML = valid.map((m, i) => `
          <a href="jalon-detail.html?id=${m.id}" class="flex gap-3 bg-white/5 border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
            ${statusCircle(m.status, m.order_index || i + 1)}
            <div class="flex-1">
              <div class="flex justify-between items-start mb-1 gap-2">
                <h3 class="font-bold text-sm">${escapeHtml(m.title)}</h3>
                ${renderStatusBadge(m.status)}
              </div>
              <p class="text-[11px] text-slate-400">💰 ${formatAmount(m.amount)}</p>
            </div>
          </a>
        `).join('');

        const validated = valid.filter(m => m.status === 'approved' || m.status === 'released').length;
        const progress = Math.round((validated / valid.length) * 100);
        document.getElementById('progress-text').textContent = progress + '%';
        document.getElementById('progress-bar').style.width = progress + '%';
      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur</p>';
      }
    }

    async function loadTimeline() {
      const list = document.getElementById('timeline-list');
      try {
        const data = await apiGet('reports', 'project_id=eq.' + projectId + '&order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];
        if (valid.length === 0) {
          list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">📭</div><p class="text-slate-400 text-sm">Aucun rapport pour le moment</p><p class="text-slate-500 text-xs mt-2">Les rapports du chef de chantier apparaitront ici.</p></div>';
          return;
        }
        list.innerHTML = valid.map(r => `
          <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-sm">${escapeHtml(r.title)}</h3>
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">${r.progress_percent || 0}%</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed mb-3">${escapeHtml(r.content)}</p>
            ${r.blockers ? '<p class="text-[11px] text-red-300 mb-2">⚠️ ' + escapeHtml(r.blockers) + '</p>' : ''}
            <p class="text-[10px] text-slate-500">${formatDate(r.created_at)}</p>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Impossible de charger</p>';
      }
    }

    async function loadTeam() {
      const list = document.getElementById('team-list');
      try {
        const data = await apiGet('project_members', 'project_id=eq.' + projectId + '&is_active=eq.true');
        const valid = Array.isArray(data) ? data : [];
        if (valid.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-6">Aucun membre</p>';
          return;
        }
        list.innerHTML = valid.map(m => `
          <div class="flex gap-3 items-center bg-white/5 border border-white/10 rounded-2xl p-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500/30 flex items-center justify-center text-xs font-bold">${(m.role || 'M').substring(0, 2).toUpperCase()}</div>
            <div class="flex-1">
              <p class="text-sm font-semibold">${escapeHtml(m.role)}</p>
              <p class="text-[10px] text-slate-400">Membre</p>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    loadProject();
    loadMilestones();
    loadTimeline();
    loadTeam();
  </script>
</body>
</html>
