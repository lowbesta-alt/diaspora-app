<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Admin - Simple</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

  <header class="mb-4">
    <a href="dashboard-admin.html" class="text-sm text-sky-400">← Retour</a>
    <h1 class="text-xl font-bold mt-2">🛡️ KYC à traiter</h1>
  </header>

  <div id="list" class="space-y-3">
    <p class="text-slate-400 text-sm">Chargement...</p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async function() {
      const list = document.getElementById('list');

      try {
        if (!requireLogin()) return;

        // 1) KYC en attente
        const kycs = await apiGet('kyc_verifications', 'status=eq.pending&order=created_at.desc&limit=50');
        if (!Array.isArray(kycs) || kycs.length === 0) {
          list.innerHTML = '<div class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center"><div class="text-4xl mb-2">📭</div><p class="text-slate-300">Aucun KYC en attente</p></div>';
          return;
        }

        // 2) Récupère les profils des users concernés
        const userIds = [...new Set(kycs.map(k => k.user_id))];
        let profiles = {};
        try {
          const profs = await apiGet('profiles', 'id=in.(' + userIds.join(',') + ')');
          if (Array.isArray(profs)) for (const p of profs) profiles[p.id] = p;
        } catch (e) {}

        // 3) Affiche la liste
        list.innerHTML = kycs.map(k => {
          const p = profiles[k.user_id] || {};
          const name = p.full_name || p.email || 'Utilisateur';
          return `
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold">${escapeHtml(name)}</h3>
                  <p class="text-xs text-slate-400">${escapeHtml(k.document_type || '—')}</p>
                </div>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg">⏳ À traiter</span>
              </div>
              <p class="text-xs text-slate-400 mb-3">Envoyé le ${formatDate(k.created_at)}</p>
              <div class="flex gap-2">
                <button data-id="${k.id}" data-uid="${k.user_id}" data-action="reject" class="flex-1 bg-red-600 py-2 rounded-lg text-xs font-bold">❌ Refuser</button>
                <button data-id="${k.id}" data-uid="${k.user_id}" data-action="approve" class="flex-1 bg-emerald-600 py-2 rounded-lg text-xs font-bold">✅ Valider</button>
              </div>
            </div>
          `;
        }).join('');

        // 4) Boutons
        document.querySelectorAll('button[data-action]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const action = btn.dataset.action;
            const kycId = btn.dataset.id;
            const uid = btn.dataset.uid;

            if (action === 'approve') {
              if (!confirm('Valider ce KYC ?')) return;
              try {
                await apiPatch('kyc_verifications', kycId, { status: 'verified' });
                await apiPatch('profiles', uid, { kyc_status: 'verified' });
                alert('✅ KYC validé');
                location.reload();
              } catch (e) { alert('Erreur : ' + e.message); }
            } else {
              const reason = prompt('Raison du refus :');
              if (!reason) return;
              try {
                try {
                  await apiPatch('kyc_verifications', kycId, { status: 'rejected', rejection_reason: reason });
                } catch (e) {
                  await apiPatch('kyc_verifications', kycId, { status: 'rejected' });
                }
                await apiPatch('profiles', uid, { kyc_status: 'rejected' });
                alert('❌ KYC refusé');
                location.reload();
              } catch (e) { alert('Erreur : ' + e.message); }
            }
          });
        });

      } catch (e) {
        console.error(e);
        list.innerHTML = '<div class="bg-red-500/10 border border-red-500/40 rounded-2xl p-4 text-red-300 text-sm">Erreur : ' + escapeHtml(e.message || String(e)) + '</div>';
      }
    })();
  </script>
</body>
</html>
