<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partenaires - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Gestion des Partenaires</h1>
      <p class="text-sm text-slate-400 mt-1">Suivi et administration des partenaires de la plateforme</p>
    </div>

    <input type="text" id="searchPartenaire" placeholder="🔍 Rechercher un partenaire..." class="w-full px-4 py-3 rounded-xl bg-white/5 text-sm placeholder-slate-500 focus:outline-none transition" style="border: 1px solid rgba(16,185,129,0.3);">

    <div id="partenaires-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement des partenaires...</p>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPartenaires = [];

    async function initPartenaires() {
      const container = document.getElementById('partenaires-list');
      try {
        // On récupère depuis 'profiles' pour éviter l'erreur de table 'partners' inexistante
        const res = typeof apiGet === 'function' ? await apiGet('profiles') : [];
        const profilesList = Array.isArray(res) ? res : (res?.data || []);

        // Filtrage des profils pour cibler les partenaires (ajuste 'partenaire' si ton rôle s'appelle 'partner' en anglais)
        allPartenaires = profilesList.filter(u => {
          const roleValue = u.role || u.user_type || u.type || '';
          const roleLower = roleValue.toLowerCase().trim();
          return roleLower === 'partenaire' || roleLower === 'partner';
        });

        renderPartenaires(allPartenaires);
      } catch (e) {
        console.error("Erreur chargement partenaires :", e);
        container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs">Erreur de chargement : ${e.message}</div>`;
      }
    }

    function renderPartenaires(list) {
      const container = document.getElementById('partenaires-list');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">🤝</div><p class="text-slate-400 text-sm">Aucun partenaire enregistré</p></div>';
        return;
      }

      container.innerHTML = list.map(p => {
        const name = p.full_name || p.name || 'Nom non spécifié';
        const email = p.email || 'Email non renseigné';
        const phone = p.phone || 'Téléphone non renseigné';

        return `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-4 transition space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-extrabold text-sm text-emerald-400">${name}</h3>
                <p class="text-xs text-slate-300 mt-0.5">📧 ${email}</p>
                <p class="text-xs text-slate-400">📞 ${phone}</p>
              </div>
              <span class="text-xs px-2 py-1 bg-emerald-950 text-emerald-300 border border-emerald-500/30 rounded-lg">Partenaire</span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchPartenaire')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderPartenaires(allPartenaires.filter(p => {
        const name = (p.full_name || p.name || '').toLowerCase();
        const email = (p.email || '').toLowerCase();
        return name.includes(q) || email.includes(q);
      }));
    });

    initPartenaires();
  </script>
</body>
</html>
