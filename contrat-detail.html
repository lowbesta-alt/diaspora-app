<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrat - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background: #0f172a; margin: 0; }
    .a4-page {
      background: #ffffff;
      color: #111827;
      max-width: 21cm;
      margin: 1rem auto;
      padding: 1.5cm;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border-radius: 4px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 12px;
      line-height: 1.6;
    }
    .a4-page h1 { font-size: 20px; font-weight: bold; text-align: center; margin: 0 0 4px 0; text-transform: uppercase; }
    .a4-page h2 { font-size: 13px; font-weight: bold; margin: 16px 0 6px 0; color: #111827; }
    .a4-page p { margin: 6px 0; color: #1f2937; }
    .a4-page .header-line { border-bottom: 2px solid #0f766e; margin: 8px 0 20px 0; }
    .a4-page .logo-box { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .a4-page .logo-icon { width: 40px; height: 40px; background: #0f766e; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .a4-page .logo-text { font-size: 14px; font-weight: bold; color: #0f766e; letter-spacing: 1px; }
    .a4-page .logo-sub { font-size: 10px; color: #6b7280; letter-spacing: 2px; }
    .a4-page .meta { text-align: right; font-size: 11px; color: #6b7280; }
    .a4-page .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 16px 0; }
    .a4-page .party-box { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; background: #f9fafb; }
    .a4-page .party-title { font-size: 11px; font-weight: bold; color: #0f766e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .a4-page .party-name { font-weight: bold; font-size: 13px; color: #111827; }
    .a4-page .party-line { font-size: 11px; color: #4b5563; margin-top: 2px; }
    .a4-page .article { margin: 12px 0; }
    .a4-page .article-num { font-weight: bold; color: #0f766e; }
    .a4-page .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; padding-top: 20px; border-top: 1px dashed #9ca3af; }
    .a4-page .sig-box { text-align: center; }
    .a4-page .sig-label { font-size: 11px; font-weight: bold; color: #374151; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .a4-page .sig-img { max-height: 80px; max-width: 100%; border-bottom: 1px solid #111827; padding-bottom: 4px; margin-bottom: 4px; }
    .a4-page .sig-text { font-size: 20px; font-style: italic; font-family: Georgia, serif; color: #0f766e; border-bottom: 1px solid #111827; padding: 0 12px 4px; display: inline-block; margin-bottom: 4px; }
    .a4-page .sig-date { font-size: 10px; color: #6b7280; }
    .a4-page .sig-status { font-size: 10px; margin-top: 2px; }
    .a4-page .sig-ok { color: #059669; }
    .a4-page .sig-wait { color: #d97706; }
    .a4-page .annexe-title { font-size: 14px; font-weight: bold; color: #0f766e; margin: 30px 0 10px; text-transform: uppercase; letter-spacing: 2px; border-top: 2px solid #0f766e; padding-top: 12px; }
    .a4-page .kyc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .a4-page .kyc-block { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; background: #f9fafb; }
    .a4-page .kyc-title { font-size: 11px; font-weight: bold; color: #374151; margin-bottom: 8px; }
    .a4-page .kyc-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .a4-page .kyc-img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; }
    .a4-page .kyc-img-label { font-size: 9px; color: #6b7280; text-align: center; margin-top: 2px; }
    .a4-page .footer-note { margin-top: 30px; font-size: 9px; color: #9ca3af; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 10px; }
    
    .no-print { display: block; }
    
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .a4-page { box-shadow: none !important; margin: 0 !important; max-width: 100% !important; padding: 1cm !important; border-radius: 0 !important; }
      @page { size: A4; margin: 1cm; }
    }
  </style>
</head>
<body class="text-white">

  <!-- BARRE DU HAUT (cachée à l'impression) -->
  <div class="no-print sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-white/10 px-4 py-3 flex items-center justify-between">
    <a href="contrats.html" class="text-2xl text-white">←</a>
    <span class="font-bold text-sm">Aperçu du contrat</span>
    <button id="btn-print" class="text-xs font-bold px-4 py-2 rounded-lg" style="background:#059669; color:#fff;">
      🖨️ PDF / Imprimer
    </button>
  </div>

  <!-- BARRE D'ACTIONS (cachée à l'impression) -->
  <div class="no-print max-w-2xl mx-auto px-4 pt-4 text-center text-xs text-slate-400">
    <p>Faites défiler pour voir le contrat. Cliquez sur <strong>PDF / Imprimer</strong> pour télécharger.</p>
  </div>

  <!-- CONTENU DU CONTRAT A4 -->
  <div id="a4-content" class="a4-page">
    <div class="text-center text-gray-500 py-10">Chargement du contrat…</div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const urlParams = new URLSearchParams(window.location.search);
    const contractId = urlParams.get('id');
    if (!contractId) {
      alert('Aucun contrat sélectionné');
      window.location.href = 'contrats.html';
    }

    const signedCache = new Map();

    async function getSignedUrl(bucket, path, expiresIn = 3600) {
      const key = bucket + '/' + path;
      const cached = signedCache.get(key);
      if (cached && cached.exp > Date.now() + 60000) return cached.url;
      try {
        const token = getToken() || SUPABASE_KEY;
        const res = await fetch(SUPABASE_URL + '/storage/v1/object/sign/' + bucket + '/' + path, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ expiresIn })
        });
        if (!res.ok) return null;
        const data = await res.json();
        if (data.signedURL) {
          const url = SUPABASE_URL + '/storage/v1' + data.signedURL;
          signedCache.set(key, { url, exp: Date.now() + (expiresIn - 120) * 1000 });
          return url;
        }
        return null;
      } catch (e) { return null; }
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtDate(d) {
      if (!d) return '—';
      try {
        const dt = new Date(d);
        return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch (e) { return '—'; }
    }

    function fmtDateTime(d) {
      if (!d) return '—';
      try {
        return new Date(d).toLocaleString('fr-FR');
      } catch (e) { return '—'; }
    }

    function fmtMoney(n) {
      if (!n) return '—';
      return Number(n).toLocaleString('fr-FR') + ' XAF';
    }

    async function loadAndRender() {
      const container = document.getElementById('a4-content');
      try {
        // 1) Contrat
        const cData = await apiGet('contracts', 'id=eq.' + contractId);
        if (!Array.isArray(cData) || !cData[0]) {
          container.innerHTML = '<div class="text-red-600 text-center py-10">Contrat introuvable</div>';
          return;
        }
        const c = cData[0];

        // 2) Profils des 2 parties
        const partyIds = [c.party_investor_id, c.party_provider_id].filter(Boolean);
        let profiles = {};
        try {
          const pData = await apiGet('profiles', 'id=in.(' + partyIds.join(',') + ')');
          if (Array.isArray(pData)) for (const p of pData) profiles[p.id] = p;
        } catch (e) {}

        // 3) KYC des 2 parties (le plus récent par user)
        let kycs = {};
        try {
          const kData = await apiGet('kyc_verifications', 'user_id=in.(' + partyIds.join(',') + ')&order=created_at.desc&limit=50');
          if (Array.isArray(kData)) {
            for (const k of kData) {
              if (!kycs[k.user_id]) kycs[k.user_id] = k; // le premier = plus récent
            }
          }
        } catch (e) {}

        // 4) Projet (optionnel)
        let project = null;
        if (c.project_id) {
          try {
            const prData = await apiGet('projects', 'id=eq.' + c.project_id);
            if (Array.isArray(prData) && prData[0]) project = prData[0];
          } catch (e) {}
        }

        // 5) Construit le HTML
        const investor = profiles[c.party_investor_id] || {};
        const provider = profiles[c.party_provider_id] || {};

        const shortNum = 'CTR-' + contractId.slice(0, 8).toUpperCase();
        const dateCreation = fmtDate(c.created_at);

        // Contenu personnalisé OU modèle standard
        let articlesHTML = '';
        if (c.content && c.content.trim().length > 10) {
          articlesHTML = '<div style="white-space:pre-wrap; font-size:12px; line-height:1.7; color:#1f2937; margin:12px 0;">' + esc(c.content) + '</div>';
        } else {
          articlesHTML = `
            <div class="article"><span class="article-num">Article 1 — Objet du contrat.</span> Le présent contrat a pour objet la réalisation des travaux décrits au projet associé.</div>
            <div class="article"><span class="article-num">Article 2 — Durée et délais.</span> Les travaux débuteront dès la signature par les deux parties et devront être achevés dans le délai convenu.</div>
            <div class="article"><span class="article-num">Article 3 — Montant et modalités.</span> Le montant total est de <strong>${fmtMoney(c.total_amount || c.amount)}</strong>. Le paiement sera effectué par jalons validés par le maître d'ouvrage.</div>
            <div class="article"><span class="article-num">Article 4 — Obligations du prestataire.</span> Le prestataire s'engage à fournir des factures authentiques, à respecter les normes en vigueur et à maintenir une communication régulière.</div>
            <div class="article"><span class="article-num">Article 5 — Pénalités de retard.</span> Tout retard non justifié entraînera une pénalité proportionnelle au montant total, définie d'un commun accord entre les parties.</div>
            <div class="article"><span class="article-num">Article 6 — Résiliation.</span> Le contrat peut être résilié avec un préavis de 15 jours en cas de manquement grave, par notification officielle via la plateforme.</div>
            <div class="article"><span class="article-num">Article 7 — Juridiction compétente.</span> Tout litige sera soumis à la juridiction compétente selon la localisation du projet.</div>
            <div class="article"><span class="article-num">Article 8 — Preuve et signature électronique.</span> Les parties acceptent la signature électronique comme preuve valable. Chaque signature est horodatée, tracée et liée au compte utilisateur.</div>
          `;
        }

        // Signatures
        const sigInvestorHTML = c.signature_investor
          ? (c.signature_investor.startsWith('data:image')
              ? '<img src="' + c.signature_investor + '" class="sig-img">'
              : '<div class="sig-text">' + esc(c.signature_investor) + '</div>')
          : '<div style="height:60px; border-bottom:1px solid #9ca3af;"></div>';

        const sigProviderHTML = c.signature_provider
          ? (c.signature_provider.startsWith('data:image')
              ? '<img src="' + c.signature_provider + '" class="sig-img">'
              : '<div class="sig-text">' + esc(c.signature_provider) + '</div>')
          : '<div style="height:60px; border-bottom:1px solid #9ca3af;"></div>';

        const statusInv = c.signed_by_investor_at ? '<div class="sig-status sig-ok">✅ Signé le ' + fmtDateTime(c.signed_by_investor_at) + '</div>' : '<div class="sig-status sig-wait">⏳ En attente de signature</div>';
        const statusProv = c.signed_by_provider_at ? '<div class="sig-status sig-ok">✅ Signé le ' + fmtDateTime(c.signed_by_provider_at) + '</div>' : '<div class="sig-status sig-wait">⏳ En attente de signature</div>';

        // KYC (annexe)
        let annexeHTML = '';
        const investorKyc = kycs[c.party_investor_id];
        const providerKyc = kycs[c.party_provider_id];

        if (investorKyc || providerKyc) {
          const buildKycBlock = async (title, kyc) => {
            if (!kyc) return '<div class="kyc-block"><div class="kyc-title">' + title + '</div><div style="color:#9ca3af; font-size:10px;">Aucun document fourni</div></div>';
            const frontUrl = kyc.document_front_url ? await getSignedUrl('kyc-documents', kyc.document_front_url) : null;
            const backUrl = kyc.document_back_url ? await getSignedUrl('kyc-documents', kyc.document_back_url) : null;
            const selfieUrl = kyc.selfie_url ? await getSignedUrl('kyc-documents', kyc.selfie_url) : null;

            return `
              <div class="kyc-block">
                <div class="kyc-title">${title} — ${esc(kyc.document_type || 'Pièce')}</div>
                <div class="kyc-imgs">
                  ${frontUrl ? '<div><img src="' + frontUrl + '" class="kyc-img"><div class="kyc-img-label">Recto</div></div>' : ''}
                  ${backUrl ? '<div><img src="' + backUrl + '" class="kyc-img"><div class="kyc-img-label">Verso</div></div>' : ''}
                </div>
              </div>
            `;
          };

          const invBlock = await buildKycBlock('Investisseur', investorKyc);
          const provBlock = await buildKycBlock('Prestataire', providerKyc);

          annexeHTML = `
            <div class="annexe-title">📎 Annexe — Pièces d'identité des parties</div>
            <div class="kyc-grid">
              ${invBlock}
              ${provBlock}
            </div>
          `;
        }

        // Header logo
        const html = `
          <div class="logo-box">
            <div class="logo-icon">🌍</div>
            <div>
              <div class="logo-text">ESPACE DIASPORA</div>
              <div class="logo-sub">CONSTRUCTION · DIASPORA · CONFIANCE</div>
            </div>
          </div>
          <div class="header-line"></div>

          <h1>${esc(c.title || 'Contrat de prestation')}</h1>
          <p style="text-align:center; font-size:11px; color:#6b7280; margin-bottom:16px;">
            N° ${shortNum} · Établi le ${dateCreation}
          </p>

          <h2>1. Entre les soussignés</h2>
          <div class="parties">
            <div class="party-box">
              <div class="party-title">L'Investisseur</div>
              <div class="party-name">${esc(investor.full_name || investor.email || 'Investisseur')}</div>
              <div class="party-line">Email : ${esc(investor.email || '—')}</div>
              <div class="party-line">Pays : ${esc(investor.country || '—')}</div>
              <div class="party-line">Statut KYC : ${investor.kyc_status === 'verified' ? '✅ Vérifié' : '⏳ En cours'}</div>
            </div>
            <div class="party-box">
              <div class="party-title">Le Prestataire</div>
              <div class="party-name">${esc(provider.full_name || provider.email || 'Prestataire')}</div>
              <div class="party-line">Email : ${esc(provider.email || '—')}</div>
              <div class="party-line">Pays : ${esc(provider.country || '—')}</div>
              <div class="party-line">Statut KYC : ${provider.kyc_status === 'verified' ? '✅ Vérifié' : '⏳ En cours'}</div>
            </div>
          </div>

          ${project ? `
            <h2>2. Projet concerné</h2>
            <p><strong>${esc(project.title)}</strong> — ${esc(project.city || '')}</p>
            ${project.description ? '<p style="font-size:11px; color:#6b7280;">' + esc(project.description) + '</p>' : ''}
          ` : ''}

          <h2>${project ? '3' : '2'}. Dispositions contractuelles</h2>
          ${articlesHTML}

          <div class="signatures">
            <div class="sig-box">
              <div class="sig-label">L'Investisseur</div>
              ${sigInvestorHTML}
              <div style="font-size:11px; font-weight:bold; margin-top:4px;">${esc(investor.full_name || '—')}</div>
              ${statusInv}
            </div>
            <div class="sig-box">
              <div class="sig-label">Le Prestataire</div>
              ${sigProviderHTML}
              <div style="font-size:11px; font-weight:bold; margin-top:4px;">${esc(provider.full_name || '—')}</div>
              ${statusProv}
            </div>
          </div>

          ${annexeHTML}

          <div class="footer-note">
            Document généré électroniquement par Espace Diaspora — diaspora.munitrace.org<br>
            Signature électronique conforme au Règlement eIDAS. Preuve horodatée et traçable.
          </div>
        `;

        container.innerHTML = html;

      } catch (e) {
        console.error('[contrat-detail]', e);
        container.innerHTML = '<div class="text-red-600 text-center py-10">Erreur de chargement du contrat</div>';
      }
    }

    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });

    loadAndRender();
  </script>
</body>
</html>
