<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouvelle transaction - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="portefeuille.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Nouvelle transaction</span>
    <span class="w-6"></span>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 text-center">
      <p class="text-xs text-slate-400">Solde actuel</p>
      <p class="text-2xl font-bold mt-1">18 000 000 <span class="text-sm text-slate-400">XAF</span></p>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4">
      <label class="text-xs font-semibold text-slate-300 mb-2 block">Type de transaction</label>
      <div class="grid grid-cols-3 gap-2">
        <button data-type="deposit" class="type-btn bg-emerald-600 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">💰</span>Dépôt
        </button>
        <button data-type="refund" class="type-btn bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">💸</span>Retrait
        </button>
        <button data-type="escrow_hold" class="type-btn bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">🔒</span>Séquestre
        </button>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4">
      <label class="text-xs font-semibold text-slate-300 mb-2 block">Montant</label>
      <div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-3">
        <span class="text-sm text-slate-400">XAF</span>
        <input type="number" id="amount" placeholder="0" class="flex-1 bg-transparent text-2xl font-bold text-white focus:outline-none">
      </div>
      <div class="flex gap-2 mt-3 overflow-x-auto">
        <button class="quick-amount bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-xs whitespace-nowrap" data-amount="100000">+ 100 000</button>
        <button class="quick-amount bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-xs whitespace-nowrap" data-amount="500000">+ 500 000</button>
        <button class="quick-amount bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-xs whitespace-nowrap" data-amount="1000000">+ 1 000 000</button>
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Projet concerné</label>
        <select id="project" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="">Sélectionner un projet</option>
          <option value="6f1d7e27-105a-45dc-ab31-71577e95f4f5">Construction Villa N'Djamena</option>
          <option value="demo2">Boutique Centre-ville</option>
          <option value="demo3">Ferme Avicole Moundou</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Description</label>
        <input type="text" id="description" placeholder="Motif de la transaction" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 mb-2 block">Date</label>
        <input type="date" id="date" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>
    </section>

    <section class="bg-white/5 border border-white/10 rounded-2xl p-4">
      <label class="text-xs font-semibold text-slate-300 mb-2 block">Méthode de paiement</label>
      <div class="grid grid-cols-2 gap-2">
        <button data-method="card" class="method-btn bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">💳</span>Carte bancaire
        </button>
        <button data-method="bank" class="method-btn bg-emerald-600 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">🏦</span>Virement
        </button>
        <button data-method="mobile" class="method-btn bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">📱</span>Mobile Money
        </button>
        <button data-method="paypal" class="method-btn bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-1">
          <span class="text-lg">🅿️</span>PayPal
        </button>
      </div>
    </section>

    <section class="bg-slate-800/50 border border-white/10 rounded-2xl p-4 space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-slate-400">Montant</span><span id="recap-amount">0 XAF</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Frais</span><span>0 XAF</span></div>
      <div class="flex justify-between font-bold text-base pt-2 border-t border-white/10"><span>Total</span><span id="recap-total">0 XAF</span></div>
    </section>

    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3">
      <p class="text-xs text-amber-200">⚠️ Vérifiez bien les informations avant de valider. Les transactions ne peuvent pas être annulées.</p>
    </div>

    <section class="flex gap-2">
      <a href="portefeuille.html" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl font-semibold text-sm text-center">Annuler</a>
      <button id="btn-confirm" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-semibold text-sm">Confirmer</button>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script>
    let txType = 'deposit';
    let txMethod = 'bank';

    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        txType = btn.dataset.type;
      });
    });

    document.querySelectorAll('.method-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.method-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        txMethod = btn.dataset.method;
      });
    });

    document.querySelectorAll('.quick-amount').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('amount').value = btn.dataset.amount;
        updateRecap();
      });
    });

    function updateRecap() {
      const amount = Number(document.getElementById('amount').value) || 0;
      document.getElementById('recap-amount').textContent = amount.toLocaleString() + ' XAF';
      document.getElementById('recap-total').textContent = amount.toLocaleString() + ' XAF';
    }

    document.getElementById('amount').addEventListener('input', updateRecap);

    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('btn-confirm').addEventListener('click', async () => {
      const amount = Number(document.getElementById('amount').value);
      const projectId = document.getElementById('project').value;
      const description = document.getElementById('description').value.trim();
      const date = document.getElementById('date').value;

      if (!amount || amount <= 0) { alert('Entrez un montant valide'); return; }
      if (!projectId) { alert('Sélectionnez un projet'); return; }
      if (!description) { alert('Ajoutez une description'); return; }

      if (!confirm('Confirmer cette transaction de ' + amount.toLocaleString() + ' XAF ?')) return;

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/transactions', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            project_id: projectId,
            initiated_by: TEST_USER_ID,
            transaction_type: txType,
            status: 'pending',
            amount: amount,
            currency: 'XAF',
            payment_provider: txMethod,
            description: description
          })
        });
        if (res.ok) {
          alert('Transaction enregistrée !');
          window.location.href = 'portefeuille.html';
        } else {
          alert('Erreur lors de l\'enregistrement');
        }
      } catch (e) {
        alert('Erreur réseau : ' + e.message);
      }
    });
  </script>
</body>
</html>
