<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapports à vérifier - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Rapports à vérifier</h1>
      <p class="text-sm text-slate-400 mt-1">Validez les rapports avant transmission aux clients</p>
    </div>

    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-amber-400" id="stat-pending">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">En attente</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-emerald-400" id="stat-published">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Publiés</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-red-400" id="stat-rejected">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Refusés</div>
      </div>
    </section>

    <div id="reports-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-validations.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">✅</span>Validations</a>
    <a href="admin-reports.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">📸</span>Rapports</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    async function loadReports() {
      const list = document.getElementById('reports-list');
      try {
        const data = await apiGet('reports', 'order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];

        document.getElementById('stat-pending').textContent = valid.filter(r => r.status === 'pending_review').length;
        document.getElementById('stat-published').textContent = valid.filter(r => r.status === 'published').length;
        document.getElementById('stat-rejected').textContent = valid.filter(r => r.status === 'rejected').length;

        if (valid.length === 0) {
          list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">📭</div><p class="text-slate-400 text-sm">Aucun rapport</p></div>';
          return;
        }

        // En attente d'abord
        valid.sort((a, b) => {
          const order = { 'pending_review': 0, 'published': 1, 'rejected': 2 };
          return (order[a.status] || 3) - (order[b.status] || 3);
        });

        list.innerHTML = valid.map(r => {
          const isPending = r.status === 'pending_review';
          const isPublished = r.status === 'published';
          const isRejected = r.status === 'rejected';

          let badge = '';
          if (isPending) badge = '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">EN ATTENTE</span>';
          else if (isPublished) badge = '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">PUBLIÉ</span>';
          else if (isRejected) badge = '<span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full font-bold">REFUSÉ</span>';

          return `
            <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
              <div class="flex justify-between items-start gap-3 mb-3">
                <h3 class="font-extrabold text-sm flex-1">${escapeHtml(r.title)}</h3>
                ${badge}
              </div>

              <p class="text-xs text-slate-300 leading-relaxed mb-3">${escapeHtml(r.content)}</p>

              <div class="flex justify-between items-center text-[11px] text-slate-400 mb-3">
                <span>📊 Avancement : <span class="text-amber-300 font-bold">${r.progress_percent || 0}%</span></span>
                <span>${formatDate(r.created_at)}</span>
              </div>

              ${r.blockers ? `<p class="text-[11px] text-red-300 mb-3">⚠️ Blocage : ${escapeHtml(r.blockers)}</p>` : ''}

              ${isPending ? `
                <div class="grid grid-cols-2 gap-2">
                  <button class="publish-btn w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold py-3 rounded-xl text-xs transition" data-id="${r.id}">
                    ✅ Publier au client
                  </button>
                  <button class="reject-btn w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-3 rounded-xl text-xs transition" data-id="${r.id}">
                    ❌ Refuser
                  </button>
                </div>
              ` : ''}

              ${isRejected && r.rejection_reason ? `
                <p class="text-[10px] text-red-300 mt-2">Motif : ${escapeHtml(r.rejection_reason)}</p>
              ` : ''}
            </div>
          `;
        }).join('');

        document.querySelectorAll('.publish-btn').forEach(btn => {
          btn.addEventListener('click', () => handleReview(btn.dataset.id, 'published'));
        });
        document.querySelectorAll('.reject-btn').forEach(btn => {
          btn.addEventListener('click', () => handleReview(btn.dataset.id, 'rejected'));
        });

      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur : ' + e.message + '</p>';
      }
    }

    async function handleReview(reportId, newStatus) {
      let reason = null;
      if (newStatus === 'rejected') {
        reason = prompt('Motif du refus (sera visible par l\'artisan) :');
        if (!reason) return;
      } else {
        if (!confirm('Publier ce rapport ? Le client pourra le voir.')) return;
      }

      try {
        await apiPatch('reports', reportId, {
          status: newStatus,
          reviewed_at: new Date().toISOString(),
          reviewed_by: getCurrentUserId(),
          rejection_reason: reason
        });

        try {
          await apiPost('audit_log', {
            actor_id: getCurrentUserId(),
            action: 'update',
            table_name: 'reports',
            record_id: reportId,
            new_data: { status: newStatus, reason: reason }
          });
        } catch (e) {}

        showSuccess(newStatus === 'published' ? 'Rapport publié au client !' : 'Rapport refusé');
        loadReports();
      } catch (e) {
        showError(e.message);
      }
    }

    loadReports();
  </script>
</body>
</html>
