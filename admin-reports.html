<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapports à vérifier - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Rapports à vérifier</h1>
      <p class="text-sm text-slate-400 mt-1">Touchez un rapport pour le lire en entier</p>
    </div>

    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-amber-400" id="stat-pending">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">En attente</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-emerald-400" id="stat-published">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Publiés</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-lg font-bold text-red-400" id="stat-rejected">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Refusés</div>
      </div>
    </section>

    <div id="reports-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-validations.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">✅</span>Validations</a>
    <a href="admin-reports.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">📸</span>Rapports</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    async function loadReports() {
      const list = document.getElementById('reports-list');
      try {
        const data = await apiGet('reports', 'order=created_at.desc');
        const valid = Array.isArray(data) ? data : [];

        document.getElementById('stat-pending').textContent = valid.filter(r => r.status === 'pending_review').length;
        document.getElementById('stat-published').textContent = valid.filter(r => r.status === 'published').length;
        document.getElementById('stat-rejected').textContent = valid.filter(r => r.status === 'rejected').length;

        if (valid.length === 0) {
          list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">📭</div><p class="text-slate-400 text-sm">Aucun rapport</p></div>';
          return;
        }

        valid.sort((a, b) => {
          const order = { 'pending_review': 0, 'published': 1, 'rejected': 2 };
          return (order[a.status] || 3) - (order[b.status] || 3);
        });

        list.innerHTML = valid.map(r => {
          let badge = '';
          if (r.status === 'pending_review') badge = '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">EN ATTENTE</span>';
          else if (r.status === 'published') badge = '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">PUBLIÉ</span>';
          else if (r.status === 'rejected') badge = '<span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full font-bold">REFUSÉ</span>';

          return `
            <a href="admin-report-detail.html?id=${r.id}" class="block bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
              <div class="flex justify-between items-start gap-3 mb-2">
                <h3 class="font-extrabold text-sm flex-1">${escapeHtml(r.title)}</h3>
                ${badge}
              </div>
              <p class="text-xs text-slate-400 leading-relaxed mb-3">${escapeHtml((r.content || '').substring(0, 100))}${(r.content || '').length > 100 ? '...' : ''}</p>
              <div class="flex justify-between items-center text-[11px]">
                <span class="text-slate-400">📊 <span class="text-amber-300 font-bold">${r.progress_percent || 0}%</span></span>
                <span class="text-sky-400 font-bold">Ouvrir →</span>
              </div>
            </a>
          `;
        }).join('');

      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm text-center py-6">Erreur : ' + e.message + '</p>';
      }
    }

    loadReports();
  </script>
</body>
</html>
