<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="dashboard-investisseur.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Notifications</span>
    <button id="btn-mark-all" class="text-[10px] bg-emerald-600 px-3 py-1.5 rounded-lg font-semibold">Tout lire</button>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <span id="unread-count" class="inline-block text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full font-semibold">Chargement...</span>

    <div class="flex gap-2 overflow-x-auto pb-1">
      <button data-filter="all" class="filter-btn bg-emerald-600 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Toutes</button>
      <button data-filter="unread" class="filter-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Non lues</button>
    </div>

    <div id="notif-list" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const userId = getCurrentUserId();
    let allNotifs = [];

    // Icône selon le type de notification
    function typeToIcon(type) {
      const map = {
        'payment_received': { ic: '💰', color: 'bg-emerald-500/20' },
        'payment_released': { ic: '💰', color: 'bg-blue-500/20' },
        'milestone_validated': { ic: '✅', color: 'bg-emerald-500/20' },
        'milestone_rejected': { ic: '❌', color: 'bg-red-500/20' },
        'milestone_created': { ic: '📋', color: 'bg-slate-500/20' },
        'report_submitted': { ic: '📸', color: 'bg-amber-500/20' },
        'report_validated': { ic: '✅', color: 'bg-emerald-500/20' },
        'report_rejected': { ic: '❌', color: 'bg-red-500/20' },
        'invitation_sent': { ic: '🎫', color: 'bg-purple-500/20' },
        'account_activated': { ic: '🎉', color: 'bg-purple-500/20' }
      };
      return map[type] || { ic: '🔔', color: 'bg-slate-500/20' };
    }

    function renderNotifs(list) {
      const container = document.getElementById('notif-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">🔔</div><p class="text-slate-400 text-sm">Aucune notification</p><p class="text-slate-500 text-xs mt-1">Vos notifications apparaîtront ici.</p></div>';
        return;
      }
      container.innerHTML = list.map(n => {
        const { ic, color } = typeToIcon(n.type);
        const isUnread = !n.read_at;
        const clickable = !!n.link;
        return `
          <div class="notif-item flex gap-3 bg-white/5 border border-white/10 rounded-2xl p-3 ${isUnread ? 'ring-1 ring-emerald-500/30' : ''} ${clickable ? 'cursor-pointer hover:bg-white/10' : ''} transition" data-id="${n.id}" data-link="${n.link || ''}">
            <div class="w-10 h-10 rounded-full ${color} flex items-center justify-center text-lg flex-shrink-0">${ic}</div>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-semibold text-sm leading-tight">${escapeHtml(n.title)}</h3>
                ${isUnread ? '<span class="w-2 h-2 bg-emerald-400 rounded-full mt-1.5 flex-shrink-0"></span>' : ''}
              </div>
              ${n.message ? `<p class="text-xs text-slate-300 mt-1 leading-relaxed">${escapeHtml(n.message)}</p>` : ''}
              <span class="text-[10px] text-slate-500 mt-1.5 inline-block">${formatDate(n.created_at)}</span>
            </div>
          </div>
        `;
      }).join('');

      // Attache les événements de clic
      document.querySelectorAll('.notif-item').forEach(el => {
        el.addEventListener('click', async () => {
          const notifId = el.dataset.id;
          const link = el.dataset.link;

          // Marquer comme lu
          try {
            await apiPatch('notifications', notifId, {
              read_at: new Date().toISOString()
            });
          } catch (e) {}

          // Rediriger
          if (link) {
            window.location.href = link;
          } else {
            loadNotifs();
          }
        });
      });
    }

    function updateUnread() {
      const unread = allNotifs.filter(n => !n.read_at).length;
      const el = document.getElementById('unread-count');
      if (unread === 0) {
        el.textContent = 'Aucune non lue';
        el.className = 'inline-block text-xs bg-slate-500/20 text-slate-300 px-3 py-1 rounded-full font-semibold';
      } else {
        el.textContent = unread + ' non lue' + (unread > 1 ? 's' : '');
        el.className = 'inline-block text-xs bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-semibold';
      }
    }

    async function loadNotifs() {
      try {
        const data = await apiGet('notifications', 'user_id=eq.' + userId + '&order=created_at.desc&limit=50');
        allNotifs = Array.isArray(data) ? data : [];
      } catch (e) {
        allNotifs = [];
      }
      renderNotifs(allNotifs);
      updateUnread();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        const f = btn.dataset.filter;
        if (f === 'unread') {
          renderNotifs(allNotifs.filter(n => !n.read_at));
        } else {
          renderNotifs(allNotifs);
        }
      });
    });

    document.getElementById('btn-mark-all').addEventListener('click', async () => {
      const unread = allNotifs.filter(n => !n.read_at);
      if (unread.length === 0) return;

      for (const n of unread) {
        try {
          await apiPatch('notifications', n.id, {
            read_at: new Date().toISOString()
          });
        } catch (e) {}
      }
      await loadNotifs();
    });

    loadNotifs();
  </script>
</body>
</html>
