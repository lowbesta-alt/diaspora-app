<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <a href="dashboard-investisseur.html" class="text-2xl">←</a>
    <span class="font-bold text-sm">Notifications</span>
    <button id="btn-mark-all" class="text-[10px] bg-emerald-600 px-3 py-1.5 rounded-lg font-semibold">Tout lire</button>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <span id="unread-count" class="inline-block text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full font-semibold">...</span>

    <div class="flex gap-2 overflow-x-auto pb-1">
      <button data-filter="all" class="filter-btn bg-emerald-600 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Toutes</button>
      <button data-filter="unread" class="filter-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">Non lues</button>
    </div>

    <div id="notif-list" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    const userId = getCurrentUserId();
    let allNotifs = [];
    let readIds = JSON.parse(localStorage.getItem('read_notifs') || '[]');

    function actionToIcon(action) {
      const map = {
        'milestone_validated': { ic: '✅', color: 'bg-emerald-500/20' },
        'funds_released': { ic: '💰', color: 'bg-blue-500/20' },
        'insert': { ic: '📋', color: 'bg-slate-500/20' },
        'update': { ic: '✏️', color: 'bg-orange-500/20' },
        'delete': { ic: '🗑️', color: 'bg-red-500/20' },
        'contract_signed': { ic: '📝', color: 'bg-purple-500/20' },
        'kyc_approved': { ic: '🛡️', color: 'bg-emerald-500/20' }
      };
      return map[action] || { ic: '🔔', color: 'bg-slate-500/20' };
    }

    function actionToText(action) {
      const map = {
        'milestone_validated': 'Jalon validé',
        'funds_released': 'Fonds débloqués',
        'insert': 'Nouvel élément créé',
        'update': 'Modification enregistrée',
        'delete': 'Suppression',
        'contract_signed': 'Contrat signé',
        'kyc_approved': 'Vérification approuvée'
      };
      return map[action] || action;
    }

    function renderNotifs(list) {
      const container = document.getElementById('notif-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-8"><p class="text-slate-400 text-sm">Aucune notification</p></div>';
        return;
      }
      container.innerHTML = list.map(n => {
        const { ic, color } = actionToIcon(n.action);
        const isUnread = !readIds.includes(n.id);
        return `
          <div class="flex gap-3 bg-white/5 border border-white/10 rounded-2xl p-3 ${isUnread ? 'ring-1 ring-emerald-500/30' : ''}">
            <div class="w-10 h-10 rounded-full ${color} flex items-center justify-center text-lg flex-shrink-0">${ic}</div>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-semibold text-sm">${escapeHtml(actionToText(n.action))}</h3>
                ${isUnread ? '<span class="w-2 h-2 bg-emerald-400 rounded-full mt-1.5 flex-shrink-0"></span>' : ''}
              </div>
              <p class="text-xs text-slate-300 mt-0.5 truncate">${escapeHtml(n.table_name || '')}</p>
              <span class="text-[10px] text-slate-500">${formatDate(n.created_at)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateUnread() {
      const unread = allNotifs.filter(n => !readIds.includes(n.id)).length;
      document.getElementById('unread-count').textContent = unread + ' non lue' + (unread > 1 ? 's' : '');
    }

    async function loadNotifs() {
      try {
        const data = await apiGet('audit_log', 'order=created_at.desc&limit=30');
        allNotifs = Array.isArray(data) ? data : [];
      } catch (e) {
        allNotifs = [];
      }
      renderNotifs(allNotifs);
      updateUnread();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-emerald-600');
          b.classList.add('bg-white/5', 'border', 'border-white/10');
        });
        btn.classList.add('bg-emerald-600');
        btn.classList.remove('bg-white/5', 'border', 'border-white/10');
        const f = btn.dataset.filter;
        if (f === 'unread') {
          renderNotifs(allNotifs.filter(n => !readIds.includes(n.id)));
        } else {
          renderNotifs(allNotifs);
        }
      });
    });

    document.getElementById('btn-mark-all').addEventListener('click', () => {
      readIds = allNotifs.map(n => n.id);
      localStorage.setItem('read_notifs', JSON.stringify(readIds));
      renderNotifs(allNotifs);
      updateUnread();
    });

    loadNotifs();
  </script>
</body>
</html>
