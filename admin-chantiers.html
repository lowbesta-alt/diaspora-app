<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantiers - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Tous les chantiers</h1>
      <p class="text-sm text-slate-400 mt-1">Vue globale de la plateforme</p>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Rechercher un projet..." class="w-full pxy-3 rounded-xl bg-white/5 text-sm placeholder-slate-500 focus:outline-none transition" style="border: 1px solid rgba(16,185,129,0.3);">

    <section class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold" id="stat-total">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-emerald-400" id="stat-active">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Actifs</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-orange-400" id="stat-draft">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Prep.</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-slate-400" id="stat-done">-</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Termines</div>
      </div>
    </section>

    <div id="projets-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    let allProjects = [];

    function render(list) {
      const container = document.getElementById('projets-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">🏗️</div><p class="text-slate-400 text-sm">Aucun projet</p></div>';
        return;
      }
      container.innerHTML = list.map(p => `
        <a href="projet-detail.html?id=${p.id}" class="block bg-white/5 border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-extrabold text-sm">${escapeHtml(p.title)}</h3>
            ${renderStatusBadge(p.status)}
          </div>
          <p class="text-xs text-slate-400 mb-3">${escapeHtml(p.description || '')}</p>
          <div class="flex justify-between text-[11px] text-slate-400">
            <span>📍 ${escapeHtml(p.city || '')}, ${escapeHtml(p.country || '')}</span>
            <span>${formatAmount(p.total_budget, p.currency)}</span>
          </div>
        </a>
      `).join('');
    }

    function updateStats(list) {
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-active').textContent = list.filter(p => p.status === 'active').length;
      document.getElementById('stat-draft').textContent = list.filter(p => p.status === 'draft').length;
      document.getElementById('stat-done').textContent = list.filter(p => p.status === 'completed').length;
    }

    async function load() {
      try {
        const data = await apiGet('projects', 'order=created_at.desc');
        allProjects = Array.isArray(data) ? data : [];
      } catch (e) {
        allProjects = [];
      }
      render(allProjects);
      updateStats(allProjects);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      render(allProjects.filter(p => p.title.toLowerCase().includes(q)));
    });

    load();
  </script>
