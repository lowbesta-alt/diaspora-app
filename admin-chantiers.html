<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantiers - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-3 max-w-3xl mx-auto space-y-4 pt-6" style="width: 100%; box-sizing: border-box;">

    <div>
      <h1 class="text-xl font-extrabold tracking-tight">Tous les chantiers</h1>
      <p class="text-xs text-slate-400 mt-1">Assignez les artisans aux projets validés</p>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Rechercher un projet..." class="w-full px-4 py-3 rounded-xl bg-white/5 text-sm placeholder-slate-500 focus:outline-none transition" style="border: 1px solid rgba(16,185,129,0.3); box-sizing: border-box;">

    <section class="grid grid-cols-4 gap-1.5 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-2">
        <div class="text-sm font-bold" id="stat-total">-</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2">
        <div class="text-sm font-bold text-emerald-400" id="stat-active">-</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Actifs</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2">
        <div class="text-sm font-bold text-orange-400" id="stat-draft">-</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Prép.</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2">
        <div class="text-sm font-bold text-slate-400" id="stat-done">-</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Terminés</div>
      </div>
    </section>

    <div id="projets-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireRole(['admin'])) throw new Error('Not allowed');

    let allProjects = [];
    let approvedArtisans = [];
    const artisansById = {};

    async function loadApprovedArtisans() {
      try {
        const partnerships = await apiGet('partnership_requests', 'status=eq.approved&order=company_name');
        const validPartnerships = Array.isArray(partnerships) ? partnerships : [];

        const profiles = await apiGet('profiles', 'select=id,email,full_name,default_role');
        const validProfiles = Array.isArray(profiles) ? profiles : [];

        const profilesByEmail = {};
        for (const p of validProfiles) {
          if (p.email) profilesByEmail[p.email.toLowerCase().trim()] = p;
        }

        approvedArtisans = validPartnerships.map(part => {
          const emailKey = (part.email || '').toLowerCase().trim();
          const profile = profilesByEmail[emailKey] || null;
          const artisan = {
            partnership: part,
            profileId: profile ? profile.id : null,
            displayName: part.company_name || part.contact_name || 'Artisan sans nom',
            profession: part.profession || '',
            email: part.email || '',
            hasProfile: !!profile
          };
          if (artisan.profileId) artisansById[artisan.profileId] = artisan;
          return artisan;
        });
      } catch (e) {
        console.error('Erreur chargement artisans :', e);
        approvedArtisans = [];
      }
    }

    function renderProjectCard(p) {
      let assignedHtml = '';
      if (p.assigned_artisan_id) {
        const artisan = artisansById[p.assigned_artisan_id];
        if (artisan) {
          assignedHtml = `
            <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-3 py-2 mb-2" style="box-sizing:border-box;">
              <span class="text-emerald-400 flex-shrink-0">✓</span>
              <span class="text-[11px] text-emerald-200 truncate">
                Artisan : <strong>${escapeHtml(artisan.displayName)}</strong>
              </span>
            </div>
          `;
        } else {
          assignedHtml = `
            <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-2 mb-2">
              <span class="text-amber-400 flex-shrink-0">⚠</span>
              <span class="text-[11px] text-amber-200">Artisan assigné (profil introuvable)</span>
            </div>
          `;
        }
      }

      let optionsHtml = '<option value="">— Choisir —</option>';
      for (const a of approvedArtisans) {
        const isSelected = a.profileId === p.assigned_artisan_id;
        const label = a.displayName + (a.profession ? ' — ' + a.profession : '');
        const disabledAttr = a.hasProfile ? '' : ' disabled';
        const profileTag = a.hasProfile ? '' : ' (sans compte)';
        optionsHtml += `<option value="${a.profileId || ''}" ${isSelected ? 'selected' : ''}${disabledAttr}>${escapeHtml(label)}${profileTag}</option>`;
      }

      const assignBtnLabel = p.assigned_artisan_id ? 'Changer' : 'Assigner';

      return `
        <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden" style="width:100%; box-sizing:border-box;">
          <a href="projet-detail.html?id=${p.id}" class="block p-4 hover:bg-white/10 transition">
            <div class="flex justify-between items-start gap-2 mb-2">
              <h3 class="font-extrabold text-sm truncate">${escapeHtml(p.title)}</h3>
              ${renderStatusBadge(p.status)}
            </div>
            <p class="text-xs text-slate-400 mb-3 line-clamp-2" style="overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">${escapeHtml(p.description || '')}</p>
            <div class="flex justify-between gap-2 text-[11px] text-slate-400">
              <span class="truncate">📍 ${escapeHtml(p.city || '')}</span>
              <span class="flex-shrink-0">${formatAmount(p.total_budget, p.currency)}</span>
            </div>
          </a>

          <div class="px-4 pb-4 pt-3 border-t border-white/10">
            ${assignedHtml}
            <div class="flex flex-col gap-2">
              <select
                id="artisan-select-${p.id}"
                class="w-full px-3 py-2.5 rounded-xl bg-slate-800/50 border border-white/10 focus:border-amber-500 outline-none text-white text-xs"
                ${approvedArtisans.length === 0 ? 'disabled' : ''}
                style="box-sizing:border-box; max-width:100%;"
              >
                ${approvedArtisans.length === 0
                  ? '<option value="">Aucun artisan approuvé</option>'
                  : optionsHtml}
              </select>
              <button
                id="btn-assign-${p.id}"
                data-project-id="${p.id}"
                data-old-artisan="${p.assigned_artisan_id || ''}"
                class="assign-btn w-full bg-amber-500 hover:bg-amber-400 text-[#0a1838] font-extrabold py-2.5 px-4 rounded-xl text-xs transition disabled:opacity-50 disabled:cursor-not-allowed"
                ${approvedArtisans.length === 0 ? 'disabled' : ''}
              >
                ${assignBtnLabel}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function render(list) {
      const container = document.getElementById('projets-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><div class="text-4xl mb-3 opacity-40">🏗️</div><p class="text-slate-400 text-sm">Aucun projet</p></div>';
        return;
      }
      container.innerHTML = list.map(renderProjectCard).join('');

      document.querySelectorAll('.assign-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const projectId = btn.dataset.projectId;
          const oldArtisanId = btn.dataset.oldArtisan || null;
          const select = document.getElementById('artisan-select-' + projectId);
          const newArtisanId = select ? select.value : '';
          assignArtisan(projectId, newArtisanId, oldArtisanId, btn);
        });
      });
    }

    async function assignArtisan(projectId, artisanProfileId, oldAssignedId, btn) {
      if (!artisanProfileId) { alert('Veuillez sélectionner un artisan.'); return; }
      if (artisanProfileId === oldAssignedId) { alert('Cet artisan est déjà assigné à ce projet.'); return; }

      const artisan = artisansById[artisanProfileId];
      const artisanName = artisan ? artisan.displayName : 'cet artisan';
      if (!confirm('Confirmer l\'assignation de « ' + artisanName + ' » à ce projet ?')) return;

      btn.disabled = true;
      const originalLabel = btn.textContent;
      btn.textContent = '...';

      let projectMemberCreated = null;

      try {
        if (oldAssignedId && oldAssignedId !== artisanProfileId) {
          try {
            const oldRows = await apiGet('project_members', 'project_id=eq.' + projectId + '&user_id=eq.' + oldAssignedId + '&is_active=eq.true');
            if (Array.isArray(oldRows)) {
              for (const row of oldRows) await apiPatch('project_members', row.id, { is_active: false });
            }
          } catch (e) {}
        }

        const existingRows = await apiGet('project_members', 'project_id=eq.' + projectId + '&user_id=eq.' + artisanProfileId);
        const existingList = Array.isArray(existingRows) ? existingRows : [];
        const activeRow = existingList.find(r => r.is_active === true);

        if (!activeRow && existingList.length > 0) {
          await apiPatch('project_members', existingList[0].id, { is_active: true, role: 'provider' });
        } else if (!activeRow) {
          const created = await apiPost('project_members', { project_id: projectId, user_id: artisanProfileId, role: 'provider', is_active: true });
          projectMemberCreated = Array.isArray(created) && created[0] ? created[0].id : null;
        }

        await apiPatch('projects', projectId, {
          assigned_artisan_id: artisanProfileId,
          updated_at: new Date().toISOString()
        });

        try {
          await apiPost('audit_log', {
            actor_id: getCurrentUserId(),
            action: 'assign_artisan',
            table_name: 'projects',
            record_id: projectId,
            new_data: { assigned_artisan_id: artisanProfileId, previous: oldAssignedId || null }
          });
        } catch (e) {}

        showSuccess('✅ Artisan assigné.');
        await load();

      } catch (err) {
        if (projectMemberCreated) {
          try { await apiDelete('project_members', projectMemberCreated); } catch (e) {}
        }
        showError('Échec : ' + err.message);
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }

    function updateStats(list) {
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-active').textContent = list.filter(p => p.status === 'active').length;
      document.getElementById('stat-draft').textContent = list.filter(p => p.status === 'draft').length;
      document.getElementById('stat-done').textContent = list.filter(p => p.status === 'completed').length;
    }

    async function load() {
      try {
        const data = await apiGet('projects', 'order=created_at.desc');
        allProjects = Array.isArray(data) ? data : [];
      } catch (e) {
        allProjects = [];
      }
      render(allProjects);
      updateStats(allProjects);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { render(allProjects); return; }
      render(allProjects.filter(p => (p.title || '').toLowerCase().includes(q)));
    });

    (async function init() {
      await loadApprovedArtisans();
      await load();
    })();
  </script>
</body>
</html>
