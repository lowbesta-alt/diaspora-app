<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantiers - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Tous les chantiers</h1>
      <p class="text-sm text-slate-400 mt-1">Vue globale de la plateforme et attribution</p>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Rechercher un projet..." class="w-full px-4 py-3 rounded-xl bg-white/5 text-sm placeholder-slate-500 focus:outline-none transition" style="border: 1px solid rgba(16,185,129,0.3);">

    <section class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold" id="stat-total">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-emerald-400" id="stat-active">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Actifs</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-orange-400" id="stat-draft">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Prep.</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-3">
        <div class="text-base font-bold text-slate-400" id="stat-done">0</div>
        <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Termines</div>
      </div>
    </section>

    <div id="projets-list" class="space-y-3">
      <p class="text-slate-400 text-sm text-center py-8">Chargement en cours...</p>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-sky-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allProjects = [];
    let artisansList = [];

    async function initPage() {
      const container = document.getElementById('projets-list');
      try {
        const projRes = typeof apiGet === 'function' ? await apiGet('projects', 'order=created_at.desc') : [];
        allProjects = Array.isArray(projRes) ? projRes : (projRes?.data || []);

        const profRes = typeof apiGet === 'function' ? await apiGet('profiles') : [];
        const profilesList = Array.isArray(profRes) ? profRes : (profRes?.data || []);

        // Filtrage spécifique pour ne garder que les artisans dans la liste des chantiers
        artisansList = profilesList.filter(u => {
          const roleValue = u.role || u.user_type || u.type || '';
          return roleValue.toLowerCase().trim() === 'artisan';
        });

        renderProjects(allProjects);
        updateStats(allProjects);
      } catch (e) {
        console.error("Erreur critique :", e);
        container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs">Erreur : ${e.message}</div>`;
      }
    }

    function renderProjects(list) {
      const container = document.getElementById('projets-list');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">Aucun projet trouvé</p></div>';
        return;
      }

      container.innerHTML = list.map(p => {
        let optionsHtml = '<option value="">-- Choisir un artisan --</option>';
        if (artisansList.length > 0) {
          optionsHtml += artisansList.map(a => {
            const name = a.full_name || a.name || a.email || 'Sans nom';
            return `<option value="${a.id}" ${p.artisan_id === a.id ? 'selected' : ''}>${name} [ARTISAN]</option>`;
          }).join('');
        } else {
          optionsHtml += '<option value="" disabled>Aucun artisan disponible</option>';
        }

        const titleText = p.title || 'Sans titre';
        const descText = p.description || '';
        const cityText = p.city || 'Ville non spécifiée';
        const countryText = p.country || '';
        const budgetText = typeof formatAmount === 'function' ? formatAmount(p.total_budget, p.currency) : (p.total_budget || 0) + ' XAF';

        return `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-4 transition space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-extrabold text-sm">${titleText}</h3>
                <p class="text-xs text-slate-400 mt-1">${descText}</p>
              </div>
              <div>${typeof renderStatusBadge === 'function' ? renderStatusBadge(p.status) : '<span class="text-xs px-2 py-1 bg-slate-700 rounded">' + (p.status || 'en cours') + '</span>'}</div>
            </div>

            <div class="flex justify-between text-[11px] text-slate-400 border-t border-white/5 pt-2">
              <span>📍 ${cityText}, ${countryText}</span>
              <span>${budgetText}</span>
            </div>

            <div class="bg-slate-900/90 p-3 rounded-xl border border-emerald-500/40 space-y-2">
              <label class="block text-xs font-medium text-emerald-400">Assigner un artisan :</label>
              <div class="flex gap-2">
                <select id="artisan-select-${p.id}" class="flex-1 bg-white/10 border border-white/20 rounded-lg p-2 text-xs text-white focus:outline-none bg-slate-800">
                  ${optionsHtml}
                </select>
                <button type="button" onclick="assignArtisan('${p.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition cursor-pointer">
                  Valider
                </button>
              </div>
            </div>

            <div class="text-right pt-1">
              <a href="projet-detail.html?id=${p.id}" class="text-xs text-sky-400 hover:underline">Voir les détails complets →</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats(list) {
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-active').textContent = list.filter(p => p.status === 'active' || p.status === 'assigne').length;
      document.getElementById('stat-draft').textContent = list.filter(p => p.status === 'draft').length;
      document.getElementById('stat-done').textContent = list.filter(p => p.status === 'completed').length;
    }

    async function assignArtisan(projectId) {
      const selectElem = document.getElementById(`artisan-select-${projectId}`);
      if (!selectElem) return;
      const artisanId = selectElem.value;

      if (!artisanId) {
        alert("Veuillez sélectionner un artisan dans la liste.");
        return;
      }

      try {
        await apiPatch('projects', projectId, { 
          artisan_id: artisanId, 
          status: 'assigne' 
        });
        alert("Chantier assigné avec succès !");
        initPage();
      } catch (e) {
        console.error("Erreur lors de l'assignation :", e);
        alert("Erreur lors de l'assignation du chantier.");
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderProjects(allProjects.filter(p => (p.title || '').toLowerCase().includes(q)));
    });

    initPage();
  </script>
</body>
</html>
