<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Chantiers - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-24">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Tous les chantiers</h1>
      <p class="text-sm text-slate-400 mt-1">Vue globale de la plateforme et attribution</p>
    </div>

    <!-- Barre de recherche -->
    <div class="relative">
      <input type="text" id="search-input" placeholder="Rechercher un projet..." oninput="filtrerChantiers()" 
        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- Compteurs -->
    <section class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-white" id="stat-total">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-emerald-400" id="stat-actifs">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Actifs</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-amber-400" id="stat-prep">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Prép.</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-sky-400" id="stat-termines">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Terminés</div>
      </div>
    </section>

    <!-- Liste des chantiers -->
    <div id="chantiers-list" class="space-y-3">
      <div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl">
        <p class="text-slate-400 text-sm">Chargement...</p>
      </div>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let globalChantiers = [];
    let globalArtisans = [];

    // Fonction principale de chargement robuste
    async function chargerDonnees() {
      const list = document.getElementById('chantiers-list');
      const token = localStorage.getItem('access_token');
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
        'Content-Type': 'application/json'
      };

      try {
        // 1. Charger en premier les artisans (si ça échoue, les chantiers s'afficheront quand même)
        try {
          const resArtisans = await fetch(SUPABASE_URL + '/rest/v1/partnership_requests?status=eq.approved&select=id,company_name,contact_name,profession', { headers });
          if (resArtisans.ok) {
            globalArtisans = await resArtisans.json();
          }
        } catch (err) {
          console.warn("Impossible de charger les artisans pour l'instant:", err);
        }

        // 2. Charger les chantiers
        const resChantiers = await fetch(SUPABASE_URL + '/rest/v1/chantiers?select=*', { headers });
        
        if (!resChantiers.ok) {
          throwErreur("Erreur HTTP: " + resChantiers.status);
          return;
        }

        const data = await resChantiers.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">Aucun chantier trouvé</p></div>';
          return;
        }

        globalChantiers = data;
        afficherChantiers(globalChantiers);

      } catch (e) {
        console.error("Erreur critique:", e);
        list.innerHTML = '<div class="text-center py-8 bg-red-500/10 border border-red-500/30 rounded-2xl"><p class="text-red-300 text-sm">Erreur de chargement des chantiers.</p></div>';
      }
    }

    function throwErreur(msg) {
      document.getElementById('chantiers-list').innerHTML = `<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">${msg}</p></div>`;
    }

    function afficherChantiers(chantiers) {
      const list = document.getElementById('chantiers-list');

      // Mise à jour des compteurs
      document.getElementById('stat-total').textContent = chantiers.length;
      document.getElementById('stat-actifs').textContent = chantiers.filter(c => c.status === 'actif' || c.status === 'active').length;
      document.getElementById('stat-prep').textContent = chantiers.filter(c => !c.status || c.status === 'prep' || c.status.toLowerCase().includes('préparation')).length;
      document.getElementById('stat-termines').textContent = chantiers.filter(c => c.status === 'termine' || c.status === 'completed').length;

      if (chantiers.length === 0) {
        list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">Aucun résultat</p></div>';
        return;
      }

      list.innerHTML = chantiers.map(c => {
        // Options de la liste déroulante des artisans
        let optionsHtml = '<option value="">-- Choisir un prestataire --</option>';
        if (Array.isArray(globalArtisans)) {
          globalArtisans.forEach(art => {
            const selected = (c.assigned_artisan_id === art.id || c.artisan_id === art.id) ? 'selected' : '';
            optionsHtml += `<option value="${art.id}" ${selected}>${art.company_name || art.contact_name || 'Artisan'} (${art.profession || 'BTP'})</option>`;
          });
        }

        return `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-extrabold text-sm text-white">${c.title || 'Projet'}</h3>
                <p class="text-[10px] text-slate-400 mt-0.5">📍 ${c.city || 'Ville non spécifiée'}</p>
              </div>
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold uppercase">${c.status || 'En préparation'}</span>
            </div>

            ${c.description ? `<p class="text-xs text-slate-300 bg-slate-800/20 p-2 rounded-lg">${c.description}</p>` : ''}

            <div class="text-xs text-slate-300 bg-slate-800/40 p-2.5 rounded-xl flex justify-between items-center">
              <span>Budget :</span>
              <span class="font-bold text-emerald-400">${c.budget ? c.budget + ' XAF' : 'Non défini'}</span>
            </div>

            <!-- Menu d'assignation -->
            <div class="bg-slate-800/60 p-3 rounded-xl space-y-2 border border-white/5">
              <label class="text-[11px] font-semibold text-slate-300 block">Assigner un prestataire :</label>
              <div class="flex gap-2">
                <select id="select-artisan-${c.id}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                  ${optionsHtml}
                </select>
                <button onclick="enregistrerAssignation('${c.id}')" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl transition whitespace-nowrap shadow">
                  Valider
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrerChantiers() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = globalChantiers.filter(c => 
        (c.title && c.title.toLowerCase().includes(query)) ||
        (c.city && c.city.toLowerCase().includes(query)) ||
        (c.description && c.description.toLowerCase().includes(query))
      );
      afficherChantiers(filtered);
    }

    async function enregistrerAssignation(chantierId) {
      const select = document.getElementById(`select-artisan-${chantierId}`);
      const artisanId = select.value;

      if (!artisanId) {
        alert("Veuillez sélectionner un artisan.");
        return;
      }

      try {
        const token = localStorage.getItem('access_token');
        const res = await fetch(SUPABASE_URL + `/rest/v1/chantiers?id=eq.${chantierId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ assigned_artisan_id: artisanId })
        });

        if (res.ok) {
          alert("Prestataire assigné avec succès !");
          chargerDonnees();
        } else {
          alert("Erreur lors de l'enregistrement de l'assignation.");
        }
      } catch (e) {
        console.error(e);
        alert("Erreur réseau.");
      }
    }

    // Lancement automatique dès le chargement de la page
    chargerDonnees();
  </script>
</body>
</html>
