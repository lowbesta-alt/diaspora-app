<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Chantiers - Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-24">

  <main class="p-4 max-w-3xl mx-auto space-y-4 pt-6">

    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Tous les chantiers</h1>
      <p class="text-sm text-slate-400 mt-1">Vue globale de la plateforme et attribution</p>
    </div>

    <!-- Barre de recherche -->
    <div class="relative">
      <input type="text" id="search-input" placeholder="Rechercher un projet..." 
        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- Compteurs -->
    <section class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-white" id="stat-total">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Total</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-emerald-400" id="stat-actifs">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Actifs</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-amber-400" id="stat-prep">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Prép.</div>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="text-base font-bold text-sky-400" id="stat-termines">0</div>
        <div class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Terminés</div>
      </div>
    </section>

    <!-- Liste des chantiers -->
    <div id="chantiers-list" class="space-y-3">
      <div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl">
        <p class="text-slate-400 text-sm">Chargement...</p>
      </div>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-admin.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🎯</span>Contrôle</a>
    <a href="admin-leads.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📋</span>Leads</a>
    <a href="admin-chantiers.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">🏗️</span>Chantiers</a>
    <a href="admin-partenaires.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">🤝</span>Partenaires</a>
    <a href="admin-utilisateurs.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👥</span>Users</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Code d'origine de la page chantiers
    async function loadChantiersOriginal() {
      const list = document.getElementById('chantiers-list');
      try {
        const token = localStorage.getItem('access_token');
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/chantiers?select=*',
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
              'Content-Type': 'application/json'
            }
          }
        );

        if (!res.ok) {
          list.innerHTML = '<div class="text-center py-8 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">Erreur de chargement des chantiers.</p></div>';
          return;
        }

        const data = await res.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = '<div class="text-center py-12 bg-white/5 border border-white/10 rounded-2xl"><p class="text-slate-400 text-sm">Aucun chantier trouvé</p></div>';
          return;
        }

        document.getElementById('stat-total').textContent = data.length;

        list.innerHTML = data.map(c => `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-extrabold text-sm text-white">${c.title || 'Projet'}</h3>
                <p class="text-[10px] text-slate-400 mt-0.5">📍 ${c.city || 'Ville non spécifiée'}</p>
              </div>
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold uppercase">${c.status || 'Prép.'}</span>
            </div>

            <div class="text-xs text-slate-300 bg-slate-800/40 p-2.5 rounded-xl flex justify-between items-center">
              <span>Budget :</span>
              <span class="font-bold text-emerald-400">${c.budget ? c.budget + ' XAF' : 'Non défini'}</span>
            </div>

            <div class="bg-slate-800/60 p-3 rounded-xl space-y-2 border border-white/5">
              <label class="text-[11px] font-semibold text-slate-300 block">Assigner un artisan :</label>
              <div class="flex gap-2">
                <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                  <option value="">-- Choisir un artisan --</option>
                </select>
                <button class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl transition shadow-md whitespace-nowrap">
                  Valider
                </button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (e) {
        console.error(e);
      }
    }

    loadChantiersOriginal();
  </script>
</body>
</html>
