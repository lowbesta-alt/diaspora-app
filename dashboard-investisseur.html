<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Espace Diaspora</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white pb-20">

  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center text-lg">🌍</div>
      <span class="font-bold text-sm">Espace Diaspora</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="notifications.html" class="relative text-xl">🔔<span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span></a>
      <a href="profil.html" class="w-9 h-9 rounded-full bg-emerald-500/30 flex items-center justify-center text-xs font-bold" data-user-avatar>IT</a>
    </div>
  </header>

  <main class="p-4 max-w-2xl mx-auto space-y-6">

    <section>
      <h1 class="text-2xl font-bold">Bonjour <span id="user-name">👋</span></h1>
      <p class="text-sm text-slate-400 mt-1">Voici un aperçu de vos projets</p>
    </section>

    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
        <div class="text-2xl">🌍</div>
        <div class="text-2xl font-bold mt-2" id="stat-projects">-</div>
        <div class="text-xs text-slate-400">Projets</div>
      </div>
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
        <div class="text-2xl">💰</div>
        <div class="text-2xl font-bold mt-2" id="stat-budget">-</div>
        <div class="text-xs text-slate-400">Budget total XAF</div>
      </div>
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
        <div class="text-2xl">✅</div>
        <div class="text-2xl font-bold mt-2" id="stat-validated">-</div>
        <div class="text-xs text-slate-400">Jalons validés</div>
      </div>
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
        <div class="text-2xl">⏳</div>
        <div class="text-2xl font-bold mt-2" id="stat-pending">-</div>
        <div class="text-xs text-slate-400">En attente</div>
      </div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold">Mes projets</h2>
        <a href="projet-creer.html" class="text-xs bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg font-semibold">+ Nouveau</a>
      </div>
      <div id="projects-list" class="space-y-3">
        <p class="text-slate-400 text-sm text-center py-6">Chargement...</p>
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-700/50 flex justify-around py-2 z-40">
    <a href="dashboard-investisseur.html" class="flex flex-col items-center gap-0.5 text-emerald-400 text-[10px]"><span class="text-lg">🏠</span>Accueil</a>
    <a href="projets.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">📁</span>Projets</a>
    <a href="portefeuille.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💰</span>Portefeuille</a>
    <a href="messages.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">💬</span>Messages</a>
    <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px]"><span class="text-lg">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('Not logged');

    async function loadDashboard() {
      const userId = getCurrentUserId();
      const email = getCurrentUserEmail() || '';
      document.getElementById('user-name').textContent = email.split('@')[0];

      try {
        const projects = await apiGet('projects', 'owner_id=eq.' + userId + '&order=created_at.desc');
        const validProjects = Array.isArray(projects) ? projects : [];

        document.getElementById('stat-projects').textContent = validProjects.length;
        const totalBudget = validProjects.reduce((s, p) => s + (Number(p.total_budget) || 0), 0);
        document.getElementById('stat-budget').textContent = (totalBudget / 1000000).toFixed(1) + 'M';

        let validatedCount = 0;
        let pendingCount = 0;
        for (const p of validProjects) {
          try {
            const milestones = await apiGet('milestones', 'project_id=eq.' + p.id);
            if (Array.isArray(milestones)) {
              validatedCount += milestones.filter(m => m.status === 'approved' || m.status === 'released').length;
              pendingCount += milestones.filter(m => m.status === 'submitted').length;
            }
          } catch (e) {}
        }
        document.getElementById('stat-validated').textContent = validatedCount;
        document.getElementById('stat-pending').textContent = pendingCount;

        const list = document.getElementById('projects-list');
        if (validProjects.length === 0) {
          list.innerHTML = '<div class="text-center py-6"><p class="text-slate-400 text-sm mb-3">Vous n\'avez pas encore de projet</p><a href="projet-creer.html" class="inline-block bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold">Creer mon premier projet</a></div>';
        } else {
          list.innerHTML = validProjects.slice(0, 5).map(p => `
            <a href="projet-detail.html?id=${p.id}" class="block bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4 hover:bg-white/10 transition">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-sm">${escapeHtml(p.title)}</h3>
                ${renderStatusBadge(p.status)}
              </div>
              <p class="text-xs text-slate-400 mb-3">${escapeHtml(p.description || '')}</p>
              <div class="flex justify-between text-[11px] text-slate-400">
                <span>💰 ${formatAmount(p.total_budget, p.currency)}</span>
                <span>📍 ${escapeHtml(p.city || '')}</span>
              </div>
            </a>
          `).join('');
        }

      } catch (e) {
        showError(e.message);
      }
    }

    loadDashboard();
    setupUserHeader();
  </script>
</body>
</html>
